<script>
(function () {
  'use strict';
  var PAGES = {"index.html":{"page":"index.html","title":"知行化学 · 高中化学智慧教学平台","bodyClass":"auth-page","body":"\n  \u003ca class=\"skip-link\" href=\"#authCard\">跳到登录表单\u003c/a>\n\n  \u003cdiv class=\"page-shell auth-topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"知行化学首页\">\n      \u003cspan class=\"brand-mark\">化\u003c/span>\n      \u003cspan class=\"brand-text\">\u003cstrong>知行化学\u003c/strong>\u003csmall>高中化学智慧教学平台\u003c/small>\u003c/span>\n    \u003c/a>\n    \u003cspan class=\"auth-topbar-note\">教学演示原型 · 数据仅保存在本机浏览器\u003c/span>\n  \u003c/div>\n\n  \u003cmain class=\"page-shell\">\n    \u003cdiv class=\"auth-wrap\">\n      \u003csection class=\"auth-intro\" aria-label=\"平台介绍\">\n        \u003cdiv>\n          \u003cspan class=\"intro-badge\">✧ AIGC × 高中化学 · 作业与评价\u003c/span>\n          \u003ch1 class=\"intro-title\">让每一次批改，\u003cbr>都成为\u003cspan>教学的起点\u003c/span>。\u003c/h1>\n          \u003cp class=\"intro-lead\">面向高中化学真实课堂，用多模态大模型读懂学生手写作业：给出等级、三维度评语与逐题解析，自动沉淀学生档案，并把个体错误汇成班级共性分析。\u003c/p>\n\n          \u003cdiv class=\"intro-points\">\n            \u003cdiv class=\"intro-point\">\n              \u003cspan class=\"intro-point-icon\">✓\u003c/span>\n              \u003cdiv>\u003cstrong>多模态批改，不只给一个分数\u003c/strong>\u003csmall>识别图片中的化学方程式与计算过程，区分箭头、配平、步骤与规范。\u003c/small>\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"intro-point\">\n              \u003cspan class=\"intro-point-icon\">↗\u003c/span>\n              \u003cdiv>\u003cstrong>从一次作业，看见成长轨迹\u003c/strong>\u003csmall>批改结果自动写入学生档案，生成等级趋势、薄弱点标签与最近解析。\u003c/small>\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"intro-point\">\n              \u003cspan class=\"intro-point-icon\">◎\u003c/span>\n              \u003cdiv>\u003cstrong>从个体错误，走向课堂改进\u003c/strong>\u003csmall>勾选多份作业生成共性问题报告，匿名展示优秀作答，服务教学决策。\u003c/small>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"intro-note\">\n          \u003cspan>◈ 纯网页 · 无需安装\u003c/span>\n          \u003cspan>◈ 未填 Key 自动使用演示数据\u003c/span>\n          \u003cspan>◈ 学生信息匿名化展示\u003c/span>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"auth-card\" id=\"authCard\" aria-label=\"登录与注册\">\n        \u003cdiv class=\"auth-session-banner\" id=\"sessionBanner\" hidden>\n          \u003cspan id=\"sessionText\">你已登录。\u003c/span>\n          \u003ca href=\"#\" id=\"continueLink\">进入工作台 →\u003c/a>\n        \u003c/div>\n\n        \u003cdiv class=\"auth-card-head\">\n          \u003ch2 id=\"authTitle\">欢迎回来\u003c/h2>\n          \u003cp id=\"authSubtitle\">登录后进入你的教学工作台或学习工作台。\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"auth-tabs\" role=\"tablist\" aria-label=\"登录或注册\">\n          \u003cbutton class=\"auth-tab\" type=\"button\" role=\"tab\" data-auth-tab=\"login\" aria-selected=\"true\" aria-controls=\"loginPanel\">登录\u003c/button>\n          \u003cbutton class=\"auth-tab\" type=\"button\" role=\"tab\" data-auth-tab=\"register\" aria-selected=\"false\" aria-controls=\"registerPanel\">注册新账号\u003c/button>\n        \u003c/div>\n\n        \u003cdiv class=\"alert alert-info\" id=\"authAlert\" hidden>\u003c/div>\n\n        \u003cdiv class=\"alert alert-warning\" id=\"restoreBar\" hidden>\n          \u003cspan class=\"alert-icon\">!\u003c/span>\n          \u003cdiv style=\"flex:1;\">\n            \u003cstrong>演示数据已清空。\u003c/strong> 可以重新注册账号，或一键恢复预置的教师/学生演示数据。\n            \u003cdiv style=\"margin-top:8px;\">\u003cbutton class=\"btn btn-secondary btn-sm\" type=\"button\" id=\"restoreDemo\">恢复预置演示数据\u003c/button>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cform class=\"auth-form\" id=\"loginForm\" autocomplete=\"on\" novalidate>\n          \u003cdiv class=\"field\">\n            \u003clabel>选择身份\u003c/label>\n            \u003cdiv class=\"role-choice\">\n              \u003clabel class=\"role-option\">\n                \u003cinput type=\"radio\" name=\"loginRole\" value=\"student\" checked>\n                \u003cspan class=\"role-title\">◈ 学生\u003c/span>\n                \u003cspan class=\"role-desc\">提交作业 · 查看批改 · 我的档案\u003c/span>\n              \u003c/label>\n              \u003clabel class=\"role-option\">\n                \u003cinput type=\"radio\" name=\"loginRole\" value=\"teacher\">\n                \u003cspan class=\"role-title\">✎ 教师\u003c/span>\n                \u003cspan class=\"role-desc\">批改作业 · 共性分析 · 学生档案\u003c/span>\n              \u003c/label>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"field\">\n            \u003clabel for=\"loginUsername\">账号\u003c/label>\n            \u003cinput class=\"input\" id=\"loginUsername\" name=\"username\" type=\"text\" placeholder=\"请输入教师或学生账号\" autocomplete=\"username\" required>\n          \u003c/div>\n\n          \u003cdiv class=\"field\">\n            \u003clabel for=\"loginPassword\">密码\u003c/label>\n            \u003cinput class=\"input\" id=\"loginPassword\" name=\"password\" type=\"password\" placeholder=\"请输入密码\" autocomplete=\"current-password\" required>\n            \u003cspan class=\"field-hint\">演示账号的密码均为 123456。\u003c/span>\n          \u003c/div>\n\n          \u003cbutton class=\"btn btn-primary btn-lg btn-block\" type=\"submit\">登录并进入工作台\u003c/button>\n\n          \u003cdiv class=\"demo-accounts\">\n            \u003cspan>演示账号 · 点击自动填入\u003c/span>\n            \u003cdiv class=\"demo-account-row\">\n              \u003cbutton class=\"demo-account\" type=\"button\" data-demo=\"teacher\">教师：teacher / 123456\u003c/button>\n              \u003cbutton class=\"demo-account\" type=\"button\" data-demo=\"student\">学生：student / 123456\u003c/button>\n              \u003cbutton class=\"demo-account\" type=\"button\" data-demo=\"student2\">学生：student2 / 123456\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        \u003c/form>\n\n        \u003cform class=\"auth-form\" id=\"registerForm\" autocomplete=\"on\" novalidate hidden>\n          \u003cdiv class=\"field\">\n            \u003clabel>注册身份\u003c/label>\n            \u003cdiv class=\"role-choice\">\n              \u003clabel class=\"role-option\">\n                \u003cinput type=\"radio\" name=\"registerRole\" value=\"student\" checked>\n                \u003cspan class=\"role-title\">◈ 学生\u003c/span>\n                \u003cspan class=\"role-desc\">自动创建学生档案\u003c/span>\n              \u003c/label>\n              \u003clabel class=\"role-option\">\n                \u003cinput type=\"radio\" name=\"registerRole\" value=\"teacher\">\n                \u003cspan class=\"role-title\">✎ 教师\u003c/span>\n                \u003cspan class=\"role-desc\">管理班级与作业批改\u003c/span>\n              \u003c/label>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"form-grid\">\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"registerName\">姓名 \u003cspan class=\"required\">*\u003c/span>\u003c/label>\n              \u003cinput class=\"input\" id=\"registerName\" name=\"name\" type=\"text\" placeholder=\"例如：王小明\" maxlength=\"20\" required>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"registerClass\">班级\u003c/label>\n              \u003cinput class=\"input\" id=\"registerClass\" name=\"className\" type=\"text\" value=\"高一（3）班\" maxlength=\"24\">\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"field\">\n            \u003clabel for=\"registerUsername\">账号 \u003cspan class=\"required\">*\u003c/span>\u003c/label>\n            \u003cinput class=\"input\" id=\"registerUsername\" name=\"username\" type=\"text\" placeholder=\"3—20 位字母、数字、中文或下划线\" autocomplete=\"username\" required>\n          \u003c/div>\n\n          \u003cdiv class=\"form-grid\">\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"registerPassword\">密码 \u003cspan class=\"required\">*\u003c/span>\u003c/label>\n              \u003cinput class=\"input\" id=\"registerPassword\" name=\"password\" type=\"password\" placeholder=\"至少 6 位\" autocomplete=\"new-password\" required>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"registerConfirm\">确认密码 \u003cspan class=\"required\">*\u003c/span>\u003c/label>\n              \u003cinput class=\"input\" id=\"registerConfirm\" name=\"confirm\" type=\"password\" placeholder=\"再次输入密码\" autocomplete=\"new-password\" required>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cbutton class=\"btn btn-primary btn-lg btn-block\" type=\"submit\">创建账号并进入工作台\u003c/button>\n          \u003cp class=\"field-hint\" style=\"margin:0;\">注册成功后，学生账号会自动生成学生档案；教师账号可查看本班学生档案。演示数据会保留，可随时在设置页清空。\u003c/p>\n        \u003c/form>\n\n        \u003cdiv class=\"auth-footer\">\n          本平台为教学演示原型，所有账号、作业与批改结果仅保存在当前浏览器本地，请勿录入真实师生隐私信息。AIGC 生成内容需由教师人工复核。\n        \u003c/div>\n      \u003c/section>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      CH.seedDemoData();\n      CH.renderFooter();\n\n      var loginForm = document.getElementById('loginForm');\n      var registerForm = document.getElementById('registerForm');\n      var alertBox = document.getElementById('authAlert');\n      var title = document.getElementById('authTitle');\n      var subtitle = document.getElementById('authSubtitle');\n      var sessionBanner = document.getElementById('sessionBanner');\n      var sessionText = document.getElementById('sessionText');\n      var continueLink = document.getElementById('continueLink');\n      var restoreBar = document.getElementById('restoreBar');\n      var restoreDemoBtn = document.getElementById('restoreDemo');\n\n      restoreDemoBtn.addEventListener('click', function () {\n        CH.seedDemoData(true);\n        CH.toast('预置演示数据已恢复。', 'success');\n        setTimeout(function () { window.__chemhubNav('index.html?restored=1'); }, 500);\n      });\n\n      function showAlert(message, type) {\n        alertBox.className = 'alert alert-' + (type || 'danger');\n        alertBox.innerHTML = '\u003cspan class=\"alert-icon\">' + (type === 'success' ? '✓' : '!') + '\u003c/span>\u003cdiv>' + CH.escapeHTML(message) + '\u003c/div>';\n        alertBox.hidden = false;\n      }\n\n      function hideAlert() {\n        alertBox.hidden = true;\n      }\n\n      var current = CH.getCurrentUser();\n      if (current) {\n        sessionBanner.hidden = false;\n        sessionText.textContent = '当前已登录：' + current.name + '（' + (current.role === 'teacher' ? '教师' : '学生') + ' · ' + (current.className || CH.DEMO_CLASS) + '）';\n        continueLink.href = CH.dashboardFor(current.role);\n      }\n\n      var params = new URLSearchParams(window.__CHEMHUB_QUERY__);\n      if (params.get('logout') === '1') {\n        CH.toast('已安全退出，本地数据仍保留。', 'success');\n      }\n      if (params.get('reason') === 'auth') {\n        sessionBanner.hidden = true;\n        CH.toast('请先登录后再访问该页面。', 'warning');\n      }\n      if (params.get('cleared') === '1') {\n        restoreBar.hidden = false;\n        CH.toast('演示数据已清空，可重新注册或一键恢复演示数据。', 'warning');\n      }\n      if (params.get('restored') === '1') {\n        CH.toast('预置演示数据已恢复，可用演示账号重新登录。', 'success');\n      }\n      if (params.get('tab') === 'register') {\n        switchTab('register');\n      }\n\n      function switchTab(name) {\n        var tabs = document.querySelectorAll('[data-auth-tab]');\n        for (var i = 0; i \u003c tabs.length; i += 1) {\n          tabs[i].setAttribute('aria-selected', tabs[i].getAttribute('data-auth-tab') === name ? 'true' : 'false');\n        }\n        loginForm.hidden = name !== 'login';\n        registerForm.hidden = name !== 'register';\n        if (name === 'login') {\n          title.textContent = '欢迎回来';\n          subtitle.textContent = '登录后进入你的教学工作台或学习工作台。';\n        } else {\n          title.textContent = '创建你的账号';\n          subtitle.textContent = '选择身份，几步完成注册；学生账号会自动建立档案。';\n        }\n        hideAlert();\n      }\n\n      var tabs = document.querySelectorAll('[data-auth-tab]');\n      for (var i = 0; i \u003c tabs.length; i += 1) {\n        tabs[i].addEventListener('click', function () {\n          switchTab(this.getAttribute('data-auth-tab'));\n        });\n      }\n\n      function setLoginRole(role) {\n        var options = loginForm.querySelectorAll('input[name=\"loginRole\"]');\n        for (var i = 0; i \u003c options.length; i += 1) options[i].checked = options[i].value === role;\n        var regOptions = registerForm.querySelectorAll('input[name=\"registerRole\"]');\n        for (var j = 0; j \u003c regOptions.length; j += 1) regOptions[j].checked = regOptions[j].value === role;\n      }\n\n      var demoButtons = document.querySelectorAll('[data-demo]');\n      for (var d = 0; d \u003c demoButtons.length; d += 1) {\n        demoButtons[d].addEventListener('click', function () {\n          var account = this.getAttribute('data-demo');\n          var demo = {\n            teacher: { username: 'teacher', role: 'teacher', password: '123456' },\n            student: { username: 'student', role: 'student', password: '123456' },\n            student2: { username: 'student2', role: 'student', password: '123456' }\n          }[account];\n          if (!demo) return;\n          switchTab('login');\n          setLoginRole(demo.role);\n          document.getElementById('loginUsername').value = demo.username;\n          document.getElementById('loginPassword').value = demo.password;\n          hideAlert();\n          CH.toast('已填入演示账号，点击“登录并进入工作台”。', 'info');\n        });\n      }\n\n      loginForm.addEventListener('submit', function (event) {\n        event.preventDefault();\n        hideAlert();\n        var roleOption = loginForm.querySelector('input[name=\"loginRole\"]:checked');\n        var role = roleOption ? roleOption.value : '';\n        var username = document.getElementById('loginUsername').value;\n        var password = document.getElementById('loginPassword').value;\n        if (!username.trim() || !password) {\n          showAlert('请输入账号和密码。', 'warning');\n          return;\n        }\n        var result = CH.login(username, password, role);\n        if (!result.ok) {\n          showAlert(result.message, 'danger');\n          return;\n        }\n        showAlert('登录成功，正在进入工作台……', 'success');\n        setTimeout(function () {\n          window.__chemhubNav(CH.dashboardFor(result.user.role));\n        }, 260);\n      });\n\n      registerForm.addEventListener('submit', function (event) {\n        event.preventDefault();\n        hideAlert();\n        var roleOption = registerForm.querySelector('input[name=\"registerRole\"]:checked');\n        var role = roleOption ? roleOption.value : 'student';\n        var name = document.getElementById('registerName').value;\n        var username = document.getElementById('registerUsername').value;\n        var password = document.getElementById('registerPassword').value;\n        var confirm = document.getElementById('registerConfirm').value;\n        var className = document.getElementById('registerClass').value;\n        if (!name.trim() || !username.trim() || !password) {\n          showAlert('请完整填写姓名、账号和密码。', 'warning');\n          return;\n        }\n        if (password !== confirm) {\n          showAlert('两次输入的密码不一致，请重新确认。', 'danger');\n          return;\n        }\n        var result = CH.register({ name: name, username: username, password: password, role: role, className: className });\n        if (!result.ok) {\n          showAlert(result.message, 'danger');\n          return;\n        }\n        showAlert('注册成功，正在进入' + (result.user.role === 'teacher' ? '教师' : '学生') + '工作台……', 'success');\n        setTimeout(function () {\n          window.__chemhubNav(CH.dashboardFor(result.user.role));\n        }, 320);\n      });\n\n      var allInputs = document.querySelectorAll('.auth-form .input');\n      for (var k = 0; k \u003c allInputs.length; k += 1) {\n        allInputs[k].addEventListener('input', hideAlert);\n      }\n    })();\n  "},"teacher-dashboard.html":{"page":"teacher-dashboard.html","title":"教师工作台 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003csection class=\"hero\">\n      \u003cdiv class=\"hero-inner\">\n        \u003cdiv class=\"hero-copy\">\n          \u003cspan class=\"eyebrow\">教师工作台 · 作业与评价\u003c/span>\n          \u003ch1>早上好，\u003cspan data-user-name>老师\u003c/span>。\u003cbr>今天也从一份作业开始。\u003c/h1>\n          \u003cp>把批改交给 AI 做“第一遍”，把判断与讲评留给自己。上传学生作业照片，获得等级、三维度评语与逐题解析；勾选多份结果，即可生成班级共性分析。\u003c/p>\n          \u003cdiv class=\"hero-actions\">\n            \u003ca class=\"btn btn-primary btn-lg\" href=\"teacher-homework.html\">开始批改作业 →\u003c/a>\n            \u003ca class=\"btn btn-ghost btn-lg\" href=\"common-issues.html\">查看共性分析\u003c/a>\n          \u003c/div>\n          \u003cdiv class=\"hero-stats\">\n            \u003cdiv class=\"hero-stat\">\u003cstrong id=\"statPending\">0\u003c/strong>\u003csmall>待批改作业\u003c/small>\u003c/div>\n            \u003cdiv class=\"hero-stat\">\u003cstrong id=\"statGraded\">0\u003c/strong>\u003csmall>已完成批改\u003c/small>\u003c/div>\n            \u003cdiv class=\"hero-stat\">\u003cstrong id=\"statStudents\">0\u003c/strong>\u003csmall>班级学生\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003caside class=\"hero-side\" aria-label=\"今日教学提示\">\n          \u003cspan class=\"hero-side-title\">今日提示\u003c/span>\n          \u003cdiv class=\"hero-mini\">\n            \u003cspan class=\"hero-mini-icon\">✎\u003c/span>\n            \u003cdiv>\u003cstrong id=\"sidePending\">先处理待批改作业\u003c/strong>\u003csmall>批改后档案与趋势会自动更新\u003c/small>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"hero-mini\">\n            \u003cspan class=\"hero-mini-icon\">▦\u003c/span>\n            \u003cdiv>\u003cstrong>共性问题值得讲评\u003c/strong>\u003csmall>勾选 2 份以上作业即可生成报告\u003c/small>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"hero-mini\">\n            \u003cspan class=\"hero-mini-icon\">◎\u003c/span>\n            \u003cdiv>\u003cstrong id=\"apiState\">演示数据已就绪\u003c/strong>\u003csmall id=\"apiHint\">未配置 Key 也能完整演示\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/aside>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>待批改作业\u003c/h2>\u003cp>来自本班学生的最新提交，按提交时间排序。\u003c/p>\u003c/div>\n        \u003ca class=\"section-link\" href=\"teacher-homework.html\">进入批改工作台 →\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-body\" id=\"pendingList\">\n          \u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">✓\u003c/div>\u003ch3>正在读取待批改作业\u003c/h3>\u003cp>请稍候。\u003c/p>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>核心工作入口\u003c/h2>\u003cp>围绕“批改—档案—分析—示范”的完整闭环。\u003c/p>\u003c/div>\n        \u003ca class=\"section-link\" href=\"settings.html\">平台设置 →\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"grid grid-4\">\n        \u003ca class=\"card card-pad card accent\" href=\"teacher-homework.html\" style=\"color:inherit;\">\n          \u003cdiv class=\"stat-icon\">✎\u003c/div>\n          \u003ch3 style=\"margin:12px 0 5px;font-size:15px;\">作业批改\u003c/h3>\n          \u003cp class=\"small muted\" style=\"margin:0;\">上传图片或 PDF，AI 多模态批改，支持逐题复核与优秀答案标记。\u003c/p>\n          \u003cdiv class=\"cluster\" style=\"margin-top:12px;\">\u003cspan class=\"tag\">核心模块\u003c/span>\u003cspan class=\"tag tag-amber\">AI 批改\u003c/span>\u003c/div>\n        \u003c/a>\n        \u003ca class=\"card card-pad\" href=\"student-profile.html\" style=\"color:inherit;\">\n          \u003cdiv class=\"stat-icon teal\">◫\u003c/div>\n          \u003ch3 style=\"margin:12px 0 5px;font-size:15px;\">学生档案\u003c/h3>\n          \u003cp class=\"small muted\" style=\"margin:0;\">查看批改历史、等级趋势、薄弱点标签与最近解析汇总。\u003c/p>\n          \u003cdiv class=\"cluster\" style=\"margin-top:12px;\">\u003cspan class=\"tag tag-green\">成长轨迹\u003c/span>\u003c/div>\n        \u003c/a>\n        \u003ca class=\"card card-pad\" href=\"common-issues.html\" style=\"color:inherit;\">\n          \u003cdiv class=\"stat-icon gold\">▦\u003c/div>\n          \u003ch3 style=\"margin:12px 0 5px;font-size:15px;\">共性分析\u003c/h3>\n          \u003cp class=\"small muted\" style=\"margin:0;\">高频错误 Top 5、匿名典型错误与课堂补救建议。\u003c/p>\n          \u003cdiv class=\"cluster\" style=\"margin-top:12px;\">\u003cspan class=\"tag tag-amber\">班级学情\u003c/span>\u003c/div>\n        \u003c/a>\n        \u003ca class=\"card card-pad\" href=\"excellent-answers.html\" style=\"color:inherit;\">\n          \u003cdiv class=\"stat-icon red\">★\u003c/div>\n          \u003ch3 style=\"margin:12px 0 5px;font-size:15px;\">优秀答案\u003c/h3>\n          \u003cp class=\"small muted\" style=\"margin:0;\">匿名展示教师标记的优秀作答与评语，可随时取消展示。\u003c/p>\n          \u003cdiv class=\"cluster\" style=\"margin-top:12px;\">\u003cspan class=\"tag\">示范引领\u003c/span>\u003c/div>\n        \u003c/a>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>最近批改记录\u003c/h2>\u003cp>批改结果会自动写入学生档案，并参与班级共性分析。\u003c/p>\u003c/div>\n        \u003ca class=\"section-link\" href=\"student-profile.html\">查看全部档案 →\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"table-wrap\">\n          \u003ctable class=\"data-table\">\n            \u003cthead>\u003ctr>\u003cth>学生\u003c/th>\u003cth>作业批次\u003c/th>\u003cth>等级\u003c/th>\u003cth>薄弱点\u003c/th>\u003cth>批改时间\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody id=\"recentBody\">\u003ctr>\u003ctd colspan=\"6\" class=\"table-empty\">正在读取批改记录……\u003c/td>\u003c/tr>\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>教学模块\u003c/h2>\u003cp>“作业与评价”与“课后答疑”已完整实现；课堂教学已接入实验仿真；教学设计为演示占位页。\u003c/p>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grid grid-3\">\n        \u003ca class=\"assignment-card\" href=\"teaching-design.html\">\n          \u003cdiv>\u003cp class=\"assignment-title\">✎ 教学设计\u003c/p>\u003cdiv class=\"assignment-meta\">\u003cspan>AI 辅助备课\u003c/span>\u003cspan>单元设计\u003c/span>\u003cspan class=\"tag tag-gray\">待扩展\u003c/span>\u003c/div>\u003c/div>\n          \u003cspan class=\"btn btn-ghost btn-sm\">进入\u003c/span>\n        \u003c/a>\n        \u003ca class=\"assignment-card\" href=\"classroom-teaching.html\">\n          \u003cdiv>\u003cp class=\"assignment-title\">▤ 课堂教学\u003c/p>\u003cdiv class=\"assignment-meta\">\u003cspan>实验仿真\u003c/span>\u003cspan>互动课堂\u003c/span>\u003cspan class=\"tag tag-green\">已上线\u003c/span>\u003c/div>\u003c/div>\n          \u003cspan class=\"btn btn-ghost btn-sm\">进入\u003c/span>\n        \u003c/a>\n        \u003ca class=\"assignment-card\" href=\"after-school-service.html\">\n          \u003cdiv>\u003cp class=\"assignment-title\">☾ 课后服务\u003c/p>\u003cdiv class=\"assignment-meta\">\u003cspan>步进式答疑\u003c/span>\u003cspan>多模态识题\u003c/span>\u003cspan class=\"tag tag-green\">已上线\u003c/span>\u003c/div>\u003c/div>\n          \u003cspan class=\"btn btn-ghost btn-sm\">进入\u003c/span>\n        \u003c/a>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-info\">\n        \u003cspan class=\"alert-icon\">i\u003c/span>\n        \u003cdiv>\u003cstrong>演示提示：\u003c/strong>本页数据来自预置演示数据和当前浏览器的 localStorage。未填写 API Key 时，所有批改按钮仍可使用预置结果完整演示；填写 Key 后可在设置页测试连接并切换真实多模态批改。AIGC 结果请务必人工复核。\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ role: 'teacher', active: 'dashboard', title: '教师工作台 · 知行化学' });\n      if (!user) return;\n\n      var submissions = CH.getSubmissions();\n      var classStudents = CH.getClassStudents(user.className);\n      var pending = submissions.filter(function (item) { return item.className === user.className && item.status === 'pending'; });\n      var graded = submissions.filter(function (item) { return item.className === user.className && item.status === 'graded'; });\n      var excellent = CH.getActiveExcellent();\n\n      document.getElementById('statPending').textContent = pending.length;\n      document.getElementById('statGraded').textContent = graded.length;\n      document.getElementById('statStudents').textContent = classStudents.length;\n      document.getElementById('sidePending').textContent = pending.length ? ('还有 ' + pending.length + ' 份作业待批改') : '待批改队列已清空';\n\n      var settings = CH.getSettings();\n      if (!settings.apiKey) {\n        document.getElementById('apiState').textContent = '演示模式已就绪';\n        document.getElementById('apiHint').textContent = '未配置 Key，自动使用演示批改';\n      } else if (settings.forceDemo) {\n        document.getElementById('apiState').textContent = '已锁定演示模式';\n        document.getElementById('apiHint').textContent = '设置页已开启“仅使用演示数据”';\n      } else {\n        document.getElementById('apiState').textContent = 'DeepSeek 已配置';\n        document.getElementById('apiHint').textContent = '模型：' + settings.model;\n      }\n\n      var pendingBox = document.getElementById('pendingList');\n      if (!pending.length) {\n        pendingBox.innerHTML = '\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">✓\u003c/div>\u003ch3>待批改队列已清空\u003c/h3>\u003cp>可以查看学生档案、生成共性分析，或到优秀答案墙挑选示范作答。\u003c/p>\u003ca class=\"btn btn-secondary btn-sm\" href=\"student-profile.html\">查看学生档案\u003c/a>\u003c/div>';\n      } else {\n        pending.sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });\n        pendingBox.innerHTML = '\u003cdiv class=\"pending-list\">' + pending.map(function (item) {\n          return '\u003cdiv class=\"pending-item\">\u003cdiv class=\"pending-info\">\u003cstrong>' + CH.escapeHTML(item.studentName) + ' · ' + CH.escapeHTML(item.batchName) + '\u003c/strong>\u003csmall>' + CH.escapeHTML(item.unit || '') + ' · 提交于 ' + CH.formatDate(item.submittedAt, true) + (item.selfReport ? ' · 自述：' + CH.escapeHTML(CH.truncate(item.selfReport, 36)) : '') + '\u003c/small>\u003c/div>\u003ca class=\"btn btn-primary btn-sm\" href=\"teacher-homework.html?submission=' + encodeURIComponent(item.id) + '\">去批改\u003c/a>\u003c/div>';\n        }).join('') + '\u003c/div>';\n      }\n\n      var recentBody = document.getElementById('recentBody');\n      var recent = graded.slice().sort(function (a, b) { return new Date(b.gradedAt) - new Date(a.gradedAt); }).slice(0, 6);\n      if (!recent.length) {\n        recentBody.innerHTML = '\u003ctr>\u003ctd colspan=\"6\" class=\"table-empty\">还没有已批改作业，先去批改一份吧。\u003c/td>\u003c/tr>';\n      } else {\n        recentBody.innerHTML = recent.map(function (item) {\n          var tags = (item.result && item.result.weakTags || []).slice(0, 2).map(function (tag) { return '\u003cspan class=\"tag tag-weak\">' + CH.escapeHTML(tag) + '\u003c/span>'; }).join(' ');\n          return '\u003ctr>\u003ctd>\u003cdiv class=\"cell-main\">' + CH.escapeHTML(item.studentName) + '\u003c/div>\u003cdiv class=\"cell-sub\">' + CH.escapeHTML(item.studentId) + '\u003c/div>\u003c/td>\u003ctd>\u003cdiv class=\"cell-main\">' + CH.escapeHTML(item.batchName) + '\u003c/div>\u003cdiv class=\"cell-sub\">' + CH.escapeHTML(item.unit || '') + '\u003c/div>\u003c/td>\u003ctd>\u003cspan class=\"grade-badge ' + CH.gradeClass(item.result.grade) + '\">' + CH.escapeHTML(item.result.grade) + '\u003c/span>\u003c/td>\u003ctd>' + (tags || '\u003cspan class=\"muted small\">—\u003c/span>') + '\u003c/td>\u003ctd class=\"small muted\">' + CH.formatDate(item.gradedAt, true) + '\u003c/td>\u003ctd>\u003ca class=\"btn btn-ghost btn-sm\" href=\"teacher-homework.html?submission=' + encodeURIComponent(item.id) + '\">查看结果\u003c/a>\u003c/td>\u003c/tr>';\n        }).join('');\n      }\n    })();\n  "},"student-dashboard.html":{"page":"student-dashboard.html","title":"学生工作台 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003csection class=\"hero\">\n      \u003cdiv class=\"hero-inner\">\n        \u003cdiv class=\"hero-copy\">\n          \u003cspan class=\"eyebrow\">学生学习台 · 作业与评价\u003c/span>\n          \u003ch1>你好，\u003cspan data-user-name>同学\u003c/span>。\u003cbr>把每一次订正，变成下一次进步。\u003c/h1>\n          \u003cp>在这里提交化学作业、查看 AI 批改结果与逐题解析，也能在匿名优秀答案墙里找到值得借鉴的表达方式。批改结果会自动汇入你的成长档案。\u003c/p>\n          \u003cdiv class=\"hero-actions\">\n            \u003ca class=\"btn btn-primary btn-lg\" href=\"student-homework.html\">提交新作业 →\u003c/a>\n            \u003ca class=\"btn btn-ghost btn-lg\" href=\"student-profile.html\">查看我的档案\u003c/a>\n          \u003c/div>\n          \u003cdiv class=\"hero-stats\">\n            \u003cdiv class=\"hero-stat\">\u003cstrong id=\"statGraded\">0\u003c/strong>\u003csmall>已批改作业\u003c/small>\u003c/div>\n            \u003cdiv class=\"hero-stat\">\u003cstrong id=\"statAverage\">—\u003c/strong>\u003csmall>平均分\u003c/small>\u003c/div>\n            \u003cdiv class=\"hero-stat\">\u003cstrong id=\"statPending\">0\u003c/strong>\u003csmall>待批改\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003caside class=\"hero-side\" aria-label=\"学习提示\">\n          \u003cspan class=\"hero-side-title\">当前关注\u003c/span>\n          \u003cdiv class=\"hero-mini\">\n            \u003cspan class=\"hero-mini-icon\">◈\u003c/span>\n            \u003cdiv>\u003cstrong id=\"focusTags\">先完成一次作业提交\u003c/strong>\u003csmall>薄弱点会随批改自动更新\u003c/small>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"hero-mini\">\n            \u003cspan class=\"hero-mini-icon\">↗\u003c/span>\n            \u003cdiv>\u003cstrong id=\"focusTrend\">等级趋势待生成\u003c/strong>\u003csmall>每次批改都会留下一个坐标\u003c/small>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"hero-mini\">\n            \u003cspan class=\"hero-mini-icon\">★\u003c/span>\n            \u003cdiv>\u003cstrong>优秀答案墙已开放\u003c/strong>\u003csmall>匿名展示，只看思路与表达\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/aside>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>作业批次\u003c/h2>\u003cp>选择一次作业，上传照片或直接使用演示数据提交。\u003c/p>\u003c/div>\n        \u003ca class=\"section-link\" href=\"student-homework.html\">进入我的作业 →\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"assignment-list\" id=\"batchList\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">◈\u003c/div>\u003ch3>正在读取作业批次\u003c/h3>\u003cp>请稍候。\u003c/p>\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>最近的批改结果\u003c/h2>\u003cp>点击可查看等级、三维度评语、逐题解析与薄弱点。\u003c/p>\u003c/div>\n        \u003ca class=\"section-link\" href=\"student-homework.html\">查看全部 →\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"grid grid-2\" id=\"recentResults\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">✓\u003c/div>\u003ch3>正在读取批改结果\u003c/h3>\u003cp>请稍候。\u003c/p>\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"grid grid-2\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>我的薄弱点\u003c/h2>\u003cp>根据已批改作业自动归纳，最多展示 6 个标签。\u003c/p>\u003c/div>\u003ca class=\"section-link\" href=\"student-profile.html\">档案 →\u003c/a>\u003c/div>\n          \u003cdiv class=\"card-body\" id=\"weakTagsBox\">\u003cspan class=\"muted small\">还没有批改记录。\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>学习建议\u003c/h2>\u003cp>从最近一次批改中提取的行动建议。\u003c/p>\u003c/div>\u003ca class=\"section-link\" href=\"student-homework.html\">去订正 →\u003c/a>\u003c/div>\n          \u003cdiv class=\"card-body\" id=\"adviceBox\">\u003cp class=\"muted small\">完成第一次作业后，这里会出现针对性的学习建议。\u003c/p>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>优秀答案墙\u003c/h2>\u003cp>匿名展示教师标记的优秀作答，学习思路，而不是照抄答案。\u003c/p>\u003c/div>\n        \u003ca class=\"section-link\" href=\"excellent-answers.html\">进入答案墙 →\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"grid grid-2\" id=\"excellentPreview\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">★\u003c/div>\u003ch3>正在读取优秀答案\u003c/h3>\u003cp>请稍候。\u003c/p>\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>学习模块\u003c/h2>\u003cp>“作业与评价”与“课后答疑”已完整实现；课堂教学已接入实验仿真；教学设计为演示占位页。\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"grid grid-3\">\n        \u003ca class=\"assignment-card\" href=\"teaching-design.html\">\u003cdiv>\u003cp class=\"assignment-title\">✎ 教学设计\u003c/p>\u003cdiv class=\"assignment-meta\">\u003cspan>学习目标\u003c/span>\u003cspan>任务单\u003c/span>\u003cspan class=\"tag tag-gray\">待扩展\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"btn btn-ghost btn-sm\">进入\u003c/span>\u003c/a>\n        \u003ca class=\"assignment-card\" href=\"classroom-teaching.html\">\u003cdiv>\u003cp class=\"assignment-title\">▤ 课堂教学\u003c/p>\u003cdiv class=\"assignment-meta\">\u003cspan>实验仿真\u003c/span>\u003cspan>课堂互动\u003c/span>\u003cspan class=\"tag tag-green\">已上线\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"btn btn-ghost btn-sm\">进入\u003c/span>\u003c/a>\n        \u003ca class=\"assignment-card\" href=\"after-school-service.html\">\u003cdiv>\u003cp class=\"assignment-title\">☾ 课后服务\u003c/p>\u003cdiv class=\"assignment-meta\">\u003cspan>课后答疑\u003c/span>\u003cspan>变式练习\u003c/span>\u003cspan class=\"tag tag-green\">已上线\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"btn btn-ghost btn-sm\">进入\u003c/span>\u003c/a>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-info\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>隐私提示：\u003c/strong>批改结果与档案仅保存在当前浏览器。优秀答案墙只展示匿名化后的题目与作答，不显示姓名、学号或班级。AIGC 内容为辅助学习材料，请以教师讲评为准。\u003c/div>\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ role: 'student', active: 'dashboard', title: '学生工作台 · 知行化学' });\n      if (!user) return;\n      var student = CH.getStudentByUserId(user.id);\n      if (!student) {\n        document.getElementById('batchList').innerHTML = '\u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">!\u003c/div>\u003ch3>未找到学生档案\u003c/h3>\u003cp>请退出后重新注册学生账号，或在设置页恢复演示数据。\u003c/p>\u003ca class=\"btn btn-secondary btn-sm\" href=\"settings.html\">前往设置\u003c/a>\u003c/div>\u003c/div>';\n        return;\n      }\n\n      var submissions = CH.getSubmissions().filter(function (item) { return item.studentId === student.studentId; });\n      var graded = submissions.filter(function (item) { return item.status === 'graded' && item.result; }).sort(function (a, b) { return new Date(b.gradedAt) - new Date(a.gradedAt); });\n      var pending = submissions.filter(function (item) { return item.status === 'pending'; });\n      var stats = CH.getStudentStats(student.studentId);\n\n      document.getElementById('statGraded').textContent = graded.length;\n      document.getElementById('statAverage').textContent = stats.average ? stats.average : '—';\n      document.getElementById('statPending').textContent = pending.length;\n\n      if (student.weakTags && student.weakTags.length) {\n        document.getElementById('focusTags').textContent = '优先关注：' + student.weakTags.slice(0, 2).join('、');\n      } else {\n        document.getElementById('focusTags').textContent = '先完成一次作业提交';\n      }\n      if (graded.length >= 2) {\n        var latest = graded[0].result;\n        var previous = graded[1].result;\n        var diff = (Number(latest.score) || 0) - (Number(previous.score) || 0);\n        document.getElementById('focusTrend').textContent = diff >= 0 ? ('较上次提升 ' + diff + ' 分') : ('较上次回落 ' + Math.abs(diff) + ' 分');\n      } else if (graded.length === 1) {\n        document.getElementById('focusTrend').textContent = '已生成第一个成长坐标';\n      }\n\n      var batchBox = document.getElementById('batchList');\n      batchBox.innerHTML = CH.BATCHES.map(function (batch) {\n        var mine = submissions.filter(function (item) { return item.batchId === batch.id; }).sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });\n        var latest = mine[0];\n        var status = '';\n        var action = '';\n        if (!latest) {\n          status = '\u003cspan class=\"tag tag-gray\">未提交\u003c/span>';\n          action = '\u003ca class=\"btn btn-primary btn-sm\" href=\"student-homework.html?batch=' + batch.id + '\">去提交\u003c/a>';\n        } else if (latest.status === 'pending') {\n          status = '\u003cspan class=\"tag tag-amber\">待批改\u003c/span>';\n          action = '\u003ca class=\"btn btn-ghost btn-sm\" href=\"student-homework.html?submission=' + encodeURIComponent(latest.id) + '\">查看提交\u003c/a>';\n        } else {\n          status = '\u003cspan class=\"grade-badge ' + CH.gradeClass(latest.result.grade) + '\">' + CH.escapeHTML(latest.result.grade) + '\u003c/span>';\n          action = '\u003ca class=\"btn btn-secondary btn-sm\" href=\"student-homework.html?submission=' + encodeURIComponent(latest.id) + '\">查看批改\u003c/a>';\n        }\n        return '\u003cdiv class=\"assignment-card\">\u003cdiv>\u003cp class=\"assignment-title\">' + CH.escapeHTML(batch.name) + '\u003c/p>\u003cdiv class=\"assignment-meta\">\u003cspan>' + CH.escapeHTML(batch.unit) + '\u003c/span>\u003cspan>截止 ' + CH.escapeHTML(batch.due) + '\u003c/span>\u003cspan>' + CH.escapeHTML(batch.task) + '\u003c/span>' + status + '\u003c/div>\u003c/div>\u003cdiv class=\"assignment-actions\">' + action + '\u003c/div>\u003c/div>';\n      }).join('');\n\n      var resultBox = document.getElementById('recentResults');\n      if (!graded.length) {\n        resultBox.innerHTML = '\u003cdiv class=\"card\" style=\"grid-column:1/-1;\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">✓\u003c/div>\u003ch3>还没有批改结果\u003c/h3>\u003cp>提交一份作业后，AI 会给出等级、三维度评语与逐题解析。\u003c/p>\u003ca class=\"btn btn-primary btn-sm\" href=\"student-homework.html\">去提交作业\u003c/a>\u003c/div>\u003c/div>';\n      } else {\n        resultBox.innerHTML = graded.slice(0, 2).map(function (item) {\n          var tags = (item.result.weakTags || []).slice(0, 3).map(function (tag) { return '\u003cspan class=\"tag tag-weak\">' + CH.escapeHTML(tag) + '\u003c/span>'; }).join(' ');\n          return '\u003cdiv class=\"card\">\u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>' + CH.escapeHTML(item.batchName) + '\u003c/h2>\u003cp>' + CH.escapeHTML(item.unit || '') + ' · ' + CH.formatDate(item.gradedAt, true) + '\u003c/p>\u003c/div>\u003cspan class=\"grade-badge ' + CH.gradeClass(item.result.grade) + '\">' + CH.escapeHTML(item.result.grade) + '\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp class=\"small ink-soft\" style=\"margin:0 0 10px;\">' + CH.escapeHTML(CH.truncate(item.result.overall, 96)) + '\u003c/p>\u003cdiv class=\"tag-list\">' + (tags || '\u003cspan class=\"tag tag-gray\">暂无薄弱点\u003c/span>') + '\u003c/div>\u003c/div>\u003cdiv class=\"card-footer between\">\u003cspan class=\"small muted\">得分 ' + CH.escapeHTML(String(item.result.score)) + ' / 100\u003c/span>\u003ca class=\"btn btn-secondary btn-sm\" href=\"student-homework.html?submission=' + encodeURIComponent(item.id) + '\">查看逐题解析 →\u003c/a>\u003c/div>\u003c/div>';\n        }).join('');\n      }\n\n      var weakBox = document.getElementById('weakTagsBox');\n      if (student.weakTags && student.weakTags.length) {\n        weakBox.innerHTML = '\u003cdiv class=\"tag-list\">' + student.weakTags.map(function (tag) { return '\u003cspan class=\"tag tag-weak\">' + CH.escapeHTML(tag) + '\u003c/span>'; }).join('') + '\u003c/div>\u003cp class=\"small muted\" style=\"margin:12px 0 0;\">建议优先订正带有这些标签的题目，再完成一次同类题复测。\u003c/p>';\n      } else {\n        weakBox.innerHTML = '\u003cp class=\"small muted\" style=\"margin:0;\">还没有足够的批改记录来归纳薄弱点。\u003c/p>';\n      }\n\n      var adviceBox = document.getElementById('adviceBox');\n      if (graded.length) {\n        var latestResult = graded[0].result;\n        var firstWrong = (latestResult.questions || []).filter(function (q) { return q.verdict !== '正确'; })[0];\n        var advice = firstWrong ? ('优先复盘第 ' + CH.escapeHTML(String(firstWrong.no)) + ' 题：' + CH.escapeHTML(CH.truncate(firstWrong.reason, 80))) : '最近一次作业完成得很好，可以尝试挑战更高阶的变式题。';\n        adviceBox.innerHTML = '\u003cdiv class=\"overall-box\">\u003cstrong>来自最近一次批改\u003c/strong>' + advice + '\u003c/div>\u003cp class=\"small muted\" style=\"margin:10px 0 0;\">完整解析见“我的作业”。\u003c/p>';\n      }\n\n      var excellentBox = document.getElementById('excellentPreview');\n      var excellent = CH.getActiveExcellent().slice(0, 2);\n      if (!excellent.length) {\n        excellentBox.innerHTML = '\u003cdiv class=\"card\" style=\"grid-column:1/-1;\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">★\u003c/div>\u003ch3>优秀答案墙暂时为空\u003c/h3>\u003cp>教师标记优秀作答后，这里会出现匿名示范。\u003c/p>\u003ca class=\"btn btn-ghost btn-sm\" href=\"excellent-answers.html\">去看看\u003c/a>\u003c/div>\u003c/div>';\n      } else {\n        excellentBox.innerHTML = excellent.map(function (item) {\n          return '\u003cdiv class=\"excellent-card\">\u003cp class=\"quote\">优秀答案 · 匿名示范\u003c/p>\u003ch3>' + CH.escapeHTML(CH.truncate(item.question, 58)) + '\u003c/h3>\u003cp class=\"answer\">' + CH.escapeHTML(CH.truncate(item.answer, 120)) + '\u003c/p>\u003cdiv class=\"teacher-comment\">\u003cstrong>教师评语：\u003c/strong>' + CH.escapeHTML(CH.truncate(item.comment, 72)) + '\u003c/div>\u003c/div>';\n        }).join('');\n      }\n    })();\n  "},"teacher-homework.html":{"page":"teacher-homework.html","title":"作业批改 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003cdiv class=\"page-head\">\n      \u003cdiv>\n        \u003cnav class=\"breadcrumbs\" aria-label=\"面包屑\">\u003ca href=\"teacher-dashboard.html\">教师工作台\u003c/a>\u003cspan>/\u003c/span>\u003cspan>作业与评价\u003c/span>\u003c/nav>\n        \u003ch1>作业批改工作台\u003c/h1>\n        \u003cp>上传学生作业照片，由 DeepSeek 多模态接口完成等级评定、三维度评语与逐题解析；未配置 API Key 时自动使用演示数据，保证全流程可演示。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"page-head-actions\">\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"common-issues.html\">共性分析报告\u003c/a>\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"excellent-answers.html\">优秀答案墙\u003c/a>\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"settings.html\">API 设置\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"stats-grid\">\n      \u003cdiv class=\"stat-card\">\u003cspan class=\"stat-icon\">◷\u003c/span>\u003cdiv>\u003cstrong id=\"statPending\">0\u003c/strong>\u003csmall>待批改作业\u003c/small>\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-card\">\u003cspan class=\"stat-icon\">✓\u003c/span>\u003cdiv>\u003cstrong id=\"statGraded\">0\u003c/strong>\u003csmall>已批改作业\u003c/small>\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-card\">\u003cspan class=\"stat-icon\">★\u003c/span>\u003cdiv>\u003cstrong id=\"statExcellent\">0\u003c/strong>\u003csmall>优秀答案展示\u003c/small>\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-card\">\u003cspan class=\"stat-icon\">◫\u003c/span>\u003cdiv>\u003cstrong id=\"statStudents\">0\u003c/strong>\u003csmall>班级学生\u003c/small>\u003c/div>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"grid grid-3\" style=\"margin-top:18px;\">\n      \u003cdiv class=\"span-2 stack\">\n        \u003csection class=\"card\" id=\"gradingPanel\">\n          \u003cdiv class=\"card-header\">\n            \u003cdiv>\u003ch2>上传与批改\u003c/h2>\u003cp>支持 JPG / PNG 作业照片；PDF 仅记录文件名，演示版优先按图片批改。\u003c/p>\u003c/div>\n            \u003cspan class=\"tag tag-blue\" id=\"apiBadge\">检测中\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cdiv class=\"alert alert-warning\" id=\"queueNotice\" style=\"display:none;\">\u003c/div>\n            \u003cdiv class=\"form-grid\">\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"studentSelect\">学生\u003c/label>\n                \u003cselect class=\"input\" id=\"studentSelect\">\u003c/select>\n              \u003c/div>\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"batchSelect\">作业批次\u003c/label>\n                \u003cselect class=\"input\" id=\"batchSelect\">\u003c/select>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"selfReport\">学生自述（选填）\u003c/label>\n              \u003ctextarea class=\"input\" id=\"selfReport\" rows=\"2\" placeholder=\"例如：这次重点检查了离子方程式的拆分，计算题写出了完整步骤。\">\u003c/textarea>\n              \u003csmall class=\"field-hint\">自述会随作业一起送入批改要求，帮助 AI 关注学生的自我反思。\u003c/small>\n            \u003c/div>\n\n            \u003cdiv class=\"upload-zone\" id=\"uploadZone\" role=\"button\" tabindex=\"0\" aria-label=\"选择或拖入作业图片\">\n              \u003cspan class=\"upload-icon\">⇪\u003c/span>\n              \u003ch3>拖入作业照片，或点击选择文件\u003c/h3>\n              \u003cp>JPG / PNG 图片会压缩后发送给多模态接口；PDF 仅记录文件名，若接口不支持将提示改用图片。\u003c/p>\n              \u003cinput type=\"file\" id=\"fileInput\" accept=\"image/jpeg,image/png,application/pdf\" hidden>\n            \u003c/div>\n            \u003cdiv id=\"filePreview\">\u003c/div>\n\n            \u003cdiv class=\"alert alert-info\" style=\"margin-top:14px;\">\n              \u003cspan class=\"alert-icon\">i\u003c/span>\n              \u003cdiv>\u003cstrong>化学学科批改约束已写入提示词：\u003c/strong>区分“→ / ⇌ / =”；化学式正确但配平错误判“部分正确”并标“配平错误”；计算题按步骤给分；手写识别不确定处标【识别存疑：xxx】。\u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"form-actions\" style=\"margin-top:16px;\">\n              \u003cbutton class=\"btn btn-primary\" type=\"button\" id=\"gradeAI\">开始 AI 多模态批改\u003c/button>\n              \u003cbutton class=\"btn btn-secondary\" type=\"button\" id=\"gradeDemo\">使用演示数据批改\u003c/button>\n              \u003ca class=\"btn btn-ghost\" href=\"settings.html\">配置 API Key\u003c/a>\n            \u003c/div>\n            \u003cp class=\"small muted\" style=\"margin:10px 0 0;\">未填写 Key、接口失败或勾选“仅使用演示数据”时，页面会自动回退到预置结果，并在结果顶部注明来源。教师应对 AIGC 结果进行人工复核。\u003c/p>\n\n            \u003cdiv class=\"progress-card\" id=\"progressCard\">\n              \u003cdiv class=\"progress-head\">\u003cspan id=\"progressLabel\">准备批改\u003c/span>\u003cspan id=\"progressPercent\">0%\u003c/span>\u003c/div>\n              \u003cdiv class=\"progress-bar\">\u003cspan id=\"progressBar\" style=\"width:8%\">\u003c/span>\u003c/div>\n              \u003cdiv class=\"progress-steps\">\u003cspan>读取图片\u003c/span>\u003cspan>识别题目\u003c/span>\u003cspan>学科判定\u003c/span>\u003cspan>生成评语\u003c/span>\u003cspan>写入档案\u003c/span>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"section\" id=\"resultSection\" style=\"margin-top:0;\">\n          \u003cdiv class=\"section-head\">\n            \u003cdiv>\u003ch2>批改结果\u003c/h2>\u003cp>等级、三维度评语、整体评价、逐题解析与薄弱点；优秀题目可一键加入匿名答案墙。\u003c/p>\u003c/div>\n            \u003cdiv class=\"page-head-actions\">\n              \u003cbutton class=\"btn btn-ghost btn-sm\" type=\"button\" id=\"printResult\" style=\"display:none;\">打印 / 导出 PDF\u003c/button>\n              \u003ca class=\"btn btn-ghost btn-sm\" href=\"excellent-answers.html\">优秀答案墙 →\u003c/a>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv id=\"resultBox\">\n            \u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">✎\u003c/div>\u003ch3>等待一份作业\u003c/h3>\u003cp>上传作业照片并开始批改，或从右侧待批改队列中载入一份提交，即可查看完整结果。\u003c/p>\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n\n      \u003caside class=\"stack\">\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>待批改队列\u003c/h2>\u003cp>学生端提交后自动进入队列。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-amber\" id=\"pendingBadge\">0 份\u003c/span>\u003c/div>\n          \u003cdiv class=\"card-body\" id=\"pendingQueue\">\u003cp class=\"small muted\" style=\"margin:0;\">正在读取队列。\u003c/p>\u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>班级共性分析\u003c/h2>\u003cp>勾选至少 2 份同班已批改作业。\u003c/p>\u003c/div>\u003ca class=\"section-link\" href=\"common-issues.html\">报告 →\u003c/a>\u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cdiv id=\"analysisList\" style=\"max-height:300px;overflow:auto;\">\u003c/div>\n            \u003cdiv class=\"form-actions\" style=\"margin-top:12px;\">\n              \u003cbutton class=\"btn btn-secondary btn-sm\" type=\"button\" id=\"selectAllAnalysis\">全选 / 取消\u003c/button>\n              \u003cbutton class=\"btn btn-primary btn-sm\" type=\"button\" id=\"generateReport\" disabled>生成共性报告\u003c/button>\n            \u003c/div>\n            \u003cp class=\"small muted\" style=\"margin:10px 0 0;\" id=\"analysisCount\">已选择 0 份\u003c/p>\n            \u003cdiv id=\"latestReport\" class=\"small muted\" style=\"margin-top:8px;\">\u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>批改提示\u003c/h2>\u003cp>让 AI 结果更贴近真实课堂。\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cul class=\"plain-list\">\n              \u003cli>照片尽量正对作业、光线均匀，题干与作答完整入镜。\u003c/li>\n              \u003cli>一次上传一份作业，避免多份作业互相干扰。\u003c/li>\n              \u003cli>AI 结果需教师复核，尤其是手写识别存疑处。\u003c/li>\n              \u003cli>优秀答案会匿名展示，请确认已获得学生授权。\u003c/li>\n            \u003c/ul>\n          \u003c/div>\n        \u003c/section>\n      \u003c/aside>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ role: 'teacher', active: 'homework', title: '作业批改 · 知行化学' });\n      if (!user) return;\n\n      var className = user.className || CH.DEMO_CLASS;\n      var students = CH.getClassStudents(className).slice().sort(function (a, b) { return a.studentId.localeCompare(b.studentId); });\n      var state = {\n        batchId: CH.BATCHES[0] ? CH.BATCHES[0].id : '',\n        studentId: students[0] ? students[0].studentId : '',\n        file: null,\n        fileKind: '',\n        dataUrl: '',\n        currentSubmission: null,\n        viewingSubmission: null,\n        busy: false,\n        fileToken: 0,\n        progressTimer: null\n      };\n\n      var studentSelect = document.getElementById('studentSelect');\n      var batchSelect = document.getElementById('batchSelect');\n      var selfReport = document.getElementById('selfReport');\n      var fileInput = document.getElementById('fileInput');\n      var uploadZone = document.getElementById('uploadZone');\n      var previewBox = document.getElementById('filePreview');\n      var resultBox = document.getElementById('resultBox');\n      var queueNotice = document.getElementById('queueNotice');\n      var progressCard = document.getElementById('progressCard');\n      var gradeAI = document.getElementById('gradeAI');\n      var gradeDemo = document.getElementById('gradeDemo');\n      var printResult = document.getElementById('printResult');\n\n      function selectedStudent() {\n        return students.filter(function (item) { return item.studentId === state.studentId; })[0] || null;\n      }\n\n      function selectedBatch() {\n        return CH.BATCHES.filter(function (item) { return item.id === state.batchId; })[0] || null;\n      }\n\n      function initSelects() {\n        studentSelect.innerHTML = students.length ? students.map(function (item) {\n          return '\u003coption value=\"' + CH.escapeHTML(item.studentId) + '\">' + CH.escapeHTML(item.name) + ' · ' + CH.escapeHTML(item.studentId) + '\u003c/option>';\n        }).join('') : '\u003coption value=\"\">暂无学生\u003c/option>';\n        batchSelect.innerHTML = CH.BATCHES.map(function (item) {\n          return '\u003coption value=\"' + CH.escapeHTML(item.id) + '\">' + CH.escapeHTML(item.name) + ' · ' + CH.escapeHTML(item.unit) + '\u003c/option>';\n        }).join('');\n        studentSelect.value = state.studentId;\n        batchSelect.value = state.batchId;\n      }\n\n      function updateApiBadge() {\n        var settings = CH.getSettings();\n        var badge = document.getElementById('apiBadge');\n        if (settings.forceDemo) {\n          badge.className = 'tag tag-amber';\n          badge.textContent = '仅演示数据';\n        } else if (settings.apiKey) {\n          badge.className = 'tag tag-green';\n          badge.textContent = 'API 已配置 · ' + settings.model;\n        } else {\n          badge.className = 'tag tag-gray';\n          badge.textContent = '未配置 Key · 自动演示';\n        }\n      }\n\n      function renderStats() {\n        var subs = CH.getSubmissions().filter(function (item) { return item.className === className; });\n        var pending = subs.filter(function (item) { return item.status === 'pending'; });\n        var graded = subs.filter(function (item) { return item.status === 'graded' && item.result; });\n        document.getElementById('statPending').textContent = pending.length;\n        document.getElementById('statGraded').textContent = graded.length;\n        document.getElementById('statExcellent').textContent = CH.getActiveExcellent().length;\n        document.getElementById('statStudents').textContent = students.length;\n        document.getElementById('pendingBadge').textContent = pending.length + ' 份';\n      }\n\n      function renderPreview() {\n        previewBox.innerHTML = '';\n        if (!state.file) return;\n        var thumb = state.dataUrl\n          ? '\u003cimg src=\"' + state.dataUrl + '\" alt=\"作业图片预览\">'\n          : '\u003cdiv class=\"file-placeholder\">PDF\u003c/div>';\n        var kindText = state.fileKind === 'pdf' ? 'PDF 文件 · 仅记录文件名，调用 AI 前请改用 JPG/PNG 图片' : '图片已压缩，可发送给多模态接口';\n        previewBox.innerHTML = '\u003cdiv class=\"file-preview\">' + thumb + '\u003cdiv class=\"file-info\">\u003cstrong>' + CH.escapeHTML(state.file.name) + '\u003c/strong>\u003csmall>' + CH.escapeHTML(kindText) + '\u003c/small>\u003c/div>\u003cbutton class=\"btn btn-ghost btn-sm file-remove\" type=\"button\" data-remove-file>移除\u003c/button>\u003c/div>';\n      }\n\n      previewBox.addEventListener('click', function (event) {\n        if (!event.target.closest('[data-remove-file]')) return;\n        state.file = null;\n        state.fileKind = '';\n        state.dataUrl = '';\n        fileInput.value = '';\n        renderPreview();\n      });\n\n      function acceptFile(file) {\n        if (!file) return;\n        var name = String(file.name || '');\n        var isImage = /^image\\/(jpeg|png|webp)$/i.test(file.type) || /\\.(jpe?g|png)$/i.test(name);\n        var isPdf = file.type === 'application/pdf' || /\\.pdf$/i.test(name);\n        if (!isImage && !isPdf) {\n          CH.toast('仅支持 JPG / PNG 图片或 PDF 文件。', 'error');\n          return;\n        }\n        if (file.size > 20 * 1024 * 1024) {\n          CH.toast('文件超过 20MB，请压缩后重试。', 'error');\n          return;\n        }\n        state.file = file;\n        state.fileKind = isPdf ? 'pdf' : 'image';\n        state.dataUrl = '';\n        var token = ++state.fileToken;\n        renderPreview();\n        if (isPdf) {\n          CH.toast('已记录 PDF 文件名。演示版优先按图片批改，调用 AI 前请上传 JPG/PNG。', 'warning');\n          return;\n        }\n        CH.compressImage(file, 1600, 0.86).then(function (out) {\n          if (token !== state.fileToken) return;\n          state.dataUrl = out.dataUrl;\n          renderPreview();\n          CH.toast('图片已压缩至 ' + out.width + ' × ' + out.height + '，可以开始批改。', 'success');\n        }).catch(function (error) {\n          if (token !== state.fileToken) return;\n          state.file = null;\n          state.fileKind = '';\n          renderPreview();\n          CH.toast(error.message || '图片读取失败，请重试。', 'error');\n        });\n      }\n\n      uploadZone.addEventListener('click', function (event) {\n        if (event.target === fileInput) return;\n        fileInput.click();\n      });\n      uploadZone.addEventListener('keydown', function (event) {\n        if (event.key === 'Enter' || event.key === ' ') {\n          event.preventDefault();\n          fileInput.click();\n        }\n      });\n      fileInput.addEventListener('click', function (event) { event.stopPropagation(); });\n      fileInput.addEventListener('change', function () {\n        acceptFile(fileInput.files && fileInput.files[0]);\n      });\n      ['dragenter', 'dragover'].forEach(function (name) {\n        uploadZone.addEventListener(name, function (event) {\n          event.preventDefault();\n          uploadZone.classList.add('is-dragover');\n        });\n      });\n      ['dragleave', 'drop'].forEach(function (name) {\n        uploadZone.addEventListener(name, function (event) {\n          event.preventDefault();\n          uploadZone.classList.remove('is-dragover');\n        });\n      });\n      uploadZone.addEventListener('drop', function (event) {\n        var file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];\n        acceptFile(file);\n      });\n\n      function startProgress(label) {\n        progressCard.classList.add('is-visible');\n        document.getElementById('progressLabel').textContent = label;\n        document.getElementById('progressPercent').textContent = '12%';\n        document.getElementById('progressBar').style.width = '12%';\n        var percent = 12;\n        clearInterval(state.progressTimer);\n        state.progressTimer = setInterval(function () {\n          percent = Math.min(88, percent + Math.max(1, Math.round((90 - percent) / 6)));\n          document.getElementById('progressPercent').textContent = percent + '%';\n          document.getElementById('progressBar').style.width = percent + '%';\n        }, 650);\n      }\n\n      function finishProgress(label) {\n        clearInterval(state.progressTimer);\n        document.getElementById('progressLabel').textContent = label || '批改完成';\n        document.getElementById('progressPercent').textContent = '100%';\n        document.getElementById('progressBar').style.width = '100%';\n        setTimeout(function () {\n          if (!state.busy) progressCard.classList.remove('is-visible');\n        }, 1400);\n      }\n\n      function setBusy(busy) {\n        state.busy = busy;\n        gradeAI.disabled = busy;\n        gradeDemo.disabled = busy;\n        gradeAI.textContent = busy ? '正在批改…' : '开始 AI 多模态批改';\n        gradeDemo.textContent = busy ? '请稍候…' : '使用演示数据批改';\n      }\n\n      function showQueueNotice(text) {\n        if (!text) {\n          queueNotice.style.display = 'none';\n          queueNotice.innerHTML = '';\n          return;\n        }\n        queueNotice.style.display = 'block';\n        queueNotice.innerHTML = '\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>队列作业已载入：\u003c/strong>' + text + '\u003c/div>';\n      }\n\n      function syncQueueWithForm() {\n        if (!state.currentSubmission) return;\n        if (state.currentSubmission.studentId !== state.studentId || state.currentSubmission.batchId !== state.batchId) {\n          state.currentSubmission = null;\n          showQueueNotice('');\n        }\n      }\n\n      studentSelect.addEventListener('change', function () {\n        state.studentId = studentSelect.value;\n        syncQueueWithForm();\n      });\n      batchSelect.addEventListener('change', function () {\n        state.batchId = batchSelect.value;\n        syncQueueWithForm();\n      });\n\n      function loadPending(submission) {\n        state.currentSubmission = submission;\n        state.studentId = submission.studentId;\n        state.batchId = submission.batchId;\n        studentSelect.value = state.studentId;\n        batchSelect.value = state.batchId;\n        selfReport.value = submission.selfReport || '';\n        showQueueNotice(CH.escapeHTML(submission.studentName) + ' · ' + CH.escapeHTML(submission.batchName) + ' · 提交于 ' + CH.formatDate(submission.submittedAt, true) + '。上传该生作业图片后开始批改，或直接用演示数据生成结果。');\n        document.getElementById('gradingPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });\n        CH.toast('已载入 ' + submission.studentName + ' 的待批改作业。', 'info');\n      }\n\n      function renderPending() {\n        var pending = CH.getSubmissions().filter(function (item) {\n          return item.className === className && item.status === 'pending';\n        }).sort(function (a, b) { return new Date \n          CH.markExcellent(submission.id, question.no, comment);\n          close();\n          CH.toast('已匿名展示到优秀答案墙。', 'success');\n          renderResult(submission);\n          renderStats();\n        });\n        textarea.focus();\n      }\n\n      async function grade(withAI) {\n        if (state.busy) return;\n        if (!students.length) { CH.toast('当前班级还没有学生档案。', 'warning'); return; }\n        if (!state.studentId || !state.batchId) { CH.toast('请先选择学生和作业批次。', 'warning'); return; }\n        if (withAI && state.fileKind === 'pdf') {\n          CH.toast('PDF 演示版暂不支持直接识别，请上传 JPG/PNG 图片；也可先使用“演示数据批改”。', 'warning');\n          return;\n        }\n        if (withAI && !state.dataUrl) {\n          CH.toast('请先上传一张 JPG/PNG 作业图片，再调用多模态接口。', 'warning');\n          uploadZone.scrollIntoView({ behavior: 'smooth', block: 'center' });\n          return;\n        }\n\n        var useExisting = state.currentSubmission && state.currentSubmission.status === 'pending' && state.currentSubmission.studentId === state.studentId && state.currentSubmission.batchId === state.batchId;\n        var submission = useExisting ? state.currentSubmission : CH.createSubmission({\n          studentId: state.studentId,\n          batchId: state.batchId,\n          selfReport: selfReport.value.trim(),\n          fileName: state.file ? state.file.name : '教师上传作业',\n          source: state.fileKind === 'pdf' ? 'pdf' : 'upload',\n          status: 'pending'\n        });\n        setBusy(true);\n        startProgress(withAI ? '正在调用 DeepSeek 多模态批改…' : '正在载入演示批改数据…');\n        var fallbackNote = '';\n        try {\n          var result;\n          if (withAI) {\n            try {\n              result = await CH.tryAIGrade({\n                dataUrl: state.dataUrl,\n                batchId: state.batchId,\n                className: className,\n                selfReport: selfReport.value.trim(),\n                fileName: state.file ? state.file.name : ''\n              });\n              document.getElementById('progressBar').style.width = '82%';\n              document.getElementById('progressPercent').textContent = '82%';\n            } catch (error) {\n              fallbackNote = error && error.message ? error.message : '接口调用失败';\n              result = CH.getMockResult(state.batchId, Math.floor(Math.random() * 3));\n              result.fallbackReason = fallbackNote;\n            }\n          } else {\n            result = CH.getMockResult(state.batchId, Math.floor(Math.random() * 3));\n          }\n          var graded = CH.gradeSubmission(submission.id, result, { fileName: state.file ? state.file.name : submission.fileName });\n          state.currentSubmission = null;\n          state.viewingSubmission = graded;\n          showQueueNotice('');\n          selfReport.value = '';\n          renderResult(graded, fallbackNote);\n          renderStats();\n          renderPending();\n          renderAnalysisList();\n          finishProgress(fallbackNote ? '已回退演示数据' : '批改完成');\n          CH.toast(fallbackNote ? '接口未就绪，已自动使用演示数据完成批改。' : '批改完成，结果已写入学生档案。', fallbackNote ? 'warning' : 'success');\n          document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });\n        } catch (error) {\n          clearInterval(state.progressTimer);\n          progressCard.classList.remove('is-visible');\n          CH.toast(error.message || '批改失败，请重试。', 'error');\n        } finally {\n          setBusy(false);\n          updateAnalysisSelection();\n        }\n      }\n\n      gradeAI.addEventListener('click', function () { grade(true); });\n      gradeDemo.addEventListener('click', function () { grade(false); });\n      printResult.addEventListener('click', function () { window.print(); });\n\n      function renderLatest() {\n        var latest = CH.getSubmissions().filter(function (item) {\n          return item.className === className && item.status === 'graded' && item.result;\n        }).sort(function (a, b) { return new Date(b.gradedAt || b.submittedAt) - new Date(a.gradedAt || a.submittedAt); })[0];\n        if (latest) renderResult(latest);\n      }\n\n      initSelects();\n      updateApiBadge();\n      renderStats();\n      renderPending();\n      renderAnalysisList();\n      updateAnalysisSelection();\n\n      var params = new URLSearchParams(window.__CHEMHUB_QUERY__);\n      var sid = params.get('submission');\n      var requested = sid ? CH.getSubmissionById(sid) : null;\n      if (requested && requested.className === className) {\n        state.studentId = requested.studentId;\n        state.batchId = requested.batchId;\n        studentSelect.value = state.studentId;\n        batchSelect.value = state.batchId;\n        if (requested.status === 'pending') {\n          loadPending(requested);\n        } else if (requested.result) {\n          renderResult(requested);\n        }\n      } else {\n        renderLatest();\n      }\n    })();\n  "},"student-homework.html":{"page":"student-homework.html","title":"我的作业 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003cdiv class=\"page-head\">\n      \u003cdiv>\n        \u003cnav class=\"breadcrumbs\" aria-label=\"面包屑\">\u003ca href=\"student-dashboard.html\">学生工作台\u003c/a>\u003cspan>/\u003c/span>\u003cspan>作业与评价\u003c/span>\u003c/nav>\n        \u003ch1>我的作业\u003c/h1>\n        \u003cp>\u003cspan data-user-name>同学\u003c/span>，选择作业批次并上传作业照片即可提交。提交后显示“待批改”，教师完成 AI 批改与复核后，你可以在这里查看等级、三维度评语和逐题解析。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"page-head-actions\">\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"excellent-answers.html\">优秀答案墙\u003c/a>\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"student-profile.html\">我的档案\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"stats-grid\">\n      \u003cdiv class=\"stat-card\">\u003cspan class=\"stat-icon\">✓\u003c/span>\u003cdiv>\u003cstrong id=\"statGraded\">0\u003c/strong>\u003csmall>已批改\u003c/small>\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-card\">\u003cspan class=\"stat-icon\">◷\u003c/span>\u003cdiv>\u003cstrong id=\"statPending\">0\u003c/strong>\u003csmall>待批改\u003c/small>\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-card\">\u003cspan class=\"stat-icon\">◎\u003c/span>\u003cdiv>\u003cstrong id=\"statAverage\">—\u003c/strong>\u003csmall>平均分\u003c/small>\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-card\">\u003cspan class=\"stat-icon\">◈\u003c/span>\u003cdiv>\u003cstrong id=\"statWeak\">0\u003c/strong>\u003csmall>薄弱点标签\u003c/small>\u003c/div>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"grid grid-3\" style=\"margin-top:18px;\">\n      \u003cdiv class=\"span-2\">\n        \u003csection class=\"card\" id=\"submitPanel\">\n          \u003cdiv class=\"card-header\">\n            \u003cdiv>\u003ch2>提交作业\u003c/h2>\u003cp>图片会先在本地压缩用于预览；提交时仅保存文件名与自述，原始照片不会写入浏览器存储。\u003c/p>\u003c/div>\n            \u003cspan class=\"tag tag-blue\">学生端\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cdiv class=\"form-grid\">\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"batchSelect\">选择作业批次\u003c/label>\n                \u003cselect class=\"input\" id=\"batchSelect\">\u003c/select>\n              \u003c/div>\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"fileInputLabel\">作业文件\u003c/label>\n                \u003cdiv class=\"upload-zone upload-zone-compact\" id=\"uploadZone\" role=\"button\" tabindex=\"0\">\n                  \u003cspan class=\"upload-icon\">⇪\u003c/span>\n                  \u003ch3>点击选择或拖入作业照片\u003c/h3>\n                  \u003cp>JPG / PNG 图片；PDF 仅记录文件名。若暂无照片，也可直接提交一次演示作业。\u003c/p>\n                  \u003cinput type=\"file\" id=\"fileInput\" accept=\"image/jpeg,image/png,application/pdf\" hidden>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv id=\"filePreview\">\u003c/div>\n            \u003cdiv class=\"field\" style=\"margin-top:14px;\">\n              \u003clabel for=\"selfReport\">我的自述（选填）\u003c/label>\n              \u003ctextarea class=\"input\" id=\"selfReport\" rows=\"3\" placeholder=\"例如：这次重点检查了离子方程式的拆分，计算题写出了完整步骤；第 4 题不太确定。\">\u003c/textarea>\n              \u003csmall class=\"field-hint\">写清楚自己的思路和疑惑，有助于教师和 AI 关注你的真实问题。\u003c/small>\n            \u003c/div>\n            \u003cdiv class=\"alert alert-info\">\n              \u003cspan class=\"alert-icon\">i\u003c/span>\n              \u003cdiv>提交后状态为“待批改”。教师完成批改后，系统会自动更新你的档案、等级趋势和薄弱点标签。请勿上传包含真实姓名、学号等隐私信息的图片。\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"form-actions\" style=\"margin-top:14px;\">\n              \u003cbutton class=\"btn btn-primary\" type=\"button\" id=\"submitHomework\">提交作业\u003c/button>\n              \u003ca class=\"btn btn-ghost\" href=\"excellent-answers.html\">先看看优秀答案\u003c/a>\n            \u003c/div>\n            \u003cp class=\"small muted\" style=\"margin:10px 0 0;\">未选择文件时，将以“演示提交”记录，便于课堂演示完整流程。\u003c/p>\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n\n      \u003caside class=\"stack\">\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>我的提交记录\u003c/h2>\u003cp>按提交时间倒序排列。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-gray\" id=\"recordCount\">0 份\u003c/span>\u003c/div>\n          \u003cdiv class=\"card-body\" id=\"recordList\">\u003cp class=\"small muted\" style=\"margin:0;\">正在读取提交记录。\u003c/p>\u003c/div>\n        \u003c/section>\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>我的薄弱点\u003c/h2>\u003cp>根据已批改作业自动归纳。\u003c/p>\u003c/div>\u003ca class=\"section-link\" href=\"student-profile.html\">档案 →\u003c/a>\u003c/div>\n          \u003cdiv class=\"card-body\" id=\"weakBox\">\u003cp class=\"small muted\" style=\"margin:0;\">暂无批改记录。\u003c/p>\u003c/div>\n        \u003c/section>\n      \u003c/aside>\n    \u003c/div>\n\n    \u003csection class=\"section\" id=\"resultSection\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>批改结果与逐题解析\u003c/h2>\u003cp>展示当前选择的提交；已批改的作业会包含等级、三维度评语、整体评价与逐题解析。\u003c/p>\u003c/div>\n        \u003ca class=\"section-link\" href=\"student-profile.html\">查看成长档案 →\u003c/a>\n      \u003c/div>\n      \u003cdiv id=\"resultBox\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">✓\u003c/div>\u003ch3>还没有选择作业\u003c/h3>\u003cp>提交一份作业后，等待教师批改；也可以点击右侧记录查看已有结果。\u003c/p>\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>优秀答案墙\u003c/h2>\u003cp>匿名展示教师标记的优秀作答，学习思路与表达，不要直接照抄。\u003c/p>\u003c/div>\n        \u003ca class=\"section-link\" href=\"excellent-answers.html\">进入完整答案墙 →\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"grid grid-2\" id=\"excellentPreview\">\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-info\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>隐私与学术诚信：\u003c/strong>本页数据仅保存在当前浏览器，不会上传到服务器。AIGC 评语用于辅助学习，最终成绩与评价以教师复核为准。\u003c/div>\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ role: 'student', active: 'homework', title: '我的作业 · 知行化学' });\n      if (!user) return;\n      var student = CH.getStudentByUserId(user.id);\n      if (!student) {\n        document.getElementById('submitPanel').innerHTML = '\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">!\u003c/div>\u003ch3>未找到学生档案\u003c/h3>\u003cp>请退出后重新注册学生账号，或在设置页恢复演示数据。\u003c/p>\u003ca class=\"btn btn-secondary btn-sm\" href=\"settings.html\">前往设置\u003c/a>\u003c/div>';\n        return;\n      }\n\n      var state = { batchId: CH.BATCHES[0] ? CH.BATCHES[0].id : '', file: null, fileKind: '', dataUrl: '', submitting: false, viewing: null, token: 0 };\n      var batchSelect = document.getElementById('batchSelect');\n      var fileInput = document.getElementById('fileInput');\n      var uploadZone = document.getElementById('uploadZone');\n      var previewBox = document.getElementById('filePreview');\n      var resultBox = document.getElementById('resultBox');\n      var submitButton = document.getElementById('submitHomework');\n\n      function mySubmissions() {\n        return CH.getSubmissions().filter(function (item) { return item.studentId === student.studentId; }).sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });\n      }\n\n      function renderStats() {\n        var list = mySubmissions();\n        var graded = list.filter(function (item) { return item.status === 'graded' && item.result; });\n        var stats = CH.getStudentStats(student.studentId);\n        document.getElementById('statGraded').textContent = graded.length;\n        document.getElementById('statPending').textContent = list.filter(function (item) { return item.status === 'pending'; }).length;\n        document.getElementById('statAverage').textContent = stats.average ? stats.average : '—';\n        document.getElementById('statWeak').textContent = student.weakTags ? student.weakTags.length : 0;\n      }\n\n      function initBatches() {\n        batchSelect.innerHTML = CH.BATCHES.map(function (item) {\n          return '\u003coption value=\"' + CH.escapeHTML(item.id) + '\">' + CH.escapeHTML(item.name) + ' · 截止 ' + CH.escapeHTML(item.due) + '\u003c/option>';\n        }).join('');\n        batchSelect.value = state.batchId;\n      }\n\n      function renderPreview() {\n        previewBox.innerHTML = '';\n        if (!state.file) return;\n        var thumb = state.dataUrl ? '\u003cimg src=\"' + state.dataUrl + '\" alt=\"作业预览\">' : '\u003cdiv class=\"file-placeholder\">PDF\u003c/div>';\n        previewBox.innerHTML = '\u003cdiv class=\"file-preview\">' + thumb + '\u003cdiv class=\"file-info\">\u003cstrong>' + CH.escapeHTML(state.file.name) + '\u003c/strong>\u003csmall>' + (state.fileKind === 'pdf' ? 'PDF 文件 · 仅记录文件名' : '图片已压缩，仅用于本地预览') + '\u003c/small>\u003c/div>\u003cbutton class=\"btn btn-ghost btn-sm file-remove\" type=\"button\" data-remove-file>移除\u003c/button>\u003c/div>';\n      }\n\n      previewBox.addEventListener('click', function (event) {\n        if (!event.target.closest('[data-remove-file]')) return;\n        state.file = null;\n        state.fileKind = '';\n        state.dataUrl = '';\n        fileInput.value = '';\n        renderPreview();\n      });\n\n      function acceptFile(file) {\n        if (!file) return;\n        var name = String(file.name || '');\n        var isImage = /^image\\/(jpeg|png|webp)$/i.test(file.type) || /\\.(jpe?g|png)$/i.test(name);\n        var isPdf = file.type === 'application/pdf' || /\\.pdf$/i.test(name);\n        if (!isImage && !isPdf) { CH.toast('仅支持 JPG / PNG 图片或 PDF 文件。', 'error'); return; }\n        if (file.size > 20 * 1024 * 1024) { CH.toast('文件超过 20MB，请压缩后重试。', 'error'); return; }\n        state.file = file;\n        state.fileKind = isPdf ? 'pdf' : 'image';\n        state.dataUrl = '';\n        var token = ++state.token;\n        renderPreview();\n        if (isPdf) { CH.toast('PDF 已选择，提交后仅记录文件名。', 'info'); return; }\n        CH.compressImage(file, 1400, 0.82).then(function (out) {\n          if (token !== state.token) return;\n          state.dataUrl = out.dataUrl;\n          renderPreview();\n        }).catch(function (error) {\n          if (token !== state.token) return;\n          state.file = null;\n          state.fileKind = '';\n          renderPreview();\n          CH.toast(error.message || '图片读取失败。', 'error');\n        });\n      }\n\n      uploadZone.addEventListener('click', function (event) {\n        if (event.tar
