get === fileInput) return;\n        fileInput.click();\n      });\n      uploadZone.addEventListener('keydown', function (event) {\n        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fileInput.click(); }\n      });\n      fileInput.addEventListener('click', function (event) { event.stopPropagation(); });\n      fileInput.addEventListener('change', function () { acceptFile(fileInput.files && fileInput.files[0]); });\n      ['dragenter', 'dragover'].forEach(function (name) {\n        uploadZone.addEventListener(name, function (event) { event.preventDefault(); uploadZone.classList.add('is-dragover'); });\n      });\n      ['dragleave', 'drop'].forEach(function (name) {\n        uploadZone.addEventListener(name, function (event) { event.preventDefault(); uploadZone.classList.remove('is-dragover'); });\n      });\n      uploadZone.addEventListener('drop', function (event) {\n        acceptFile(event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0]);\n      });\n\n      function renderRecords() {\n        var list = mySubmissions();\n        document.getElementById('recordCount').textContent = list.length + ' 份';\n        var box = document.getElementById('recordList');\n        if (!list.length) {\n          box.innerHTML = '\u003cdiv class=\"empty-state\" style=\"padding:18px 10px;\">\u003cdiv class=\"empty-icon\">◷\u003c/div>\u003ch3>还没有提交\u003c/h3>\u003cp>选择批次后提交第一份作业。\u003c/p>\u003c/div>';\n          return;\n        }\n        box.innerHTML = '\u003cdiv class=\"pending-list\">' + list.slice(0, 6).map(function (item) {\n          var badge = item.status === 'graded' && item.result\n            ? '\u003cspan class=\"grade-badge ' + CH.gradeClass(item.result.grade) + '\">' + CH.escapeHTML(item.result.grade) + '\u003c/span>'\n            : '\u003cspan class=\"tag tag-amber\">待批改\u003c/span>';\n          return '\u003cbutton class=\"pending-item\" type=\"button\" style=\"width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);\" data-view=\"' + CH.escapeHTML(item.id) + '\">\u003cdiv class=\"pending-main\">\u003cstrong>' + CH.escapeHTML(item.batchName) + '\u003c/strong>\u003cp>' + CH.formatDate(item.submittedAt, true) + ' · ' + (item.status === 'graded' ? '已批改' : '等待教师批改') + '\u003c/p>\u003c/div>' + badge + '\u003c/button>';\n        }).join('') + '\u003c/div>';\n      }\n\n      document.getElementById('recordList').addEventListener('click', function (event) {\n        var button = event.target.closest('[data-view]');\n        if (!button) return;\n        var submission = CH.getSubmissionById(button.getAttribute('data-view'));\n        if (!submission || submission.studentId !== student.studentId) return;\n        state.viewing = submission;\n        renderResult(submission);\n        document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });\n      });\n\n      function renderWeakTags() {\n        var stats = CH.getStudentStats(student.studentId);\n        var tags = student.weakTags || [];\n        var box = document.getElementById('weakBox');\n        if (!tags.length) {\n          box.innerHTML = '\u003cp class=\"small muted\" style=\"margin:0;\">完成一次批改后，这里会自动归纳薄弱点。\u003c/p>';\n          return;\n        }\n        box.innerHTML = '\u003cdiv class=\"tag-list\">' + tags.map(function (tag) { return '\u003cspan class=\"tag tag-weak\">' + CH.escapeHTML(tag) + '\u003c/span>'; }).join('') + '\u003c/div>\u003cp class=\"small muted\" style=\"margin:10px 0 0;\">平均分 ' + (stats.average || '—') + '，已批改 ' + stats.graded + ' 份。\u003c/p>';\n      }\n\n      function dimensionHTML(label, data) {\n        var score = Math.max(0, Math.min(100, Number(data && data.score) || 0));\n        return '\u003cdiv class=\"dimension-card\">\u003cdiv class=\"dimension-top\">\u003cstrong>' + label + '\u003c/strong>\u003cspan>' + score + '\u003c/span>\u003c/div>\u003cdiv class=\"dimension-bar\">\u003cspan style=\"width:' + score + '%\">\u003c/span>\u003c/div>\u003cp>' + CH.escapeHTML((data && data.comment) || '暂无评语。') + '\u003c/p>\u003c/div>';\n      }\n\n      function pendingHTML(submission) {\n        return '\u003cdiv class=\"result-shell\">\u003cdiv class=\"result-banner\">\u003cdiv>\u003ch2>' + CH.escapeHTML(submission.batchName) + '\u003c/h2>\u003cp>' + CH.escapeHTML(submission.unit || '') + ' · 提交于 ' + CH.formatDate(submission.submittedAt, true) + '\u003c/p>\u003cdiv class=\"result-meta\">\u003cspan class=\"tag tag-amber\">待批改\u003c/span>\u003cspan class=\"tag tag-gray\">已进入教师队列\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"score-panel\">\u003cdiv class=\"score-ring\" style=\"background:#e8f0f6\">\u003cdiv>\u003cstrong>—\u003c/strong>\u003csmall>等待批改\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"alert alert-warning\">\u003cspan class=\"alert-icon\">◷\u003c/span>\u003cdiv>\u003cstrong>已提交成功。\u003c/strong>教师完成 AI 批改与人工复核后，这里会显示等级、三维度评语和逐题解析；档案也会同步更新。你可以先浏览优秀答案墙。\u003c/div>\u003c/div>' + (submission.selfReport ? '\u003cdiv class=\"overall-box\">\u003cstrong>我的自述\u003c/strong>' + CH.escapeHTML(submission.selfReport) + '\u003c/div>' : '') + '\u003c/div>';\n      }\n\n      function renderResult(submission) {\n        if (!submission || submission.studentId !== student.studentId) {\n          CH.toast('未找到这份作业，或它不属于当前账号。', 'error');\n          return;\n        }\n        state.viewing = submission;\n        if (submission.status !== 'graded' || !submission.result) {\n          resultBox.innerHTML = pendingHTML(submission);\n          return;\n        }\n        var data = submission.result;\n        var score = Math.max(0, Math.min(100, Number(data.score) || 0));\n        var grade = data.grade || CH.gradeFromScore(score);\n        var dims = data.dimensions || {};\n        var questions = Array.isArray(data.questions) ? data.questions : [];\n        var weakTags = Array.isArray(data.weakTags) ? data.weakTags : [];\n        var sourceText = data.isMock ? '演示批改数据（教师可复核）' : ('DeepSeek 多模态 · ' + (data.model || CH.getSettings().model));\n        var questionsHTML = questions.map(function (q) {\n          var errorTag = q.errorType ? '\u003cspan class=\"tag tag-red\">' + CH.escapeHTML(q.errorType) + '\u003c/span>' : '';\n          var weakTag = q.tag ? '\u003cspan class=\"tag tag-weak\">' + CH.escapeHTML(q.tag) + '\u003c/span>' : '';\n          return '\u003carticle class=\"question-card\">\u003cdiv class=\"question-top\">\u003cspan class=\"question-no\">' + CH.escapeHTML(String(q.no)) + '\u003c/span>\u003cdiv class=\"question-heading\">\u003cp class=\"question-text\">' + CH.escapeHTML(q.question) + '\u003c/p>\u003cdiv class=\"question-badges\">\u003cspan class=\"verdict ' + CH.verdictClass(q.verdict) + '\">' + CH.escapeHTML(q.verdict) + '\u003c/span>' + errorTag + weakTag + '\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"question-body\">\u003cdiv class=\"qa-block\">\u003cspan class=\"qa-label\">我的作答\u003c/span>\u003cp class=\"qa-text\">' + CH.escapeHTML(q.studentAnswer) + '\u003c/p>\u003c/div>\u003cdiv class=\"qa-block\">\u003cspan class=\"qa-label\">判定依据\u003c/span>\u003cp class=\"qa-text\">' + CH.escapeHTML(q.reason) + '\u003c/p>\u003c/div>\u003cdiv class=\"analysis-grid\">\u003cdiv class=\"analysis-block wrong-cause\">\u003cspan class=\"qa-label\">错因分析\u003c/span>\u003cp class=\"qa-text\">' + CH.escapeHTML(q.reason) + '\u003c/p>\u003c/div>\u003cdiv class=\"analysis-block correct-way\">\u003cspan class=\"qa-label\">正确思路\u003c/span>\u003cp class=\"qa-text\">' + CH.escapeHTML(q.correctApproach) + '\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>';\n        }).join('');\n        resultBox.innerHTML = '\u003cdiv class=\"result-shell\">\u003cdiv class=\"result-banner\">\u003cdiv>\u003ch2>' + CH.escapeHTML(submission.batchName) + '\u003c/h2>\u003cp>' + CH.escapeHTML(submission.unit || '') + ' · 批改于 ' + CH.formatDate(submission.gradedAt, true) + ' · ' + CH.escapeHTML(sourceText) + '\u003c/p>\u003cdiv class=\"result-meta\">\u003cspan class=\"tag tag-blue\">' + questions.length + ' 题解析\u003c/span>\u003cspan class=\"tag tag-green\">已同步我的档案\u003c/span>\u003ca class=\"tag tag-gray\" href=\"student-profile.html\">查看档案 →\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"score-panel\">\u003cdiv class=\"score-ring\" style=\"background:conic-gradient(var(--blue-600) 0 ' + score + '%, #e8f0f6 ' + score + '% 100%)\">\u003cdiv>\u003cstrong>' + score + '\u003c/strong>\u003csmall>综合得分\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"score-copy\">\u003cspan class=\"grade-badge ' + CH.gradeClass(grade) + '\">' + CH.escapeHTML(grade) + '\u003c/span>\u003cp>等级 / 100 分制\u003c/p>\u003c/div>\u003c/div>\u003c/div>' +\n          '\u003cdiv class=\"dimension-grid\">' + dimensionHTML('知识准确性', dims.accuracy) + dimensionHTML('思维完整性', dims.logic) + dimensionHTML('规范性', dims.normativity) + '\u003c/div>' +\n          '\u003cdiv class=\"overall-box\">\u003cstrong>教师 / AI 整体评价\u003c/strong>' + CH.escapeHTML(data.overall) + '\u003c/div>' +\n          '\u003cdiv class=\"weak-tags\">\u003cspan class=\"weak-label\">本次薄弱点：\u003c/span>' + (weakTags.length ? weakTags.map(function (tag) { return '\u003cspan class=\"tag tag-weak\">' + CH.escapeHTML(tag) + '\u003c/span>'; }).join('') : '\u003cspan class=\"tag tag-gray\">本次未发现明显薄弱点\u003c/span>') + '\u003c/div>' +\n          '\u003cdiv class=\"section-head\" style=\"margin:4px 0 0;\">\u003cdiv>\u003ch2>逐题解析\u003c/h2>\u003cp>先看“错因分析”，再合上页面独立重做一遍，最后用“正确思路”检查。\u003c/p>\u003c/div>\u003c/div>' +\n          '\u003cdiv class=\"question-list\">' + (questionsHTML || '\u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cp>本次没有逐题解析。\u003c/p>\u003c/div>\u003c/div>') + '\u003c/div>' +\n          '\u003cdiv class=\"alert alert-info\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>评语由 AIGC 辅助生成，教师已进行复核。若对手写识别或判定有疑问，请带着原卷找教师面批。\u003c/div>\u003c/div>\u003c/div>';\n      }\n\n      function renderExcellentPreview() {\n        var list = CH.getActiveExcellent().slice(0, 2);\n        var box = document.getElementById('excellentPreview');\n        if (!list.length) {\n          box.innerHTML = '\u003cdiv class=\"card\" style=\"grid-column:1/-1;\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">★\u003c/div>\u003ch3>答案墙暂时为空\u003c/h3>\u003cp>教师标记优秀作答后，这里会出现匿名示范。\u003c/p>\u003c/div>\u003c/div>';\n          return;\n        }\n        box.innerHTML = list.map(function (item) {\n          return '\u003cdiv class=\"excellent-card\">\u003cp class=\"quote\">优秀答案 · 匿名展示\u003c/p>\u003ch3>' + CH.escapeHTML(CH.truncate(item.question, 56)) + '\u003c/h3>\u003cp class=\"answer\">' + CH.escapeHTML(CH.truncate(item.answer, 130)) + '\u003c/p>\u003cdiv class=\"teacher-comment\">\u003cstrong>教师评语：\u003c/strong>' + CH.escapeHTML(CH.truncate(item.comment, 86)) + '\u003c/div>\u003cdiv style=\"margin-top:10px;\">\u003ca class=\"section-link\" href=\"excellent-answers.html\">查看完整答案墙 →\u003c/a>\u003c/div>\u003c/div>';\n        }).join('');\n      }\n\n      submitButton.addEventListener('click', function () {\n        if (state.submitting) return;\n        state.submitting = true;\n        submitButton.disabled = true;\n        submitButton.textContent = '提交中…';\n        try {\n          var submission = CH.createSubmission({\n            studentId: student.studentId,\n            batchId: state.batchId,\n            selfReport: document.getElementById('selfReport').value.trim(),\n            fileName: state.file ? state.file.name : '演示提交（未上传图片）',\n            source: state.fileKind === 'pdf' ? 'pdf' : (state.file ? 'upload' : 'demo-submit'),\n            status: 'pending'\n          });\n          state.file = null;\n          state.fileKind = '';\n          state.dataUrl = '';\n          fileInput.value = '';\n          document.getElementById('selfReport').value = '';\n          renderPreview();\n          renderResult(submission);\n          renderStats();\n          renderRecords();\n          CH.toast('提交成功，状态为“待批改”。', 'success');\n          document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });\n        } catch (error) {\n          CH.toast(error.message || '提交失败，请重试。', 'error');\n        } finally {\n          state.submitting = false;\n          submitButton.disabled = false;\n          submitButton.textContent = '提交作业';\n        }\n      });\n\n      initBatches();\n      renderStats();\n      renderRecords();\n      renderWeakTags();\n      renderExcellentPreview();\n\n      var params = new URLSearchParams(window.__CHEMHUB_QUERY__);\n      var sid = params.get('submission');\n      var batchId = params.get('batch');\n      if (batchId && CH.getBatch(batchId)) {\n        state.batchId = batchId;\n        batchSelect.value = batchId;\n      }\n      var requested = sid ? CH.getSubmissionById(sid) : null;\n      if (requested && requested.studentId === student.studentId) {\n        renderResult(requested);\n      } else {\n        var list = mySubmissions();\n        var graded = list.filter(function (item) { return item.status === 'graded' && item.result; });\n        if (graded.length) renderResult(graded[0]);\n        else if (list.length) renderResult(list[0]);\n      }\n    })();\n  "},"student-profile.html":{"page":"student-profile.html","title":"学生档案 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003cdiv class=\"page-head\">\n      \u003cdiv>\n        \u003cnav class=\"breadcrumbs\" aria-label=\"面包屑\">\u003ca id=\"backDashboard\" href=\"teacher-dashboard.html\">工作台\u003c/a>\u003cspan>/\u003c/span>\u003cspan id=\"crumbLabel\">学生档案\u003c/span>\u003c/nav>\n        \u003ch1 id=\"pageTitle\">学生档案\u003c/h1>\n        \u003cp id=\"pageLead\">查看班级学生的批改历史、等级趋势与薄弱点，为个别化辅导提供依据。档案会随每次批改自动更新。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"page-head-actions\">\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"teacher-homework.html\" id=\"homeworkLink\">去批改作业\u003c/a>\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"common-issues.html\">班级共性分析\u003c/a>\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"excellent-answers.html\">优秀答案墙\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"profileLayout\" class=\"profile-layout\">\n      \u003cdiv class=\"card\">\u003cdiv class=\"card-body\">\u003cp class=\"small muted\" style=\"margin:0;\">正在读取档案。\u003c/p>\u003c/div>\u003c/div>\n    \u003c/div>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-info\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>数据说明：\u003c/strong>档案由每次批改结果自动汇总，包含等级趋势、薄弱点标签与最近解析。数据仅保存在当前浏览器；教师账号只能查看本班学生，学生账号只能查看本人档案。请勿录入真实师生隐私信息。\u003c/div>\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ active: 'profile', title: '学生档案 · 知行化学' });\n      if (!user) return;\n      var isTeacher = user.role === 'teacher';\n      var className = user.className || CH.DEMO_CLASS;\n      var layout = document.getElementById('profileLayout');\n      var pageTitle = document.getElementById('pageTitle');\n      var pageLead = document.getElementById('pageLead');\n      var crumbLabel = document.getElementById('crumbLabel');\n      var backDashboard = document.getElementById('backDashboard');\n      var homeworkLink = document.getElementById('homeworkLink');\n\n      backDashboard.href = isTeacher ? 'teacher-dashboard.html' : 'student-dashboard.html';\n      backDashboard.textContent = isTeacher ? '教师工作台' : '学生工作台';\n      homeworkLink.href = isTeacher ? 'teacher-homework.html' : 'student-homework.html';\n      homeworkLink.textContent = isTeacher ? '去批改作业' : '去提交作业';\n\n      var params = new URLSearchParams(window.__CHEMHUB_QUERY__);\n      var requestedId = params.get('studentId');\n      var ownStudent = !isTeacher ? CH.getStudentByUserId(user.id) : null;\n\n      function allClassStudents() {\n        return CH.getClassStudents(className).slice().sort(function (a, b) { return a.studentId.localeCompare(b.studentId); });\n      }\n\n      function currentStudent() {\n        if (!isTeacher) return ownStudent;\n        var list = allClassStudents();\n        var found = requestedId ? list.filter(function (item) { return item.studentId === requestedId; })[0] : null;\n        return found || list[0] || null;\n      }\n\n      function gradedSubmissions(studentId) {\n        return CH.getSubmissions().filter(function (item) {\n          return item.studentId === studentId && item.status === 'graded' && item.result;\n        }).sort(function (a, b) { return new Date(b.gradedAt || b.submittedAt) - new Date(a.gradedAt || a.submittedAt); });\n      }\n\n      function countWeakTags(subs) {\n        var counts = {};\n        subs.forEach(function (item) {\n          (item.result.weakTags || []).forEach(function (tag) {\n            counts[tag] = (counts[tag] || 0) + 1;\n          });\n        });\n        return Object.keys(counts).map(function (tag) { return { tag: tag, count: counts[tag] }; }).sort(function (a, b) {\n          if (b.count !== a.count) return b.count - a.count;\n          return a.tag.localeCompare(b.tag, 'zh-CN');\n        });\n      }\n\n      function renderTeacherSidebar(selected) {\n        var list = allClassStudents();\n        return '\u003caside class=\"stack\">\u003csection class=\"card\">\u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>班级学生\u003c/h2>\u003cp>' + CH.escapeHTML(className) + ' · 共 ' + list.length + ' 人\u003c/p>\u003c/div>\u003cspan class=\"tag tag-blue\">教师视图\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"field\" style=\"margin-bottom:10px;\">\u003cinput class=\"input\" id=\"studentSearch\" type=\"search\" placeholder=\"搜索姓名或学号…\" aria-label=\"搜索学生\">\u003c/div>\u003cdiv class=\"student-list\" id=\"studentList\">' + list.map(function (student) {\n          var stats = CH.getStudentStats(student.studentId);\n          var subs = gradedSubmissions(student.studentId);\n          var latestGrade = subs[0] && subs[0].result ? subs[0].result.grade : '—';\n          return '\u003ca class=\"student-item ' + (selected && selected.studentId === student.studentId ? 'is-active' : '') + '\" href=\"student-profile.html?studentId=' + encodeURIComponent(student.studentId) + '\" data-search=\"' + CH.escapeHTML(student.name + ' ' + student.studentId) + '\">\u003cspan class=\"student-avatar\">' + CH.escapeHTML(String(student.name || '学').slice(0, 1)) + '\u003c/span>\u003cspan class=\"student-meta\">\u003cstrong>' + CH.escapeHTML(student.name) + '\u003c/strong>\u003csmall>' + CH.escapeHTML(student.studentId) + ' · 平均 ' + (stats.average || '—') + ' 分\u003c/small>\u003c/span>\u003cspan class=\"mini-grade\">' + CH.escapeHTML(latestGrade) + '\u003c/span>\u003c/a>';\n        }).join('') + '\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"card\">\u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>班级概览\u003c/h2>\u003cp>基于本班已批改作业。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"card-body\" id=\"classOverview\">\u003c/div>\u003c/section>\u003c/aside>';\n      }\n\n      function renderClassOverview() {\n        var list = allClassStudents();\n        var allSubs = CH.getSubmissions().filter(function (item) {\n          return item.className === className && item.status === 'graded' && item.result;\n        });\n        var average = allSubs.length ? Math.round(allSubs.reduce(function (sum, item) { return sum + (Number(item.result.score) || 0); }, 0) / allSubs.length) : 0;\n        var pending = CH.getSubmissions().filter(function (item) { return item.className === className && item.status === 'pending'; }).length;\n        var box = document.getElementById('classOverview');\n        if (box) {\n          box.innerHTML = '\u003cdiv class=\"profile-stats\">\u003cdiv class=\"profile-stat\">\u003cstrong>' + (average || '—') + '\u003c/strong>\u003csmall>班级平均分\u003c/small>\u003c/div>\u003cdiv class=\"profile-stat\">\u003cstrong>' + allSubs.length + '\u003c/strong>\u003csmall>已批改作业\u003c/small>\u003c/div>\u003cdiv class=\"profile-stat\">\u003cstrong>' + pending + '\u003c/strong>\u003csmall>待批改\u003c/small>\u003c/div>\u003c/div>\u003cp class=\"small muted\" style=\"margin:12px 0 0;\">点击左侧学生查看完整档案；生成共性报告可进入“班级共性分析”。\u003c/p>';\n        }\n      }\n\n      function adviceFromWeak(weak) {\n        if (!weak.length) return '目前没有明显薄弱点。建议保持“先审题、再作答、最后检查守恒与规范”的习惯，并尝试更高阶的变式题。';\n        var top = weak.slice(0, 2).map(function (item) { return item.tag; });\n        return '优先复习「' + top.join('」「') + '」。建议先重看对应题目的错因与正确思路，再独立重做一遍，并用一道同类变式题检验是否真正掌握。';\n      }\n\n      function renderProfile(student) {\n        if (!student) {\n          return '\u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">◫\u003c/div>\u003ch3>暂无可查看的档案\u003c/h3>\u003cp>' + (isTeacher ? '本班还没有学生档案。请先注册学生账号或恢复演示数据。' : '未找到你的学生档案，请退出后重新注册。') + '\u003c/p>\u003ca class=\"btn btn-secondary btn-sm\" href=\"settings.html\">前往设置\u003c/a>\u003c/div>\u003c/div>';\n        }\n        var subs = gradedSubmissions(student.studentId);\n        var stats = CH.getStudentStats(student.studentId);\n        var weak = countWeakTags(subs);\n        var trend = student.gradeTrend && student.gradeTrend.length ? student.gradeTrend : subs.slice().reverse().map(function (item) {\n          return { date: item.gradedAt || item.submittedAt, score: item.result.score, grade: item.result.grade, batchName: item.batchName };\n        });\n        var resultBase = isTeacher ? 'teacher-homework.html?submission=' : 'student-homework.html?submission=';\n        var timeline = subs.map(function (item) {\n          var tags = (item.result.weakTags || []).slice(0, 3).map(function (tag) { return '\u003cspan class=\"tag tag-weak\">' + CH.escapeHTML(tag) + '\u003c/span>'; }).join(' ');\n          return '\u003cdiv class=\"timeline-item\">\u003cdiv class=\"timeline-dot\">' + CH.escapeHTML(item.result.grade) + '\u003c/div>\u003cdiv class=\"timeline-body\">\u003cdiv class=\"timeline-head\">\u003cstrong>' + CH.escapeHTML(item.batchName) + '\u003c/strong>\u003ctime>' + CH.formatDate(item.gradedAt || item.submittedAt, true) + '\u003c/time>\u003c/div>\u003cdiv class=\"timeline-meta\">\u003cspan>得分 ' + CH.escapeHTML(String(item.result.score)) + ' / 100\u003c/span>\u003cspan>' + CH.escapeHTML(item.unit || '') + '\u003c/span>\u003cspan>' + (item.result.isMock ? '演示批改' : 'AI 多模态批改') + '\u003c/span>\u003ca href=\"' + resultBase + encodeURIComponent(item.id) + '\">查看解析 →\u003c/a>\u003c/div>\u003cdiv class=\"tag-list\" style=\"margin-top:7px;\">' + (tags || '\u003cspan class=\"tag tag-gray\">本次无明显薄弱点\u003c/span>') + '\u003c/div>\u003c/div>\u003c/div>';\n        }).join('');\n\n        var recent = [];\n        subs.slice(0, 3).forEach(function (item) {\n          (item.result.questions || []).forEach(function (q) {\n            if (q.verdict !== '正确' && recent.length \u003c 4) {\n              recent.push({ question: q, submission: item });\n            }\n          });\n        });\n        var snippets = recent.map(function (entry) {\n          var q = entry.question;\n          var sub = entry.submission;\n          return '\u003cdiv class=\"analysis-snippet\">\u003cstrong>第 ' + CH.escapeHTML(String(q.no)) + ' 题 · ' + CH.escapeHTML(q.tag || q.errorType || '待巩固') + ' · ' + CH.escapeHTML(q.verdict) + '\u003c/strong>\u003cp>' + CH.escapeHTML(CH.truncate(q.question, 72)) + '\u003c/p>\u003cp>\u003cspan class=\"muted\">错因：\u003c/span>' + CH.escapeHTML(CH.truncate(q.reason, 92)) + '\u003c/p>\u003cp>\u003cspan class=\"muted\">正确思路：\u003c/span>' + CH.escapeHTML(CH.truncate(q.correctApproach, 110)) + '\u003c/p>\u003cp class=\"small\">\u003ca href=\"' + resultBase + encodeURIComponent(sub.id) + '\">查看完整解析 →\u003c/a>\u003c/p>\u003c/div>';\n        }).join('');\n\n        return '\u003cdiv class=\"stack\">' +\n          '\u003csection class=\"card\">\u003cdiv class=\"profile-head\">\u003cdiv class=\"profile-avatar\">' + CH.escapeHTML(String(student.name || '学').slice(0, 1)) + '\u003c/div>\u003cdiv class=\"profile-title\">\u003ch2>' + CH.escapeHTML(student.name) + '\u003c/h2>\u003cdiv class=\"profile-id\">' + CH.escapeHTML(student.studentId) + ' · ' + CH.escapeHTML(student.className) + ' · ' + CH.escapeHTML(user.school || CH.DEMO_SCHOOL) + '\u003c/div>\u003cp class=\"small muted\" style=\"margin:7px 0 0;\">档案更新于 ' + CH.formatDate(student.updatedAt || student.createdAt, true) + ' · ' + (isTeacher ? '教师视图' : '仅本人可见') + '\u003c/p>\u003c/div>\u003cdiv class=\"profile-stats\">\u003cdiv class=\"profile-stat\">\u003cstrong>' + (stats.average || '—') + '\u003c/strong>\u003csmall>平均分\u003c/small>\u003c/div>\u003cdiv class=\"profile-stat\">\u003cstrong>' + stats.graded + '\u003c/strong>\u003csmall>已批改\u003c/small>\u003c/div>\u003cdiv class=\"profile-stat\">\u003cstrong>' + (stats.highest || '—') + '\u003c/strong>\u003csmall>最高分\u003c/small>\u003c/div>\u003cdiv class=\"profile-stat\">\u003cstrong>' + weak.length + '\u003c/strong>\u003csmall>薄弱点\u003c/small>\u003c/div>\u003c/div>\u003c/div>' +\n          '\u003cdiv class=\"card-body stack\">' +\n          '\u003cdiv class=\"grid grid-2\">\u003cdiv class=\"card trend-card\" style=\"box-shadow:none;\">\u003cdiv class=\"section-head\" style=\"margin:0 0 8px;\">\u003cdiv>\u003ch2>等级趋势\u003c/h2>\u003cp>按批改时间顺序展示分数变化。\u003c/p>\u003c/div>\u003c/div>' + CH.buildTrendSVG(trend) + '\u003c/div>\u003cdiv class=\"card trend-card\" style=\"box-shadow:none;\">\u003cdiv class=\"section-head\" style=\"margin:0 0 8px;\">\u003cdiv>\u003ch2>薄弱点标签\u003c/h2>\u003cp>出现次数越多，越应优先复习。\u003c/p>\u003c/div>\u003c/div>' + (weak.length ? '\u003cdiv class=\"tag-list\">' + weak.map(function (item) { return '\u003cspan class=\"tag tag-weak\">' + CH.escapeHTML(item.tag) + ' ×' + item.count + '\u003c/span>'; }).join('') + '\u003c/div>' : '\u003cp class=\"small muted\" style=\"margin:0;\">暂无薄弱点，继续保持。\u003c/p>') + '\u003cdiv class=\"overall-box\" style=\"margin-top:12px;\">\u003cstrong>个别化建议\u003c/strong>' + CH.escapeHTML(adviceFromWeak(weak)) + '\u003c/div>\u003c/div>\u003c/div>' +\n          '\u003cdiv class=\"section-head\" style=\"margin:4px 0 0;\">\u003cdiv>\u003ch2>批改历史时间线\u003c/h2>\u003cp>从最近一次批改向前回溯，点击可查看完整解析。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-gray\">' + subs.length + ' 条记录\u003c/span>\u003c/div>' +\n          (subs.length ? '\u003cdiv class=\"timeline\">' + timeline + '\u003c/div>' : '\u003cdiv class=\"empty-state\" style=\"padding:26px;\">\u003cdiv class=\"empty-icon\">◷\u003c/div>\u003ch3>还没有批改记录\u003c/h3>\u003cp>完成并提交一份作业后，时间线会自动生成。\u003c/p>\u003ca class=\"btn btn-primary btn-sm\" href=\"' + (isTeacher ? 'teacher-homework.html' : 'student-homework.html') + '\">' + (isTeacher ? '去批改作业' : '去提交作业') + '\u003c/a>\u003c/div>') +\n          '\u003cdiv class=\"section-head\" style=\"margin:8px 0 0;\">\u003cdiv>\u003ch2>最近解析汇总\u003c/h2>\u003cp>从最近几份作业中抽取仍需巩固的题目，便于面批与个别辅导。\u003c/p>\u003c/div>\u003c/div>' +\n          (snippets || '\u003cdiv class=\"analysis-snippet\">\u003cstrong>最近没有需要重点订正的题目\u003c/strong>\u003cp>可以尝试更高阶的变式题，或把已做对的题目讲给同学听，检验是否真正理解。\u003c/p>\u003c/div>') +\n          '\u003c/div>\u003c/section>' +\n          (isTeacher ? '\u003csection class=\"card\">\u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>教师操作\u003c/h2>\u003cp>针对该生的下一步教学动作。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"form-actions\">\u003ca class=\"btn btn-primary btn-sm\" href=\"teacher-homework.html\">上传新作业批改\u003c/a>\u003ca class=\"btn btn-secondary btn-sm\" href=\"common-issues.html\">查看班级共性报告\u003c/a>\u003ca class=\"btn btn-ghost btn-sm\" href=\"excellent-answers.html\">查看优秀答案\u003c/a>\u003c/div>\u003cp class=\"small muted\" style=\"margin:10px 0 0;\">如需面批，可打印该生最近一次解析，结合原卷逐题核对。\u003c/p>\u003c/div>\u003c/section>' : '') +\n          '\u003c/div>';\n      }\n\n      function refreshView() {\n        var list = allClassStudents();\n        var student = currentStudent();\n        if (isTeacher && requestedId && (!student || student.studentId !== requestedId)) {\n          CH.toast('未找到该学生，已显示本班第一位学生。', 'warning');\n        }\n        if (!isTeacher && !student) {\n          layout.innerHTML = '\u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">!\u003c/div>\u003ch3>未找到学生档案\u003c/h3>\u003cp>请退出后重新注册学生账号，或在设置页恢复演示数据。\u003c/p>\u003ca class=\"btn btn-secondary btn-sm\" href=\"settings.html\">前往设置\u003c/a>\u003c/div>\u003c/div>';\n          return;\n        }\n        pageTitle.textContent = isTeacher ? '学生档案' : '我的档案';\n        pageLead.textContent = isTeacher\n          ? '查看班级学生的批改历史、等级趋势与薄弱点，为个别化辅导提供依据。档案会随每次批改自动更新。'\n          : '这里汇总你的批改历史、等级趋势、薄弱点与最近解析。每次教师完成批改后，档案会自动更新。';\n        crumbLabel.textContent = isTeacher ? '学生档案' : '我的档案';\n\n        if (isTeacher) {\n          layout.innerHTML = renderTeacherSidebar(student) + '\u003cdiv id=\"profileMain\">' + renderProfile(student) + '\u003c/div>';\n          renderClassOverview();\n          var search = document.getElementById('studentSearch');\n          if (search) {\n            search.addEventListener('input', function () {\n              var keyword = search.value.trim().toLowerCase();\n              Array.prototype.forEach.call(document.querySelectorAll('#studentList .student-item'), function (item) {\n                var text = String(item.getAttribute('data-search') || '').toLowerCase();\n                item.style.display = !keyword || text.indexOf(keyword) >= 0 ? '' : 'none';\n              });\n            });\n          }\n        } else {\n          layout.style.gridTemplateColumns = '1fr';\n          layout.innerHTML = '\u003cdiv id=\"profileMain\">' + renderProfile(student) + '\u003c/div>';\n        }\n      }\n\n      if (isTeacher && !allClassStudents().length) {\n        pageTitle.textContent = '学生档案';\n        layout.innerHTML = '\u003cdiv class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">◫\u003c/div>\u003ch3>本班还没有学生\u003c/h3>\u003cp>请先注册学生账号，或在设置页恢复演示数据。\u003c/p>\u003ca class=\"btn btn-secondary btn-sm\" href=\"settings.html\">前往设置\u003c/a>\u003c/div>\u003c/div>';\n        return;\n      }\n      refreshView();\n    })();\n  "},"common-issues.html":{"page":"common-issues.html","title":"班级共性分析 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003cdiv class=\"page-head\">\n      \u003cdiv>\n        \u003cnav class=\"breadcrumbs\" aria-label=\"面包屑\">\u003ca href=\"teacher-dashboard.html\">教师工作台\u003c/a>\u003cspan>/\u003c/span>\u003cspan>班级共性分析\u003c/span>\u003c/nav>\n        \u003ch1>班级共性分析\u003c/h1>\n        \u003cp>把多份已批改作业聚合为班级报告：定位高频错误、回看匿名错例、生成 1—3 条课堂讲评建议。报告只统计当前班级，不展示学生真实姓名。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"page-head-actions\">\n        \u003cbutton class=\"btn btn-secondary btn-sm\" type=\"button\" id=\"printReport\">打印报告\u003c/button>\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"teacher-homework.html\">返回批改\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"reportArea\" class=\"stack\">\n      \u003cdiv class=\"card\">\u003cdiv class=\"card-body\">\u003cp class=\"small muted\" style=\"margin:0;\">正在汇总班级批改数据。\u003c/p>\u003c/div>\u003c/div>\n    \u003c/div>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-info\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>使用说明：\u003c/strong>报告由 AI 批改结果自动聚合，典型错例统一以“学生 A / 学生 B”匿名呈现。建议在课堂讲评前先核对原卷，结合本班学情调整讲评顺序；报告中的 AIGC 内容需经教师人工复核。\u003c/div>\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ role: 'teacher', active: 'issues', title: '班级共性分析 · 知行化学' });\n      if (!user) return;\n      var className = user.className || CH.DEMO_CLASS;\n      var area = document.getElementById('reportArea');\n      var params = new URLSearchParams(window.__CHEMHUB_QUERY__);\n      var requestedId = params.get('report');\n\n      function classReports() {\n        return CH.getReports().filter(function (item) { return item.className === className; });\n      }\n\n      function classGraded() {\n        return CH.getSubmissions().filter(function (item) {\n          return item.className === className && item.status === 'graded' && item.result;\n        }).sort(function (a, b) { return new Date(b.gradedAt || b.submittedAt) - new Date(a.gradedAt || a.submittedAt); });\n      }\n\n      function pickReport() {\n        var reports = classReports();\n        if (!reports.length) return null;\n        if (requestedId) {\n          var found = reports.filter(function (item) { return item.id === requestedId; })[0];\n          if (found) return found;\n        }\n        return reports[0];\n      }\n\n      function renderNoReport() {\n        var graded = classGraded();\n        var canMake = graded.length >= 2;\n        area.innerHTML = '\u003csection class=\"card\">\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">▦\u003c/div>\u003ch3>还没有班级共性报告\u003c/h3>\u003cp>' +\n          (canMake ? '本班已有 ' + graded.length + ' 份已批改作业，可以立即生成第一份共性分析报告。' : '至少需要 2 份同班已批改作业才能生成报告。请先完成批改，或在设置页恢复演示数据。') +\n          '\u003c/p>' +\n          (canMake ? '\u003cbutton class=\"btn btn-primary\" type=\"button\" id=\"createReport\">基于本班 ' + graded.length + ' 份作业生成报告\u003c/button>' : '\u003ca class=\"btn btn-secondary\" href=\"teacher-homework.html\">去批改作业\u003c/a>') +\n          '\u003c/div>\u003c/section>' +\n          '\u003csection class=\"card\">\u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>怎样生成报告\u003c/h2>\u003cp>两种方式都可以。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"grid grid-2\">\u003cdiv class=\"analysis-snippet\">\u003cstrong>方式一：在批改页勾选\u003c/strong>\u003cp>进入“作业批改”，在已批改列表中勾选同一班级的 2 份及以上作业，点击“生成班级共性分析”。\u003c/p>\u003c/div>\u003cdiv class=\"analysis-snippet\">\u003cstrong>方式二：在本页一键生成\u003c/strong>\u003cp>点击上方按钮，系统会把本班全部已批改作业纳入统计，自动去重并匿名化。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>';\n        var button = document.getElementById('createReport');\n        if (button) {\n          button.addEventListener('click', function () {\n            button.disabled = true;\n            button.textContent = '正在生成…';\n            try {\n              var report = CH.generateCommonReport(graded.map(function (item) { return item.id; }));\n              CH.toast('班级共性报告已生成。', 'success');\n              window.__chemhubHashReplace('common-issues.html?report=' + encodeURIComponent(report.id));\n              requestedId = report.id;\n              render();\n            } catch (error) {\n              button.disabled = false;\n              button.textContent = '重新生成报告';\n              CH.toast(error.message || '生成失败。', 'error');\n            }\n          });\n        }\n      }\n\n      function renderReport(report) {\n        var reports = classReports();\n        var totalStudents = Math.max(1, report.studentCount || 1);\n        var top = Array.isArray(report.topErrors) ? report.topErrors.slice(0, 5) : [];\n        while (top.length \u003c 5) {\n          top.push(null);\n        }\n        var errorCards = top.map(function (item, index) {\n          if (!item) {\n            return '\u003cdiv class=\"issue-card\" style=\"opacity:.55;\">\u003cdiv class=\"issue-rank\">\u003cspan>' + (index + 1) + '\u003c/span>\u003cspan>待补充\u003c/span>\u003c/div>\u003ch3 class=\"issue-title\">暂无更多高频问题\u003c/h3>\u003cdiv class=\"issue-count\">—\u003csmall>份作业\u003c/small>\u003c/div>\u003cdiv class=\"issue-bar\">\u003cspan style=\"width:0;\">\u003c/span>\u003c/div>\u003c/div>';\n          }\n          var percent = Math.max(4, Math.min(100, Number(item.percent) || Math.round((Number(item.count) || 0) / totalStudents * 100)));\n          return '\u003cdiv class=\"issue-card\">\u003cdiv class=\"issue-rank\">\u003cspan>' + (index + 1) + '\u003c/span>\u003cspan>' + percent + '% 学生涉及\u003c/span>\u003c/div>\u003ch3 class=\"issue-title\">' + CH.escapeHTML(item.title) + '\u003c/h3>\u003cdiv class=\"issue-count\">' + (Number(item.count) || 0) + '\u003csmall>份作业\u003c/small>\u003c/div>\u003cdiv class=\"issue-bar\">\u003cspan style=\"width:' + percent + '%;\">\u003c/span>\u003c/div>\u003c/div>';\n        }).join('');\n\n        var detailBlocks = report.topErrors && report.topErrors.length ? report.topErrors.map(function (item, index) {\n          var examples = (item.examples || []).map(function (example) {\n            return '\u003cdiv class=\"example-box\">\u003cspan class=\"student-label\">' + CH.escapeHTML(example.studentLabel || '学生 A') + ' · ' + CH.escapeHTML(example.verdict || '错误') + '\u003c/span>\u003cp>' + CH.escapeHTML(example.text || '该题作答未完整识别，建议结合原卷面批。') + '\u003c/p>\u003c/div>';\n          }).join('');\n          return '\u003cdiv style=\"margin-bottom:16px;\">\u003cdiv class=\"timeline-head\" style=\"margin-bottom:7px;\">\u003cstrong>' + (index + 1) + '. ' + CH.escapeHTML(item.title) + '\u003c/strong>\u003cspan class=\"tag tag-amber\">' + (Number(item.count) || 0) + ' 人涉及\u003c/span>\u003c/div>\u003cp class=\"small muted\" style=\"margin:0 0 8px;\">' + CH.escapeHTML(item.description || '') + '\u003c/p>' + (examples || '\u003cdiv class=\"example-box\">\u003cspan class=\"student-label\">匿名示例\u003c/span>\u003cp>该题暂未记录可展示的作答片段，建议结合原卷面批。\u003c/p>\u003c/div>') + '\u003c/div>';\n        }).join('') : '\u003cdiv class=\"empty-state\" style=\"padding:24px;\">\u003cdiv class=\"empty-icon\">✓\u003c/div>\u003ch3>本次没有集中错误\u003c/h3>\u003cp>可以把讲评重点转向方法迁移与规范表达，或安排一道综合变式题。\u003c/p>\u003c/div>';\n\n        var suggestions = (report.suggestions || []).map(function (text) {\n          return '\u003cdiv class=\"suggestion-item\">\u003cstrong>讲评建议\u003c/strong>　' + CH.escapeHTML(text) + '\u003c/div>';\n        }).join('');\n        var picker = reports.length > 1 ? '\u003cdiv class=\"wall-toolbar\">\u003cdiv>\u003cstrong style=\"font-size:13px;\">历史报告\u003c/strong>\u003cp class=\"small muted\" style=\"margin:2px 0 0;\">共 ' + reports.length + ' 份，可切换查看。\u003c/p>\u003c/div>\u003cselect class=\"input filter-select\" id=\"reportPicker\" aria-label=\"切换历史报告\">' + reports.map(function (item) {\n          return '\u003coption value=\"' + encodeURIComponent(item.id) + '\"' + (item.id === report.id ? ' selected' : '') + '>' + CH.escapeHTML(CH.formatDate(item.createdAt, true)) + ' · ' + (item.sampleCount || 0) + ' 份\u003c/option>';\n        }).join('') + '\u003c/select>\u003c/div>' : '';\n\n        area.innerHTML = picker + '\u003csection class=\"card\">\u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>' + CH.escapeHTML(report.className) + ' · 共性分析报告\u003c/h2>\u003cp>生成于 ' + CH.formatDate(report.createdAt, true) + ' · 统计口径：' + CH.escapeHTML(report.engine || 'AI 批改结果聚合') + '\u003c/p>\u003c/div>\u003cspan class=\"tag tag-blue\">教师专用\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"grid grid-3\">\u003cdiv class=\"stat-card\">\u003cstrong>' + (report.sampleCount || 0) + '\u003c/strong>\u003cspan>纳入作业\u003c/span>\u003csmall>同一班级已批改\u003c/small>\u003c/div>\u003cdiv class=\"stat-card\">\u003cstrong>' + (report.studentCount || 0) + '\u003c/strong>\u003cspan>覆盖学生\u003c/span>\u003csmall>已匿名化处理\u003c/small>\u003c/div>\u003cdiv class=\"stat-card\">\u003cstrong>' + (report.topErrors ? report.topErrors.length : 0) + '\u003c/strong>\u003cspan>高频问题\u003c/span>\u003csmall>按涉及人数排序\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"overall-box\" style=\"margin-top:14px;\">\u003cstrong>分析摘要\u003c/strong>' + CH.escapeHTML(report.summary || '') + '\u003c/div>\u003c/div>\u003c/section>' +\n          '\u003csection class=\"section\">\u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>高频错误 Top 5\u003c/h2>\u003cp>按涉及学生人数从高到低排序；百分比为涉及人数占样本学生数的比例。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-gray\">匿名聚合\u003c/span>\u003c/div>\u003cdiv class=\"issue-grid\">' + errorCards + '\u003c/div>\u003c/section>' +\n          '\u003cdiv class=\"grid grid-2\">\u003csection class=\"card\">\u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>典型错误示例（匿名）\u003c/h2>\u003cp>保留学生原始作答片段，用于课堂辨析，不暴露姓名。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"card-body\">' + detailBlocks + '\u003c/div>\u003c/section>\u003csection class=\"card\">\u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>教学补救建议\u003c/h2>\u003cp>建议按“错例展示—方法归纳—变式复测”组织讲评。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"suggestion-list\">' + (suggestions || '\u003cdiv class=\"suggestion-item\">\u003cstrong>讲评建议\u003c/strong>　先展示典型错例，引导学生归纳判断依据，再用 2 道同类变式题即时复测。\u003c/div>') + '\u003c/div>\u003cdiv class=\"alert alert-warning\" style=\"margin-top:14px;\">\u003cspan class=\"alert-icon\">!\u003c/span>\u003cdiv>\u003cstrong>复核提醒：\u003c/strong>AI 归因可能与真实错因存在偏差，讲评前请抽查原卷；涉及手写识别存疑的题目，以教师核对为准。\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003c/div>' +\n          '\u003cdiv class=\"form-actions\">\u003ca class=\"btn btn-primary\" href=\"teacher-homework.html\">继续批改作业\u003c/a>\u003ca class=\"btn btn-secondary\" href=\"student-profile.html\">查看学生档案\u003c/a>\u003cbutton class=\"btn btn-ghost\" type=\"button\" id=\"printReport2\">打印本报告\u003c/button>\u003c/div>';\n\n        var pickerNode = document.getElementById('reportPicker');\n        if (pickerNode) {\n          pickerNode.addEventListener('change', function () {\n            window.__chemhubNav('common-issues.html?report=' + pickerNode.value);\n          });\n        }\n        var print2 = document.getElementById('printReport2');\n        if (print2) print2.addEventListener('click', function () { window.print(); });\n      }\n\n      function render() {\n        var report = pickReport();\n        if (!report) {\n          renderNoReport();\n          return;\n        }\n        renderReport(report);\n        document.title = report.className + ' · 共性分析 · 知行化学';\n      }\n\n      document.getElementById('printReport').addEventListener('click', function () { window.print(); });\n      render();\n    })();\n  "},"excellent-answers.html":{"page":"excellent-answers.html","title":"优秀答案墙 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003cdiv class=\"page-head\">\n      \u003cdiv>\n        \u003cnav class=\"breadcrumbs\" aria-label=\"面包屑\">\u003ca id=\"backDashboard\" href=\"teacher-dashboard.html\">工作台\u003c/a>\u003cspan>/\u003c/span>\u003cspan>优秀答案墙\u003c/span>\u003c/nav>\n        \u003ch1>优秀答案墙\u003c/h1>\n        \u003cp id=\"pageLead\">教师从批改结果中挑选思路清晰、表达规范的作答，匿名展示在这里。所有姓名与学号均已隐藏，只保留题目、作答和教师评语。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"page-head-actions\">\n        \u003ca class=\"btn btn-primary btn-sm\" id=\"homeworkLink\" href=\"teacher-homework.html\">去批改作业\u003c/a>\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"common-issues.html\" id=\"issuesLink\">班级共性分析\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003csection class=\"section\" id=\"wallSection\">\n      \u003cdiv class=\"card\">\u003cdiv class=\"card-body\">\u003cp class=\"small muted\" style=\"margin:0;\">正在读取优秀答案。\u003c/p>\u003c/div>\u003c/div>\n    \u003c/section>\n\n    \u003cdiv id=\"hiddenSection\">\u003c/div>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-info\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>匿名与隐私：\u003c/strong>优秀答案墙不显示学生姓名、学号或头像，仅用于同伴互学。若涉及手写原图或真实作业，请先取得学生及监护人授权并做脱敏处理；教师可随时取消展示。\u003c/div>\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ active: 'excellent', title: '优秀答案墙 · 知行化学' });\n      if (!user) return;\n      var isTeacher = user.role === 'teacher';\n      var className = user.className || CH.DEMO_CLASS;\n      var wallSection = document.getElementById('wallSection');\n      var hiddenSection = document.getElementById('hiddenSection');\n      var backDashboard = document.getElementById('backDashboard');\n      var homeworkLink = document.getElementById('homeworkLink');\n      var issuesLink = document.getElementById('issuesLink');\n      var state = { batch: 'all' };\n\n      backDashboard.href = isTeacher ? 'teacher-dashboard.html' : 'student-dashboard.html';\n      backDashboard.textContent = isTeacher ? '教师工作台' : '学生工作台';\n      homeworkLink.href = isTeacher ? 'teacher-homework.html' : 'student-homework.html';\n      homeworkLink.textContent = isTeacher ? '去批改作业' : '去提交作业';\n      if (!isTeacher) issuesLink.style.display = 'none';\n      document.getElementById('pageLead').textContent = isTeacher\n        ? '你从批改结果中挑选的优秀作答会匿名展示在这里。可取消展示，也可以重新展示已隐藏的答案。'\n        : '这里匿名展示教师挑选的优秀作答与评语。所有姓名与学号均已隐藏，可对照自己的答案学习表达规范。';\n\n      function enrich(item) {\n        var submission = CH.getSubmissionById(item.submissionId);\n        if (!submission) return null;\n        if (submission.className !== className) return null;\n        var batch = CH.getBatch(item.batchId || submission.batchId);\n        return {\n          item: item,\n          submission: submission,\n          batchName: batch ? batch.name : (submission.batchName || '化学作业'),\n          unit: batch ? batch.unit : (submission.unit || '')\n        };\n      }\n\n      function activeEntries() {\n        return CH.getActiveExcellent().map(enrich).filter(Boolean).sort(function (a, b) {\n          return new Date(b.item.createdAt) - new Date(a.item.createdAt);\n        });\n      }\n\n      function hiddenEntries() {\n        if (!isTeacher) return [];\n        return CH.getExcellent().filter(function (item) { return !item.active; }).map(enrich).filter(Boolean).sort(function (a, b) {\n          return new Date(b.item.updatedAt || b.item.createdAt) - new Date(a.item.updatedAt || a.item.createdAt);\n        });\n      }\n\n      function cardHTML(entry, hidden) {\n        var item = entry.item;\n        var answer = String(item.answer || '（该题作答未被记录，请查看原始批改结果。）');\n        var question = String(item.question || '化学作业题目');\n        return '\u003carticle class=\"excellent-card\">\u003cp class=\"quote\">班级优秀答案 · 第 ' + CH.escapeHTML(String(item.questionNo)) + ' 题' + (hidden ? ' · 已隐藏' : '') + '\u003c/p>\u003ch3>' + CH.escapeHTML(question) + '\u003c/h3>\u003cp class=\"answer\">' + CH.escapeHTML(answer) + '\u003c/p>\u003cdiv class=\"teacher-comment\">\u003cstrong>教师评语：\u003c/strong>' + CH.escapeHTML(item.comment || '思路清晰、表达规范，可作为班级范例。') + '\u003c/div>\u003cdiv class=\"card-bottom\">\u003cspan>匿名学生 · ' + CH.escapeHTML(entry.batchName) + ' · ' + CH.formatDate(item.createdAt) + '\u003c/span>' + (isTeacher ? (hidden ? '\u003cbutton class=\"btn btn-ghost btn-sm\" type=\"button\" data-show=\"' + CH.escapeHTML(item.id) + '\">重新展示\u003c/button>' : '\u003cbutton class=\"btn btn-soft-danger btn-sm\" type=\"button\" data-hide=\"' + CH.escapeHTML(item.id) + '\">取消展示\u003c/button>') : '\u003cspan>匿名展示\u003c/span>') + '\u003c/div>\u003c/article>';\n      }\n\n      function render() {\n        var all = activeEntries();\n        var batches = {};\n        all.forEach(function (entry) { batches[entry.item.batchId || entry.submission.batchId] = entry.batchName; });\n        var filtered = all.filter(function (entry) { return state.batch === 'all' || (entry.item.batchId || entry.submission.batchId) === state.batch; });\n\n        var filter = all.length ? '\u003cdiv class=\"wall-toolbar\">\u003cdiv>\u003cstrong style=\"font-size:13px;\">共 ' + all.length + ' 条匿名优秀答案\u003c/strong>\u003cp class=\"small muted\" style=\"margin:2px 0 0;\">按教师标记时间倒序展示，可筛选作业批次。\u003c/p>\u003c/div>\u003cselect class=\"input filter-select\" id=\"batchFilter\" aria-label=\"按作业批次筛选\">\u003coption value=\"all\">全部作业批次\u003c/option>' + Object.keys(batches).map(function (key) {\n          return '\u003coption value=\"' + CH.escapeHTML(key) + '\"' + (state.batch === key ? ' selected' : '') + '>' + CH.escapeHTML(batches[key]) + '\u003c/option>';\n        }).join('') + '\u003c/select>\u003c/div>' : '';\n\n        var content;\n        if (!all.length) {\n          content = '\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">★\u003c/div>\u003ch3>优秀答案墙还是空的\u003c/h3>\u003cp>' + (isTeacher ? '在批改结果中勾选“标记为优秀答案”，被选中的作答就会匿名展示在这里。' : '教师尚未展示优秀答案。可以先去完成自己的作业，或在优秀答案墙稍后再来看看。') + '\u003c/p>\u003ca class=\"btn btn-primary btn-sm\" href=\"' + (isTeacher ? 'teacher-homework.html' : 'student-homework.html') + '\">' + (isTeacher ? '去批改并标记' : '去我的作业') + '\u003c/a>\u003c/div>';\n        } else if (!filtered.length) {\n          content = '\u003cdiv class=\"empty-state\">\u003cdiv class=\"empty-icon\">⌕\u003c/div>\u003ch3>该批次暂无展示\u003c/h3>\u003cp>换一个作业批次，或点击“全部作业批次”查看所有优秀答案。\u003c/p>\u003c/div>';\n        } else {\n          content = '\u003cdiv class=\"wall-grid\">' + filtered.map(function (entry) { return cardHTML(entry, false); }).join('') + '\u003c/div>';\n        }\n        wallSection.innerHTML = '\u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>匿名优秀答案\u003c/h2>\u003cp>只展示教师确认过的作答；点击“取消展示”可立即从墙上移除。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-green\">同伴互学\u003c/span>\u003c/div>' + (filter ? filter : '') + content;\n\n        var filterNode = document.getElementById('batchFilter');\n        if (filterNode) {\n          filterNode.addEventListener('change', function () {\n            state.batch = filterNode.value;\n            render();\n          });\n        }\n\n        var hidden = hiddenEntries();\n        if (isTeacher && hidden.length) {\n          hiddenSection.innerHTML = '\u003csection class=\"section\">\u003cdetails class=\"card\">\u003csummary class=\"card-header\" style=\"cursor:pointer;\">\u003cdiv>\u003ch2>已隐藏的答案（' + hidden.length + '）\u003c/h2>\u003cp>仅教师可见。重新展示后会立即出现在上方答案墙。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-gray\">教师管理\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cdiv class=\"wall-grid\">' + hidden.map(function (entry) { return cardHTML(entry, true); }).join('') + '\u003c/div>\u003c/div>\u003c/details>\u003c/section>';\n        } else {\n          hiddenSection.innerHTML = '';\n        }\n      }\n\n      wallSection.addEventListener('click', function (event) {\n        var hideButton = event.target.closest('[data-hide]');\n        var showButton = event.target.closest('[data-show]');\n        if (hideButton) {\n          var hideId = hideButton.getAttribute('data-hide');\n          CH.confirmAction({\n            title: '取消展示这条优秀答案？',\n            subtitle: '学生端将不再看到这条内容',\n            message: '取消后仍保留在教师端的“已隐藏”列表中，可随时重新展示。',\n            confirmText: '取消展示',\n            danger: true\n          }).then(function (ok) {\n            if (!ok) return;\n            CH.setExcellentActive(hideId, false);\n            CH.toast('已取消展示，可在“已隐藏的答案”中恢复。', 'success');\n            render();\n          });\n        }\n        if (showButton) {\n          CH.setExcellentActive(showButton.getAttribute('data-show'), true);\n          CH.toast('已重新展示到优秀答案墙。', 'success');\n          render();\n        }\n      });\n\n      hiddenSection.addEventListener('click', function (event) {\n        var showButton = event.target.closest('[data-show]');\n        if (!showButton) return;\n        CH.setExcellentActive(showButton.getAttribute('data-show'), true);\n        CH.toast('已重新展示到优秀答案墙。', 'success');\n        render();\n      });\n\n      render();\n    })();\n  "},"teaching-design.html":{"page":"teaching-design.html","title":"教学设计 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003csection class=\"placeholder-hero\" data-number=\"01\">\n      \u003cspan class=\"eyebrow\">模块占位 · 演示版\u003c/span>\n      \u003ch1>教学设计\u003c/h1>\n      \u003cp>面向高中化学单元教学，提供 AI 辅助的教学设计工作区。当前版本聚焦“作业与评价”，本模块先用占位卡片呈现规划中的能力。后续可接入学情数据，自动生成大单元目标、分层任务与实验安全预案。\u003c/p>\n      \u003cdiv class=\"form-actions\">\n        \u003ca class=\"btn btn-primary\" href=\"teacher-homework.html\" id=\"homeworkCta\">先体验作业与评价\u003c/a>\n        \u003ca class=\"btn btn-ghost\" href=\"teacher-dashboard.html\" id=\"dashboardCta\">返回工作台\u003c/a>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>规划中的能力\u003c/h2>\u003cp>以下卡片为演示占位，用于说明后续迭代方向，当前版本尚未接入真实功能。\u003c/p>\u003c/div>\n        \u003cspan class=\"tag tag-amber\">模块占位 · 演示版\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"coming-grid\">\n        \u003carticle class=\"coming-card\">\u003cdiv class=\"coming-icon\">✎\u003c/div>\u003ch3>大单元教学设计生成\u003c/h3>\u003cp>根据课标、教材章节与课时数，生成单元目标、课时分配和评价任务，教师可逐条修改。\u003c/p>\u003cspan class=\"coming-status\">即将上线\u003c/span>\u003c/article>\n        \u003carticle class=\"coming-card\">\u003cdiv class=\"coming-icon\">◫\u003c/div>\u003ch3>学情前测与目标分层\u003c/h3>\u003cp>用 5—8 道前测题定位学生起点，自动给出基础、提升、拓展三层学习目标。\u003c/p>\u003cspan class=\"coming-status\">规划中\u003c/span>\u003c/article>\n        \u003carticle class=\"coming-card\">\u003cdiv class=\"coming-icon\">⚗\u003c/div>\u003ch3>化学实验安全预案\u003c/h3>\u003cp>针对钠、氯气、浓硫酸等典型实验，生成风险清单、防护措施与异常处置流程。\u003c/p>\u003cspan class=\"coming-status\">演示占位\u003c/span>\u003c/article>\n        \u003carticle class=\"coming-card\">\u003cdiv class=\"coming-icon\">▤\u003c/div>\u003ch3>板书与课件脚本\u003c/h3>\u003cp>把教学流程转成板书结构、提问链和课件分页脚本，减少重复排版时间。\u003c/p>\u003cspan class=\"coming-status\">即将上线\u003c/span>\u003c/article>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-info\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>版本说明：\u003c/strong>本平台当前完整实现“作业与评价”模块，包括多模态批改、逐题解析、学生档案、班级共性分析与优秀答案墙。教学设计模块保留导航入口与需求卡片，便于后续按同一数据结构继续开发。\u003c/div>\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ active: 'design', title: '教学设计 · 知行化学' });\n      if (!user) return;\n      var isTeacher = user.role === 'teacher';\n      document.getElementById('homeworkCta').href = isTeacher ? 'teacher-homework.html' : 'student-homework.html';\n      document.getElementById('dashboardCta').href = isTeacher ? 'teacher-dashboard.html' : 'student-dashboard.html';\n    })();\n  "},"classroom-teaching.html":{"page":"classroom-teaching.html","title":"课堂教学 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003csection class=\"placeholder-hero\" data-number=\"02\">\n      \u003cspan class=\"eyebrow\">模块入口 · 实验仿真已上线\u003c/span>\n      \u003ch1>课堂教学\u003c/h1>\n      \u003cp>把 AI 与交互仿真带进化学课堂。本模块现已接入“高中化学实验仿真实验室”，覆盖 7 个高中必做实验；课堂即时问答、微观动画讲解与课堂数据看板仍在规划中。\u003c/p>\n      \u003cdiv class=\"form-actions\">\n        \u003ca class=\"btn btn-primary\" href=\"virtual-lab.html\" id=\"labCta\">进入实验仿真实验室\u003c/a>\n        \u003ca class=\"btn btn-secondary\" href=\"teacher-homework.html\" id=\"homeworkCta\">先体验作业与评价\u003c/a>\n        \u003ca class=\"btn btn-ghost\" href=\"teacher-dashboard.html\" id=\"dashboardCta\">返回工作台\u003c/a>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>已上线：高中化学实验仿真实验室\u003c/h2>\u003cp>由课堂演示走向可操作探究：选择实验、检查安全条件、启动反应，观察装置现象与微观粒子变化。\u003c/p>\u003c/div>\n        \u003cspan class=\"tag tag-green\">已上线 · 可交互\u003c/span>\n      \u003c/div>\n      \u003carticle class=\"lab-entry\">\n        \u003cdiv class=\"lab-visual\" aria-hidden=\"true\">\n          \u003cspan class=\"lab-chip chip-a\">实时仿真\u003c/span>\n          \u003cspan class=\"lab-chip chip-b\">安全防呆\u003c/span>\n          \u003cspan class=\"lab-chip chip-c\">微观粒子\u003c/span>\n          \u003cdiv class=\"lab-flask\">⚗\u003c/div>\n          \u003cdiv class=\"lab-visual-note\">\u003cb>7\u003c/b>\u003cspan>个必做实验\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"lab-copy\">\n          \u003cspan class=\"eyebrow\">RENJIAO · INTERACTIVE LAB\u003c/span>\n          \u003ch3>把实验装置、现象与安全操作，放进一块屏幕\u003c/h3>\n          \u003cp>7 个高中化学必做实验，覆盖氯气制备、浓硫酸与铜、钠与水、铝热反应、铁与水蒸气、铜与硝酸、氢气还原氧化铜。每个实验都有实时装置、微观粒子窗、操作步骤与安全警报，适合课堂大屏演示，也适合学生自主探究。\u003c/p>\n          \u003cdiv class=\"lab-facts\">\u003cspan>\u003cb>7\u003c/b> 个必做实验\u003c/span>\u003cspan>实时装置 + 微观动画\u003c/span>\u003cspan>安全操作防呆\u003c/span>\u003c/div>\n          \u003cdiv class=\"lab-tags\">\n            \u003cspan>实验室制取氯气\u003c/span>\u003cspan>浓硫酸与铜\u003c/span>\u003cspan>钠与水\u003c/span>\u003cspan>铝热反应\u003c/span>\u003cspan>铁与水蒸气\u003c/span>\u003cspan>铜与浓、稀硝酸\u003c/span>\u003cspan>氢气还原氧化铜\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"form-actions\">\n            \u003ca class=\"btn btn-primary\" href=\"virtual-lab.html\">打开实验仿真实验室\u003c/a>\n            \u003cspan class=\"lab-note\">电脑 / 平板 / 手机均可使用；无需安装插件。实验页面由同学提供，已整合鉴权与返回入口。\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/article>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"section-head\">\n        \u003cdiv>\u003ch2>继续建设的能力\u003c/h2>\u003cp>实验仿真已上线；以下能力仍在规划中，用于说明课堂教学模块的后续迭代方向。\u003c/p>\u003c/div>\n        \u003cspan class=\"tag tag-amber\">部分上线 · 演示版\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"coming-grid\">\n        \u003carticle class=\"coming-card\">\u003cdiv class=\"coming-icon\">◉\u003c/div>\u003ch3>课堂即时问答\u003c/h3>\u003cp>教师抛出一个化学问题，学生用手机提交关键词，系统即时聚类并投屏典型答案。\u003c/p>\u003cspan class=\"coming-status\">即将上线\u003c/span>\u003c/article>\n        \u003carticle class=\"coming-card\">\u003cdiv class=\"coming-icon\">⚛\u003c/div>\u003ch3>微观过程动画讲解\u003c/h3>\u003cp>把离子反应、电子转移等抽象过程转成可暂停的分步动画，辅助学生建立微观表征。\u003c/p>\u003cspan class=\"coming-status\">规划中\u003c/span>\u003c/article>\n        \u003carticle class=\"coming-card\">\u003cdiv class=\"coming-icon\">▤\u003c/div>\u003ch3>实验报告与复盘\u003c/h3>\u003cp>把仿真中的操作步骤、现象观察与安全判断整理成课堂复盘单，支持学生课后回看。\u003c/p>\u003cspan class=\"coming-status\">即将上线\u003c/span>\u003c/article>\n        \u003carticle class=\"coming-card\">\u003cdiv class=\"coming-icon\">▦\u003c/div>\u003ch3>课堂数据看板\u003c/h3>\u003cp>汇总当堂练习的正确率与典型错误，帮助教师决定是否进入下一环节。\u003c/p>\u003cspan class=\"coming-status\">即将上线\u003c/span>\u003c/article>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-info\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>版本说明：\u003c/strong>本平台当前完整实现“作业与评价”模块，并已接入“课堂教学”的实验仿真实验室；其余课堂教学能力保留需求卡片，便于后续按同一数据结构继续开发。\u003c/div>\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ active: 'classroom', title: '课堂教学 · 知行化学' });\n      if (!user) return;\n      var isTeacher = user.role === 'teacher';\n      document.getElementById('homeworkCta').href = isTeacher ? 'teacher-homework.html' : 'student-homework.html';\n      document.getElementById('dashboardCta').href = isTeacher ? 'teacher-dashboard.html' : 'student-dashboard.html';\n    })();\n  "},"virtual-lab.html":{"page":"virtual-lab.html","title":"高中化学实验仿真实验室 · 知行化学","bodyClass":"","body":"\n\n\n\u003cheader class=\"topbar\">\n  \u003cdiv class=\"top-brand\">\n    \u003cdiv class=\"top-logo\" aria-hidden=\"true\">\n      \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n        \u003cpath d=\"M9 3h6\"/>\u003cpath d=\"M10 3v5.2L4.9 18a2 2 0 0 0 1.8 3h10.6a2 2 0 0 0 1.8-3L14 8.2V3\"/>\n        \u003cpath d=\"M7.5 15h9\"/>\u003ccircle cx=\"10.5\" cy=\"18\" r=\".9\" fill=\"currentColor\" stroke=\"none\"/>\n      \u003c/svg>\n    \u003c/div>\n    \u003cdiv>\u003cstrong>高中化学实验仿真实验室\u003c/strong>\u003csmall>RENJIAO · INTERACTIVE LAB\u003c/small>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"top-current\">\u003cspan class=\"chapter\" id=\"topChapter\">人教版\u003c/span>\u003cb id=\"topTitle\">实验目录\u003c/b>\u003c/div>\n  \u003cdiv class=\"top-actions\">\n    \u003ca class=\"top-btn lab-back\" href=\"classroom-teaching.html\" aria-label=\"返回课堂教学\" title=\"返回课堂教学\">←\u003cspan>返回\u003c/span>\u003c/a>\n    \u003cbutton class=\"top-btn primary\" id=\"btnCatalog\" type=\"button\">\n      \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003c/svg>\n      \u003cspan>实验目录\u003c/span>\n    \u003c/button>\n    \u003cbutton class=\"top-btn\" id=\"btnTopReset\" type=\"button\">\n      \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 4v6h6\"/>\u003cpath d=\"M4.6 13.2A8 8 0 1 0 6.9 6.2L4 10\"/>\u003c/svg>\n      \u003cspan>重置\u003c/span>\n    \u003c/button>\n  \u003c/div>\n\u003c/header>\n\n\u003cdiv class=\"workspace\">\n  \u003caside class=\"panel\">\n    \u003cdiv class=\"exp-head\">\n      \u003cspan class=\"exp-chapter\" id=\"expChapter\">人教版\u003c/span>\n      \u003ch1 id=\"expTitle\">正在载入实验…\u003c/h1>\n      \u003cp id=\"expSub\">\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"safety-strip\">\u003cspan class=\"ico\">⚠\u003c/span>\u003cp id=\"safetyText\">请选择实验。\u003c/p>\u003c/div>\n    \u003cdiv class=\"section-label\">\u003cspan>实验操作台\u003c/span>\u003cspan>点击切换\u003c/span>\u003c/div>\n    \u003cdiv id=\"controls\">\u003c/div>\n    \u003cdiv id=\"auxRow\">\u003c/div>\n    \u003cbutton class=\"reset-btn\" id=\"btnResetPanel\" type=\"button\">\n      \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 4v6h6\"/>\u003cpath d=\"M4.6 13.2A8 8 0 1 0 6.9 6.2L4 10\"/>\u003c/svg>\n      重置当前实验\n    \u003c/button>\n    \u003cdiv class=\"meters\">\n      \u003cdiv class=\"meter\">\n        \u003cdiv class=\"meter-head\">\u003cspan id=\"progressLabel\">实验进度\u003c/span>\u003cb id=\"progressText\">0%\u003c/b>\u003c/div>\n        \u003cdiv class=\"track\">\u003ci id=\"progressFill\">\u003c/i>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"mini-meters\" id=\"miniMeters\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"status-card\" id=\"statusCard\" data-tone=\"info\" role=\"status\" aria-live=\"polite\">\n      \u003cdiv class=\"status-kicker\">\u003cspan class=\"dot\">\u003c/span>\u003cspan id=\"statusKicker\">操作提示\u003c/span>\u003c/div>\n      \u003ch2 id=\"statusTitle\">准备就绪\u003c/h2>\n      \u003cp id=\"statusDesc\">从实验目录中选择一个实验。\u003c/p>\n      \u003cdiv class=\"status-eq\" id=\"statusEq\">—\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"steps\">\n      \u003cdiv class=\"steps-title\">\u003cspan>规范流程\u003c/span>\u003cspan id=\"stepsHint\">安全操作\u003c/span>\u003c/div>\n      \u003col id=\"stepList\">\u003c/ol>\n    \u003c/div>\n    \u003cp class=\"panel-note\">教学仿真演示，不替代真实实验。真实操作须在通风良好处、由教师指导完成。\u003c/p>\n  \u003c/aside>\n\n  \u003cmain class=\"stage\">\n    \u003csection class=\"scene-card\" aria-label=\"实验装置动态示意图\">\n      \u003ccanvas id=\"scene\">\u003c/canvas>\n      \u003cdiv class=\"scene-tag\">\u003cspan class=\"live\">\u003c/span>\u003cspan id=\"sceneTag\">实时仿真 · 实验装置\u003c/span>\u003c/div>\n      \u003cdiv class=\"leak-badge\" id=\"leakBadge\">\n        \u003cdiv class=\"leak-orb\" id=\"leakOrb\">CO\u003c/div>\n        \u003cdiv>\u003cstrong id=\"leakTitle\">有毒气体逸散\u003c/strong>\u003csmall id=\"leakSub\">请立即处理尾气\u003c/small>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"micro-card\" aria-label=\"微观粒子反应动画\">\n      \u003cdiv class=\"micro-head\">\n        \u003cdiv class=\"micro-title\">\n          \u003cspan class=\"dot\" id=\"microDot\">\u003c/span>\n          \u003cspan>微观粒子反应窗\u003c/span>\n          \u003cspan class=\"micro-state\" id=\"microState\">静止\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"micro-legend\" id=\"microLegend\">\u003c/div>\n      \u003c/div>\n      \u003ccanvas id=\"micro\">\u003c/canvas>\n    \u003c/section>\n  \u003c/main>\n\u003c/div>\n\n\u003cdiv class=\"catalog\" id=\"catalog\" aria-label=\"实验目录\">\n  \u003cdiv class=\"catalog-shell\">\n    \u003cdiv class=\"catalog-head\">\n      \u003cdiv>\n        \u003cdiv class=\"catalog-kicker\">RENJIAO CHEMISTRY · INTERACTIVE LAB\u003c/div>\n        \u003ch2>选择一个实验，开始探究\u003c/h2>\n        \u003cp>7 个高中化学必做实验的交互式仿真。点击卡片进入实验；所有装置、现象与安全操作均在同一个页面内完成。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"catalog-actions\">\n        \u003ca class=\"top-btn lab-back\" href=\"classroom-teaching.html\" aria-label=\"返回课堂教学\" title=\"返回课堂教学\">←\u003cspan>返回课堂\u003c/span>\u003c/a>\n        \u003cspan class=\"catalog-count\" id=\"catalogCount\">7 个实验\u003c/span>\n        \u003cbutton class=\"top-btn primary\" id=\"catalogClose\" type=\"button\">继续当前实验\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"catalog-grid\" id=\"catalogGrid\">\u003c/div>\n    \u003cdiv class=\"catalog-foot\">统一采用“先检查安全条件，再启动反应”的防呆逻辑。真实实验请在教师指导下进行。\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"modal\" id=\"alertModal\" role=\"alertdialog\" aria-modal=\"true\" aria-labelledby=\"alertTitle\">\n  \u003cdiv class=\"modal-card\">\n    \u003cdiv class=\"alert-flag\">\u003cspan class=\"blink\">\u003c/span>安全警报 · 实验事故\u003c/div>\n    \u003ch2 id=\"alertTitle\">操作危险\u003c/h2>\n    \u003cp class=\"modal-lead\" id=\"alertText\">\u003c/p>\n    \u003cp class=\"modal-rule\" id=\"alertRule\">\u003c/p>\n    \u003cdiv class=\"principle\">\n      \u003cdiv class=\"principle-title\">化学原理\u003c/div>\n      \u003cdiv class=\"principle-eq\" id=\"alertEq\">—\u003c/div>\n      \u003cp id=\"alertNote\">\u003c/p>\n    \u003c/div>\n    \u003cbutton id=\"btnResetModal\" type=\"button\">重置实验 · 重新操作\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"toast\" role=\"status\" aria-live=\"polite\">\u003cspan class=\"t-ico\" id=\"toastIcon\">●\u003c/span>\u003cspan id=\"toastMsg\">\u003c/span>\u003c/div>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n","style":"\n  :root{\n    --bg:#060b14;--panel:#0b1626;--panel2:#0f1e33;--line:#1d3049;--line-soft:#17283e;\n    --text:#e8f1ff;--muted:#8ba3c1;--muted2:#657d9b;\n    --accent:#3ddbd0;--amber:#ffb454;--orange:#ff7a3c;--red:#ff5d6e;--green:#4ade80;--blue:#6fb3ff;\n    --font:\"Microsoft YaHei\",\"PingFang SC\",\"Hiragino Sans GB\",\"Noto Sans SC\",system-ui,-apple-system,sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{height:100%;}\n  body{\n    margin:0;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;\n    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;\n  }\n  body::before{\n    content:\"\";position:fixed;inset:0;pointer-events:none;z-index:0;\n    background:\n      radial-gradient(900px 600px at 72% 4%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 64%),\n      radial-gradient(700px 500px at 8% 96%,rgba(255,140,60,.045),transparent 70%);\n    transition:background .3s;\n  }\n  .topbar{\n    height:56px;position:relative;z-index:20;display:flex;align-items:center;gap:14px;\n    padding:0 16px;border-bottom:1px solid #182b42;\n    background:linear-gr order:1px solid rgba(255,93,110,.7);background:linear-gradient(160deg,#1e0c15,#120912 56%,#170d0f);\n    box-shadow:0 0 0 1px rgba(255,93,110,.1),0 30px 84px rgba(0,0,0,.66),0 0 80px rgba(255,50,75,.18);\n    transform:translateY(14px) scale(.97);opacity:0;\n  }\n  .modal.show .modal-card{animation:alertIn .32s cubic-bezier(.2,.8,.2,1) forwards;}\n  .alert-flag{\n    display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;\n    font-size:8.8px;font-weight:700;letter-spacing:1.8px;color:#ff9ba7;\n    border:1px solid rgba(255,93,110,.38);background:rgba(255,50,70,.1);\n  }\n  .alert-flag .blink{width:5px;height:5px;border-radius:50%;background:#ff5d6e;box-shadow:0 0 8px #ff5d6e;animation:pulse .85s infinite;}\n  .modal h2{margin:9px 0 6px;font-size:22px;line-height:1.25;color:#ffe4e8;letter-spacing:.4px;}\n  .modal-lead{margin:0 0 10px;font-size:11.5px;line-height:1.65;color:#d9afb7;}\n  .modal-rule{\n    margin:0 0 11px;padding:7px 10px;border-left:3px solid #ff5d6e;border-radius:0 7px 7px 0;\n    background:rgba(255,60,80,.08);font-size:11px;line-height:1.55;color:#ffc8cf;font-weight:650;\n  }\n  .principle{border-radius:10px;border:1px solid rgba(255,93,110,.24);background:rgba(255,50,70,.055);padding:9px 11px;}\n  .principle-title{font-size:8.8px;letter-spacing:1.7px;color:#ff8a98;}\n  .principle-eq{font-family:\"Cambria Math\",Georgia,serif;font-size:18px;color:#ffd9de;margin:4px 0 2px;letter-spacing:.3px;}\n  .principle p{margin:0;font-size:10px;line-height:1.55;color:#c89ba4;}\n  #btnResetModal{\n    width:100%;margin-top:12px;padding:10px;border-radius:9px;border:1px solid rgba(255,120,135,.46);cursor:pointer;\n    background:linear-gradient(135deg,#c22b40,#871426);color:#fff;font-family:inherit;font-size:11.5px;\n    font-weight:700;letter-spacing:1px;box-shadow:0 10px 24px rgba(180,20,40,.26);transition:.15s;\n  }\n  #btnResetModal:hover{filter:brightness(1.1);transform:translateY(-1px);}\n  #toast{\n    position:fixed;left:50%;bottom:16px;z-index:200;display:flex;align-items:center;gap:8px;\n    max-width:min(720px,92vw);padding:8px 14px;border-radius:999px;\n    background:rgba(9,20,34,.96);border:1px solid #2a4767;color:#dce9f8;font-size:10.8px;line-height:1.4;\n    box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:.2s;\n  }\n  #toast.show{opacity:1;transform:translate(-50%,0);}\n  #toast[data-type=\"warn\"]{border-color:rgba(255,180,84,.62);color:#ffe3b8;}\n  #toast[data-type=\"danger\"]{border-color:rgba(255,93,110,.68);color:#ffd7dc;}\n  #toast[data-type=\"success\"]{border-color:rgba(74,222,128,.55);color:#cbffe4;}\n  #toast .t-ico{flex:0 0 auto;font-size:12px;}\n\n  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}\n  @keyframes leakPulse{0%,100%{box-shadow:0 0 20px var(--leak-glow);}50%{box-shadow:0 0 34px var(--leak-glow);}}\n  @keyframes alertIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}\n\n  @media (max-height:860px){\n    .panel{gap:6px;padding:9px 11px 8px;}\n    .exp-head h1{font-size:16.5px;margin:5px 0 2px;}\n    .exp-head p{font-size:9.6px;}\n    .safety-strip{padding:6px 8px;}\n    .safety-strip p{font-size:9.2px;}\n    .ctl{padding:6px 9px;grid-template-columns:33px 1fr 8px;gap:8px;}\n    .ctl-ico{width:33px;height:33px;}\n    .ctl-ico svg{width:18px;height:18px;}\n    .ctl-copy strong{font-size:11.6px;}\n    .ctl-copy small{font-size:8.8px;}\n    .aux-btn{padding:4px 7px;font-size:8.6px;}\n    .meters{padding:6px 8px;gap:6px;}\n    .status-card{padding:7px 8px 7px 11px;}\n    .status-card h2{font-size:11.6px;margin:4px 0 2px;}\n    .status-card p{font-size:9.1px;}\n    .status-eq{font-size:9.8px;padding:3px 6px;}\n    .steps{display:none;}\n    .panel-note{display:none;}\n    .micro-card{height:clamp(220px,27vh,270px);}\n    .stage{padding:9px 11px;gap:8px;}\n  }\n  @media (max-width:1200px){.panel{width:348px;flex-basis:348px;}}\n  @media (max-width:980px){\n    body{overflow:auto;}\n    .workspace{height:auto;flex-direction:column;}\n    .panel{width:100%;flex:none;overflow:visible;border-right:none;border-bottom:1px solid var(--line);}\n    .stage{padding:11px;min-height:0;}\n    .scene-card{flex:none;height:56vw;min-height:330px;}\n    .micro-card{height:250px;}\n    .top-current{display:none;}\n    .top-brand small{display:none;}\n    .catalog{padding:16px;}\n    .catalog-head h2{font-size:22px;}\n  }\n  @media (max-width:600px){\n    .topbar{padding:0 10px;gap:8px;}\n    .top-brand strong{font-size:12px;}\n    .top-btn{padding:0 8px;font-size:9px;}\n    .top-btn span{display:none;}\n    .scene-card{height:68vw;min-height:270px;}\n    .micro-card{height:225px;}\n    .catalog-grid{grid-template-columns:1fr;}\n  }\n  a.top-btn{text-decoration:none;}\n  .lab-back{font-weight:600;}\n","script":"\n(function () {\n  'use strict';\n  var CH = window.ChemHub;\n  var user = CH && CH.getCurrentUser ? CH.getCurrentUser() : null;\n  if (!user) { window.__chemhubReplace('index.html?reason=auth'); }\n})();\n\n;\n\n/* ======================================================================\n   核心框架：目录、共享 UI、Canvas 调度、通用绘图书签\n   ====================================================================== */\n(function () {\n  \"use strict\";\n\n  const $ = (id) => document.getElementById(id);\n  const CL = window.CL = { experiments: [] };\n  const CN = '\"Microsoft YaHei\",\"PingFang SC\",\"Noto Sans SC\",sans-serif';\n  const TAU = Math.PI * 2;\n  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n  const lerp = (a, b, t) => a + (b - a) * t;\n  const rand = (a, b) => a + Math.random() * (b - a);\n\n  CL.VW = 1200; CL.VH = 560; CL.MW = 1200; CL.MH = 380;\n  CL.clamp = clamp; CL.lerp = lerp; CL.rand = rand; CL.TAU = TAU; CL.CN = CN;\n\n  /* ---------------- 通用绘图 ---------------- */\n  function rr(ctx, x, y, w, h, r) {\n    const radius = Math.min(r, w / 2, h / 2);\n    ctx.beginPath();\n    ctx.moveTo(x + radius, y);\n    ctx.lineTo(x + w - radius, y);\n    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);\n    ctx.lineTo(x + w, y + h - radius);\n    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);\n    ctx.lineTo(x + radius, y + h);\n    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);\n    ctx.lineTo(x, y + radius);\n    ctx.quadraticCurveTo(x, y, x + radius, y);\n    ctx.closePath();\n  }\n  CL.rr = rr;\n\n  function mix(a, b, t) {\n    const k = clamp(t, 0, 1);\n    return [Math.round(lerp(a[0], b[0], k)), Math.round(lerp(a[1], b[1], k)), Math.round(lerp(a[2], b[2], k))];\n  }\n  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;\n  CL.mix = mix; CL.rgb = rgb;\n\n  CL.atom = function (ctx, x, y, r, light, dark) {\n    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, 0.5, x, y, r * 1.3);\n    g.addColorStop(0, light);\n    g.addColorStop(1, dark);\n    ctx.beginPath();\n    ctx.arc(x, y, r, 0, TAU);\n    ctx.fillStyle = g;\n    ctx.fill();\n    ctx.strokeStyle = \"rgba(255,255,255,.16)\";\n    ctx.lineWidth = 0.7;\n    ctx.stroke();\n  };\n\n  CL.bond = function (ctx, x1, y1, x2, y2, color, w) {\n    ctx.strokeStyle = color || \"rgba(200,220,240,.45)\";\n    ctx.lineWidth = w || 1.6;\n    ctx.lineCap = \"round\";\n    ctx.beginPath();\n    ctx.moveTo(x1, y1);\n    ctx.lineTo(x2, y2);\n    ctx.stroke();\n  };\n\n  CL.mol = function (ctx, type, x, y, s = 1, alpha = 1) {\n    ctx.save();\n    ctx.globalAlpha = alpha;\n    ctx.translate(x, y);\n    const k = s;\n    switch (type) {\n      case \"H2\":\n        CL.bond(ctx, -4 * k, 0, 4 * k, 0, \"rgba(210,240,255,.45)\", 1.4 * k);\n        CL.atom(ctx, -4.5 * k, 0, 4 * k, \"#f0fbff\", \"#93a8bb\");\n        CL.atom(ctx, 4.5 * k, 0, 4 * k, \"#eaf8ff\", \"#7f95aa\");\n        break;\n      case \"O2\":\n        CL.bond(ctx, -4 * k, 0, 4 * k, 0, \"rgba(255,180,180,.45)\", 1.4 * k);\n        CL.atom(ctx, -4.5 * k, 0, 4.1 * k, \"#ff9d9d\", \"#b62b2b\");\n        CL.atom(ctx, 4.5 * k, 0, 4.1 * k, \"#ff8b8b\", \"#a92424\");\n        break;\n      case \"H2O\":\n        CL.bond(ctx, 0, 0, -6 * k, -5 * k, \"rgba(210,230,250,.38)\", 1.2 * k);\n        CL.bond(ctx, 0, 0, 6 * k, -5 * k, \"rgba(210,230,250,.38)\", 1.2 * k);\n        CL.atom(ctx, 0, 0, 4.8 * k, \"#ff9b9b\", \"#b32626\");\n        CL.atom(ctx, -6.5 * k, -6 * k, 2.8 * k, \"#f4fbff\", \"#9aafc1\");\n        CL.atom(ctx, 6.5 * k, -6 * k, 2.8 * k, \"#eaf8ff\", \"#8ca2b6\");\n        break;\n      case \"CO2\":\n        CL.bond(ctx, -6 * k, 0, 6 * k, 0, \"rgba(200,220,240,.4)\", 1.4 * k);\n        CL.atom(ctx, -7 * k, 0, 3.8 * k, \"#ff9b9b\", \"#b32626\");\n        CL.atom(ctx, 0, 0, 4 * k, \"#b8c3d2\", \"#5b6675\");\n        CL.atom(ctx, 7 * k, 0, 3.8 * k, \"#ff8b8b\", \"#a92424\");\n        break;\n      case \"SO2\":\n        CL.bond(ctx, 0, 0, -7 * k, 4 * k, \"rgba(255,220,140,.4)\", 1.2 * k);\n        CL.bond(ctx, 0, 0, 7 * k, 4 * k, \"rgba(255,220,140,.4)\", 1.2 * k);\n        CL.atom(ctx, 0, 0, 4.5 * k, \"#fde68a\", \"#b45309\");\n        CL.atom(ctx, -7.5 * k, 4.5 * k, 3.6 * k, \"#ff9b9b\", \"#b32626\");\n        CL.atom(ctx, 7.5 * k, 4.5 * k, 3.6 * k, \"#ff8b8b\", \"#a92424\");\n        break;\n      case \"Cl2\":\n        CL.bond(ctx, -4 * k, 0, 4 * k, 0, \"rgba(190,255,120,.42)\", 1.4 * k);\n        CL.atom(ctx, -4.5 * k, 0, 4.2 * k, \"#d9ff9a\", \"#5f9c1c\");\n        CL.atom(ctx, 4.5 * k, 0, 4.2 * k, \"#c8f97e\", \"#4d8214\");\n        break;\n      case \"HCl\":\n        CL.bond(ctx, -4 * k, 0, 4 * k, 0, \"rgba(220,240,255,.4)\", 1.3 * k);\n        CL.atom(ctx, -4.5 * k, 0, 3.2 * k, \"#f4fbff\", \"#9aafc1\");\n        CL.atom(ctx, 4.5 * k, 0, 4.1 * k, \"#d9ff9a\", \"#5f9c1c\");\n        break;\n      case \"NO\":\n        CL.bond(ctx, -4 * k, 0, 4 * k, 0, \"rgba(160,200,255,.4)\", 1.3 * k);\n        CL.atom(ctx, -4.5 * k, 0, 3.9 * k, \"#a8c4ff\", \"#3656a8\");\n        CL.atom(ctx, 4.5 * k, 0, 3.7 * k, \"#ff9b9b\", \"#a92424\");\n        break;\n      case \"NO2\":\n        CL.bond(ctx, 0, 0, -6 * k, 4 * k, \"rgba(
