      lastError = error;\n            if (!shouldRetry(error, attempt)) throw error;\n          }\n        }\n        throw lastError;\n      }\n\n      var TOPIC_SYSTEM = [\n        '你是一位高中化学教师，正在做“课后答疑助手”。你的任务不是直接给答案，而是把题目拆成 3—6 个可思考的步骤，用苏格拉底式追问引导学生。',\n        '学科硬约束：',\n        '1. 化学式、离子符号、电荷、原子守恒必须准确；方程式必须配平，箭头区分“→”和“⇌”，必要时注明条件（△、催化剂、点燃等）。',\n        '2. 化学式正确但配平错误时，要在 trap_alert 中明确写“配平错误”，不要笼统说“错误”。',\n        '3. 计算题按步骤给分，提示中先引导列式与单位，不直接抛出最终数字。',\n        '4. 涉及实验现象时，区分“观察到什么”和“说明什么”；涉及沉淀、气体要注明条件。',\n        '5. 手写或图片识别不确定处，用【识别存疑：xxx】标出，不要假装确定。',\n        '6. 使用 Unicode 化学式（如 SO₂、Fe³⁺、CO₃²⁻），不要使用 Markdown、LaTeX 或代码块。',\n        '输出要求：只输出一个 JSON 对象，不要输出任何解释文字。',\n        'JSON 结构：',\n        '{\"title\":\"题目简短标题\",\"mode\":\"industrial|organic|experiment|principle|calculation|other\",\"core_goal\":\"本题要训练的核心能力，40字以内\",\"knowledge_tags\":[\"标签1\",\"标签2\"],\"nodes\":[{\"id\":\"n1\",\"step_name\":\"① 步骤名\",\"material_change\":\"第3层才揭晓的关键变化/结论\",\"scaffold_question\":\"不剧透答案的追问\",\"hint_level_1\":\"方向提示，不给答案\",\"hint_level_2\":\"关键原理提示，仍不给最终结果\",\"key_equation\":\"本步关键方程式或关系式\",\"trap_alert\":\"本步最常见的错误与规范提醒\"}],\"offline_variant\":{\"question\":\"一道单选变式\",\"options\":[\"选项A\",\"选项B\",\"选项C\",\"选项D\"],\"answer\":\"B\",\"analysis\":\"解析\",\"target_skill\":\"考查的方法\"}}',\n        '要求：nodes 3—6 个；scaffold_question 和 hint_level_1 都不能直接透露最终答案；material_change 可以详细，但它只会在第 3 层展示；offline_variant 必须是可判分的单选题，answer 用 A/B/C/D。'\n      ].join('\\n');\n\n      var FEEDBACK_SYSTEM = [\n        '你是一位高中化学教师，正在点评学生的“一步思路”，不是批改整份作业。',\n        '要求：先肯定学生写对的部分；再指出还缺什么；最后用一个问题把思考往前推。不要直接给出最终答案或完整解题过程。',\n        '化学式、电荷、守恒、反应条件必须准确；不确定时写【识别存疑：xxx】。',\n        '语言控制在 120 字以内，温和、具体、可执行。',\n        '只输出 JSON：{\"level\":\"思路清晰|方向基本正确|需要再想一步|暂未形成思路\",\"comment\":\"点评\",\"next_question\":\"追问\",\"missing\":\"还缺的关键点\"}'\n      ].join('\\n');\n\n      var VARIANT_SYSTEM = [\n        '你是一位高中化学命题教师，请根据学生刚完成的题目与薄弱步骤，生成 1 道同考点、不同情境的单选题。',\n        '要求：四个选项，只有一个正确；干扰项要对应常见错误；解析要说明每个选项为什么对/错；不得超纲。',\n        '化学式、配平、电荷与守恒必须准确；使用 Unicode 化学式，不要 Markdown/LaTeX。',\n        '只输出 JSON：{\"question\":\"题干\",\"options\":[\"A选项\",\"B选项\",\"C选项\",\"D选项\"],\"answer\":\"B\",\"analysis\":\"解析\",\"target_skill\":\"考查的方法\"}'\n      ].join('\\n');\n\n      async function requestTopic(text, mode, images) {\n        var parts = ['题型：' + modeLabel(mode)];\n        if (text) parts.push('题目文本：\\n' + text);\n        if (images.length) parts.push('已附上 ' + images.length + ' 张题目图片，请先识题，再拆解。');\n        var userContent = parts.join('\\n\\n');\n        if (images.length) {\n          userContent = [{ type: 'text', text: userContent }].concat(images.map(function (image) {\n            return { type: 'image_url', image_url: { url: image.dataUrl, detail: 'high' } };\n          }));\n        }\n        return callJson(TOPIC_SYSTEM, userContent, { maxTokens: 8192, timeout: 120000 }, function (data) {\n          return normalizeTopic(data, mode);\n        });\n      }\n\n      function normalizeFeedback(raw) {\n        var data = raw;\n        if (typeof data === 'string') {\n          data = { comment: data };\n        }\n        data = data && typeof data === 'object' ? data : {};\n        var comment = asText(data.comment || data.feedback || data.评价 || data.点评);\n        if (!comment) {\n          var bad = new Error('模型没有返回有效点评。');\n          bad.code = 'BAD_FEEDBACK';\n          throw bad;\n        }\n        return {\n          level: asText(data.level || data.verdict || '方向基本正确'),\n          comment: CH.truncate(comment, 240),\n          next_question: asText(data.next_question || data.nextQuestion || data.追问 || '请用一句话说明这一步为什么必须这样做。'),\n          missing: asText(data.missing || data.缺少 || ''),\n          demo: false\n        };\n      }\n\n      async function requestFeedback(node, thought) {\n        var user = '题目：' + state.topic.title + '\\n本步：' + node.step_name + '\\n引导问题：' + node.scaffold_question + '\\n学生思路：' + thought;\n        try {\n          return await callJson(FEEDBACK_SYSTEM, user, { maxTokens: 900, timeout: 60000, temperature: 0.45 }, normalizeFeedback);\n        } catch (error) {\n          if (error && error.code === 'NO_KEY') throw error;\n          if (error && error.code === 'API_ERROR' && error.status !== 400 && error.status !== 404) throw error;\n          var response = await CH.callDeepSeek([\n            { role: 'system', content: FEEDBACK_SYSTEM.replace('只输出 JSON：', '请用纯文本回答，不要输出 JSON。格式：先肯定，再指出缺口，最后追问。') },\n            { role: 'user', content: user }\n          ], { jsonMode: false, maxTokens: 700, timeout: 60000, temperature: 0.45 });\n          return normalizeFeedback({ comment: response.content });\n        }\n      }\n\n      function mockFeedback(node, thought) {\n        var compact = String(thought || '').replace(/\\s/g, '');\n        var hasFormula = /[A-Z][a-z]?\\d*|→|⇌|mol|守恒|电子|pH|Ksp/.test(thought);\n        var level;\n        var comment;\n        if (compact.length \u003c 14) {\n          level = '需要再想一步';\n          comment = '你已经愿意写下第一步，这很好。不过目前更像一个结论，还没有说明“为什么”。先试着回答：' + node.scaffold_question;\n        } else if (compact.length \u003c 45 || !hasFormula) {\n          level = '方向基本正确';\n          comment = '你抓住了“' + node.step_name + '”的大致方向，但推理链还可以更完整。试着按“看到什么—发生什么—守恒关系是什么”写成三句话，再把反应条件补上。';\n        } else {\n          level = '思路清晰';\n          comment = '你的表述已经覆盖了“' + node.step_name + '”的关键环节，因果也比较清楚。再检查一次反应条件与守恒关系，然后打开规范解析对照，看看有没有漏掉的规范表述。';\n        }\n        return {\n          level: level,\n          comment: comment,\n          next_question: '请用一句话补上：这一步为什么必须这样做？',\n          missing: hasFormula ? '反应条件与守恒关系' : '关键依据与因果链',\n          demo: true\n        };\n      }\n\n      async function requestVariant(topic, weakNodes) {\n        var user = '题目：' + topic.title + '\\n核心目标：' + topic.core_goal + '\\n学生还没掌握的步骤：' + (weakNodes.length ? weakNodes.join('；') : '暂无，请围绕核心方法命题') + '\\n请生成一道同考点的单选题。';\n        return callJson(VARIANT_SYSTEM, user, { maxTokens: 1600, timeout: 90000, temperature: 0.5 }, function (data) {\n          return normalizeVariant(data, topic);\n        });\n      }\n\n      function getProgress(nodeId) {\n        var key = String(nodeId);\n        if (!state.progress[key]) {\n          state.progress[key] = {\n            hint1: false,\n            hint2: false,\n            revealed: false,\n            mastered: false,\n            stuck: false,\n            thought: '',\n            feedback: null\n          };\n        }\n        return state.progress[key];\n      }\n\n      function getStats() {\n        var nodes = state.topic ? state.topic.nodes : [];\n        var mastered = 0;\n        var hints = 0;\n        var thoughts = 0;\n        var independent = 0;\n        nodes.forEach(function (node) {\n          var progress = getProgress(node.id);\n          if (progress.mastered) mastered += 1;\n          if (progress.hint1) hints += 1;\n          if (progress.hint2) hints += 1;\n          if (progress.thought) thoughts += 1;\n          if (progress.thought && !progress.revealed) independent += 1;\n        });\n        return {\n          total: nodes.length,\n          mastered: mastered,\n          hints: hints,\n          thoughts: thoughts,\n          rate: nodes.length ? Math.round(independent / nodes.length * 100) : 0\n        };\n      }\n\n      function updateStats() {\n        var stats = getStats();\n        els.mastered.textContent = String(stats.mastered);\n        els.hintCount.textContent = String(stats.hints);\n        els.thoughtCount.textContent = String(stats.thoughts);\n        els.rate.textContent = stats.rate + '%';\n        els.meter.style.width = stats.rate + '%';\n        els.progressLabel.textContent = stats.mastered + ' / ' + stats.total + ' 步';\n        els.sideMastered.textContent = stats.mastered + ' / ' + stats.total;\n        els.sideRate.textContent = stats.rate + '%';\n        els.sideThoughts.textContent = String(stats.thoughts);\n        els.sideHints.textContent = String(stats.hints);\n        if (!state.topic) {\n          els.sideNote.textContent = '完成一次拆解后，这里会显示你的思考轨迹。';\n        } else if (!stats.thoughts) {\n          els.sideNote.textContent = '先写一句自己的思路，独立思考率才会开始累计。';\n        } else if (stats.rate >= 70) {\n          els.sideNote.textContent = '你主要在靠自己的思路推进，继续保持；规范解析只用来对照表达。';\n        } else {\n          els.sideNote.textContent = '提示用得比较多也没关系，试着在下一题先写一句自己的判断。';\n        }\n      }\n\n      function renderTags() {\n        var tags = state.topic && state.topic.knowledge_tags ? state.topic.knowledge_tags : [];\n        els.tags.innerHTML = tags.length\n          ? tags.map(function (tag) { return '\u003cspan class=\"tag tag-weak\">' + CH.escapeHTML(tag) + '\u003c/span>'; }).join('')\n          : '\u003cspan class=\"tag tag-gray\">暂无知识点标签\u003c/span>';\n      }\n\n      function renderNodes() {\n        if (!state.topic) {\n          els.nodes.innerHTML = '';\n          return;\n        }\n        els.nodes.innerHTML = state.topic.nodes.map(function (node, index) {\n          var progress = getProgress(node.id);\n          var statusText = progress.mastered ? '已掌握' : (progress.revealed ? '解析已打开' : (progress.stuck ? '卡在这里' : '未开始'));\n          var statusClass = progress.mastered ? ' is-mastered' : (progress.stuck ? ' is-stuck' : '');\n          var hints = '';\n          if (progress.hint1) {\n            hints += '\u003cdiv class=\"qa-hint\">\u003cb>方向提示\u003c/b>' + textBlock(node.hint_level_1) + '\u003c/div>';\n          }\n          if (progress.hint2) {\n            hints += '\u003cdiv class=\"qa-hint qa-hint-strong\">\u003cb>关键原理\u003c/b>' + textBlock(node.hint_level_2) + '\u003c/div>';\n          }\n          var hintButtons = '';\n          if (!progress.hint1) {\n            hintButtons += '\u003cbutton type=\"button\" class=\"btn btn-secondary btn-sm\" data-act=\"hint1\">看方向提示\u003c/button>';\n          }\n          if (progress.hint1 && !progress.hint2) {\n            hintButtons += '\u003cbutton type=\"button\" class=\"btn btn-secondary btn-sm\" data-act=\"hint2\">看关键原理\u003c/button>';\n          }\n          var revealed = '';\n          if (progress.revealed) {\n            revealed = '\u003cdiv class=\"qa-reveal\">' +\n              '\u003cdiv class=\"qa-reveal-row\">\u003cspan class=\"qa-label\">本步关键变化\u003c/span>\u003cp>' + textBlock(node.material_change) + '\u003c/p>\u003c/div>' +\n              '\u003cdiv class=\"qa-reveal-row\">\u003cspan class=\"qa-label\">关键方程式 / 关系式\u003c/span>\u003cp class=\"qa-equation\">' + textBlock(node.key_equation) + '\u003c/p>\u003c/div>' +\n              '\u003cdiv class=\"qa-reveal-row qa-trap\">\u003cspan class=\"qa-label\">易错提醒\u003c/span>\u003cp>' + textBlock(node.trap_alert) + '\u003c/p>\u003c/div>' +\n              '\u003c/div>';\n          }\n          var feedback = '';\n          if (progress.feedback) {\n            feedback = '\u003cdiv class=\"qa-feedback\">' +\n              '\u003cdiv class=\"qa-feedback-head\">\u003cspan class=\"tag tag-green\">' + CH.escapeHTML(progress.feedback.level || '方向基本正确') + '\u003c/span>' + (progress.feedback.demo ? '\u003cspan class=\"tag tag-amber\">本地演示点评\u003c/span>' : '\u003cspan class=\"tag\">AI 点评\u003c/span>') + '\u003c/div>' +\n              '\u003cp>' + textBlock(progress.feedback.comment) + '\u003c/p>' +\n              (progress.feedback.missing ? '\u003cp class=\"qa-feedback-missing\">\u003cstrong>还缺：\u003c/strong>' + textBlock(progress.feedback.missing) + '\u003c/p>' : '') +\n              (progress.feedback.next_question ? '\u003cp class=\"qa-feedback-next\">\u003cstrong>再想一步：\u003c/strong>' + textBlock(progress.feedback.next_question) + '\u003c/p>' : '') +\n              '\u003c/div>';\n          }\n          return '\u003carticle class=\"qa-node' + statusClass + '\" data-index=\"' + index + '\">' +\n            '\u003cdiv class=\"qa-node-head\">' +\n              '\u003cspan class=\"qa-node-index\">' + String(index + 1).padStart(2, '0') + '\u003c/span>' +\n              '\u003cdiv class=\"qa-node-title\">\u003ch3>' + CH.escapeHTML(node.step_name) + '\u003c/h3>\u003cspan class=\"qa-node-state\">' + statusText + '\u003c/span>\u003c/div>' +\n            '\u003c/div>' +\n            '\u003cdiv class=\"qa-node-body\">' +\n              '\u003cdiv class=\"qa-question\">\u003cspan class=\"qa-label\">先想一想\u003c/span>\u003cp>' + textBlock(node.scaffold_question) + '\u003c/p>\u003c/div>' +\n              '\u003cdiv class=\"qa-hints\">' + hints + '\u003c/div>' +\n              (hintButtons ? '\u003cdiv class=\"qa-hint-actions\">' + hintButtons + '\u003c/div>' : '') +\n              '\u003cdiv class=\"qa-thought\">' +\n                '\u003clabel>写下你的思路\u003c/label>' +\n                '\u003ctextarea class=\"input\" data-thought maxlength=\"1200\" placeholder=\"不要求完整，先写出你想到的第一步、依据或还卡住的地方……\">' + CH.escapeHTML(progress.thought) + '\u003c/textarea>' +\n                '\u003cdiv class=\"form-actions\">\u003cbutton type=\"button\" class=\"btn btn-secondary btn-sm\" data-act=\"eval\">提交思路，请 AI 点评\u003c/button>\u003cspan class=\"small muted\">先写再问，提示才更有用。\u003c/span>\u003c/div>' +\n              '\u003c/div>' +\n              feedback +\n              revealed +\n              '\u003cdiv class=\"qa-node-nav\">' +\n                '\u003cbutton type=\"button\" class=\"btn btn-primary btn-sm\" data-act=\"mastered\">我讲明白了\u003c/button>' +\n                '\u003cbutton type=\"button\" class=\"btn btn-ghost btn-sm\" data-act=\"stuck\">还卡着\u003c/button>' +\n                '\u003cbutton type=\"button\" class=\"btn btn-ghost btn-sm\" data-act=\"reveal\">查看规范解析\u003c/button>' +\n              '\u003c/div>' +\n            '\u003c/div>' +\n          '\u003c/article>';\n        }).join('');\n      }\n\n      function updateHistoryOnly() {\n        if (!state.historyId) return;\n        var entries = readHistory();\n        var found = false;\n        entries.forEach(function (entry) {\n          if (entry.id === state.historyId) {\n            entry.topic = state.topic;\n            entry.progress = state.progress;\n            entry.updatedAt = new Date().toISOString();\n            found = true;\n          }\n        });\n        if (found) writeHistory(entries);\n      }\n\n      function readHistory() {\n        try {\n          var raw = localStorage.getItem(HISTORY_KEY);\n          var parsed = raw ? JSON.parse(raw) : [];\n          return Array.isArray(parsed) ? parsed : [];\n        } catch (error) {\n          return [];\n        }\n      }\n\n      function writeHistory(entries) {\n        try {\n          localStorage.setItem(HISTORY_KEY, JSON.stringify(entries.slice(0, MAX_HISTORY)));\n        } catch (error) {\n          CH.toast('答疑记录保存失败，可能是浏览器存储空间已满。', 'warning');\n        }\n      }\n\n      function saveHistory() {\n        if (!state.topic) return;\n        var entries = readHistory();\n        var now = new Date().toISOString();\n        var entry = {\n          id: 'qa_' + Date.now().toString(36),\n          userId: user.id,\n          userName: user.name,\n          createdAt: now,\n          updatedAt: now,\n          title: state.topic.title,\n          mode: state.topic.mode,\n          core_goal: state.topic.core_goal,\n          demo: Boolean(state.topic.demo),\n          topic: state.topic,\n          progress: state.progress\n        };\n        state.historyId = entry.id;\n        entries.unshift(entry);\n        writeHistory(entries);\n        renderHistory();\n      }\n\n      function renderHistory() {\n        var entries = readHistory().filter(function (entry) {\n          return entry && entry.userId === user.id && entry.topic && Array.isArray(entry.topic.nodes);\n        }).sort(function (a, b) {\n          return new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt);\n        });\n        els.clearHistory.hidden = entries.length === 0;\n        if (!entries.length) {\n          els.historyBody.innerHTML = '\u003cdiv class=\"qa-empty-small\">还没有答疑记录。完成一次拆解后，这里会自动保存。\u003c/div>';\n          els.recent.innerHTML = '\u003cdiv class=\"qa-empty-small\">还没有记录。\u003c/div>';\n          return;\n        }\n        var html = entries.map(function (entry) {\n          var count = entry.topic.nodes.length;\n          var mastered = 0;\n          var progress = entry.progress || {};\n          entry.topic.nodes.forEach(function (node) {\n            var item = progress[String(node.id)] || progress[node.id];\n            if (item && item.mastered) mastered += 1;\n          });\n          return '\u003cbutton type=\"button\" class=\"qa-history-item\" data-history=\"' + CH.escapeHTML(entry.id) + '\">' +\n            '\u003cdiv>\u003cstrong>' + CH.escapeHTML(CH.truncate(entry.title, 36)) + '\u003c/strong>\u003cspan>' + CH.escapeHTML(modeLabel(entry.mode)) + ' · ' + mastered + '/' + count + ' 步已掌握 · ' + CH.formatDate(entry.updatedAt || entry.createdAt, true) + '\u003c/span>\u003c/div>' +\n            '\u003cspan class=\"qa-history-go\">载入 →\u003c/span>' +\n            '\u003c/button>';\n        }).join('');\n        els.historyBody.innerHTML = html;\n        els.recent.innerHTML = entries.slice(0, 3).map(function (entry) {\n          return '\u003cbutton type=\"button\" class=\"qa-recent-item\" data-history=\"' + CH.escapeHTML(entry.id) + '\">\u003cstrong>' + CH.escapeHTML(CH.truncate(entry.title, 24)) + '\u003c/strong>\u003cspan>' + CH.escapeHTML(modeLabel(entry.mode)) + ' · ' + CH.formatDate(entry.updatedAt || entry.createdAt, true) + '\u003c/span>\u003c/button>';\n        }).join('');\n      }\n\n      function applyTopic(topic, options) {\n        state.topic = normalizeTopic(topic, topic.mode || state.mode);\n        state.topic.demo = Boolean(options && options.demo);\n        state.topic.demoReason = options && options.reason ? options.reason : '';\n        if (!state.topic.offline_variant) {\n          state.topic.offline_variant = {\n            question: '请用一句话复述“' + state.topic.title + '”中最关键的一步，并说明理由。',\n            options: ['先写结论，再补依据', '先找条件与守恒关系，再列式', '直接套公式，不检查单位'],\n            answer: 'B',\n            analysis: '化学题应先回到条件与守恒关系，再列式；单位和反应条件也要同步检查。',\n            target_skill: '回到条件与守恒'\n          };\n        }\n        state.progress = {};\n        state.variant = null;\n        els.variantSection.hidden = true;\n        els.welcome.hidden = true;\n        els.result.hidden = false;\n        els.title.textContent = state.topic.title;\n        els.goal.textContent = state.topic.core_goal;\n        els.modeTag.textContent = '题型 · ' + modeLabel(state.topic.mode);\n        els.demoTAG.textContent = state.topic.demo ? '演示示例' : '真实模型拆解';\n        els.demoTAG.className = state.topic.demo ? 'tag tag-amber' : 'tag tag-green';\n        renderTags();\n        renderNodes();\n        updateStats();\n        saveHistory();\n      }\n\n      function resetWorkspace(keepInput) {\n        state.topic = null;\n        state.progress = {};\n        state.variant = null;\n        state.historyId = '';\n        els.result.hidden = true;\n        els.variantSection.hidden = true;\n        els.welcome.hidden = false;\n        els.nodes.innerHTML = '';\n        els.title.textContent = '题目拆解';\n        els.goal.textContent = '';\n        updateStats();\n        if (!keepInput) {\n          els.text.value = '';\n          state.images = [];\n          renderThumbs();\n          setMode('auto');\n          hideStatus();\n          els.inline.textContent = '';\n        }\n      }\n\n      async function startAnalysis() {\n        if (state.busy) return;\n        var text = els.text.value.trim();\n        if (!text && !state.images.length) {\n          CH.toast('请先粘贴题目，或上传一张题目图片。', 'warning');\n          els.text.focus();\n          return;\n        }\n        setBusy(true);\n        hideStatus();\n        els.inline.textContent = '';\n        var settings = CH.getSettings();\n        var demoReason = '';\n        var demo = false;\n        var topic = null;\n        if (!settings.apiKey || settings.forceDemo) {\n          demo = true;\n          demoReason = settings.forceDemo ? '设置页已开启“强制演示模式”。' : '当前未配置 API Key。';\n          showStatus('info', '\u003cstrong>正在准备演示示例…\u003c/strong> 演示模式不会把题目发送到网络。');\n          await delay(450);\n          topic = clone(pickDemo(text, state.mode));\n        } else {\n          showStatus('info', '\u003cstrong>正在请求模型…\u003c/strong> 题目文字与图片会发送到 ' + CH.escapeHTML(settings.model) + '，请稍候。');\n          try {\n            topic = await requestTopic(text, state.mode, state.images);\n          } catch (error) {\n            demo = true;\n            demoReason = (error && error.message) ? error.message : '模型调用失败。';\n            topic = clone(pickDemo(text, state.mode));\n          }\n        }\n        applyTopic(topic, { demo: demo, reason: demoReason });\n        if (demo) {\n          var imageNote = state.images.length ? ' 你上传的图片没有被真正识别；' : '';\n          showStatus('warning', '\u003cstrong>这次使用的是示例题，不是真实识别结果。\u003c/strong> 原因：' + CH.escapeHTML(demoReason) + imageNote + ' 以下是「' + CH.escapeHTML(state.topic.title) + '」的拆解，可继续体验完整流程。配置 Key 后可在设置页测试连接。');\n        } else {\n          showStatus('success', '\u003cstrong>拆解完成。\u003c/strong> 已用 ' + CH.escapeHTML(settings.model) + ' 生成 3—6 个步骤。请先写自己的思路，再逐层取提示；AI 内容请以教师讲评为准。');\n        }\n        setBusy(false);\n        els.result.scrollIntoView({ behavior: 'smooth', block: 'start' });\n      }\n\n      function bindNodeEvents() {\n        els.nodes.addEventListener('click', function (event) {\n          var button = event.target.closest('button[data-act]');\n          if (!button) return;\n          var nodeEl = button.closest('.qa-node');\n          if (!nodeEl) return;\n          var index = Number(nodeEl.getAttribute('data-index'));\n          var node = state.topic && state.topic.nodes[index];\n          if (!node) return;\n          var action = button.getAttribute('data-act');\n          var progress = getProgress(node.id);\n          if (action === 'hint1') {\n            progress.hint1 = true;\n            renderNodes();\n            updateStats();\n            updateHistoryOnly();\n            return;\n          }\n          if (action === 'hint2') {\n            progress.hint1 = true;\n            progress.hint2 = true;\n            renderNodes();\n            updateStats();\n            updateHistoryOnly();\n            return;\n          }\n          if (action === 'reveal') {\n            progress.revealed = true;\n            renderNodes();\n            updateStats();\n            updateHistoryOnly();\n            return;\n          }\n          if (action === 'mastered') {\n            progress.mastered = true;\n            progress.stuck = false;\n            renderNodes();\n            updateStats();\n            updateHistoryOnly();\n            CH.toast('已记录：这一步你讲明白了。', 'success');\n            return;\n          }\n          if (action === 'stuck') {\n            progress.stuck = true;\n            progress.hint1 = true;\n            renderNodes();\n            updateStats();\n            updateHistoryOnly();\n            CH.toast('先看方向提示，再写一句你能想到的第一步。', 'info');\n            return;\n          }\n          if (action === 'eval') {\n            submitThought(index, node, button);\n          }\n        });\n\n        els.nodes.addEventListener('input', function (event) {\n          var textarea = event.target.closest('[data-thought]');\n          if (!textarea) return;\n          var nodeEl = textarea.closest('.qa-node');\n          if (!nodeEl || !state.topic) return;\n          var node = state.topic.nodes[Number(nodeEl.getAttribute('data-index'))];\n          if (!node) return;\n          getProgress(node.id).thought = textarea.value;\n          updateHistoryOnly();\n        });\n      }\n\n      async function submitThought(index, node, button) {\n        var nodeEl = els.nodes.querySelector('.qa-node[data-index=\"' + index + '\"]');\n        if (!nodeEl) return;\n        var textarea = nodeEl.querySelector('[data-thought]');\n        var thought = textarea ? textarea.value.trim() : '';\n        var progress = getProgress(node.id);\n        progress.thought = thought;\n        if (!thought) {\n          CH.toast('先写一句你的思路，再请助手点评。', 'warning');\n          if (textarea) textarea.focus();\n          return;\n        }\n        if (button.disabled) return;\n        button.disabled = true;\n        button.textContent = '点评中…';\n        var settings = CH.getSettings();\n        var feedback;\n        if (!settings.apiKey || settings.forceDemo || state.topic.demo) {\n          await delay(450);\n          feedback = mockFeedback(node, thought);\n        } else {\n          try {\n            feedback = await requestFeedback(node, thought);\n          } catch (error) {\n            feedback = mockFeedback(node, thought);\n            feedback.comment = '真实点评调用失败，已改用本地演示点评。' + feedback.comment;\n            CH.toast('AI 点评失败，已使用本地点评。', 'warning');\n          }\n        }\n        progress.feedback = feedback;\n        renderNodes();\n        updateStats();\n        updateHistoryOnly();\n      }\n\n      function normalizeAnswer(value, options) {\n        var answer = String(value || '').trim();\n        var letterMatch = answer.match(/^([A-H])/i);\n        if (letterMatch) return letterMatch[1].toUpperCase();\n        for (var i = 0; i \u003c options.length; i += 1) {\n          var text = String(options[i] || '').trim();\n          if (text === answer || text.indexOf(answer) >= 0 || answer.indexOf(text) >= 0) {\n            return 'ABCDEFGH'[i] || '';\n          }\n        }\n        return 'A';\n      }\n\n      function optionText(value) {\n        return String(value || '').replace(/^[A-H][\\.\\、\\:：]\\s*/i, '').trim();\n      }\n\n      function renderVariant(variant) {\n        var options = variant.options || [];\n        var answerLetter = normalizeAnswer(variant.answer, options);\n        els.variantSkill.textContent = variant.target_skill || '变式训练';\n        els.variantBody.innerHTML = '\u003cdiv class=\"qa-variant-head\">\u003ch3>' + textBlock(variant.question) + '\u003c/h3>\u003cspan class=\"tag tag-amber\">单选 · 点击选项判分\u003c/span>\u003c/div>' +\n          '\u003cdiv class=\"qa-options\" id=\"qaOptions\">' + options.map(function (option, index) {\n            var letter = 'ABCDEFGH'[index];\n            return '\u003cbutton type=\"button\" class=\"qa-option\" data-opt=\"' + letter + '\">\u003cb>' + letter + '\u003c/b>\u003cspan>' + CH.escapeHTML(optionText(option)) + '\u003c/span>\u003c/button>';\n          }).join('') + '\u003c/div>' +\n          '\u003cdiv class=\"qa-variant-result\" id=\"qaVariantResult\" hidden>\u003c/div>';\n        var optionBox = document.getElementById('qaOptions');\n        var resultBox = document.getElementById('qaVariantResult');\n        optionBox.addEventListener('click', function (event) {\n          var button = event.target.closest('.qa-option');\n          if (!button || optionBox.getAttribute('data-answered') === 'true') return;\n          optionBox.setAttribute('data-answered', 'true');\n          var selected = button.getAttribute('data-opt');\n          var optionButtons = optionBox.querySelectorAll('.qa-option');\n          for (var i = 0; i \u003c optionButtons.length; i += 1) {\n            var current = optionButtons[i];\n            var letter = current.getAttribute('data-opt');\n            current.disabled = true;\n            if (letter === answerLetter) current.classList.add('is-correct');\n            if (letter === selected && letter !== answerLetter) current.classList.add('is-wrong');\n          }\n          var correct = selected === answerLetter;\n          resultBox.hidden = false;\n          resultBox.innerHTML = '\u003cdiv class=\"alert ' + (correct ? 'alert-success' : 'alert-warning') + '\" style=\"margin:0;\">\u003cspan class=\"alert-icon\">' + (correct ? '✓' : '!') + '\u003c/span>\u003cdiv>\u003cstrong>' + (correct ? '判断正确。' : '再核对一次。') + '\u003c/strong> 正确答案是 ' + answerLetter + '。' + textBlock(variant.analysis) + '\u003c/div>\u003c/div>';\n        });\n        els.variantSection.hidden = false;\n        els.variantSection.scrollIntoView({ behavior: 'smooth', block: 'start' });\n      }\n\n      async function generateVariant() {\n        if (!state.topic) return;\n        els.generateVariant.disabled = true;\n        els.generateVariant.textContent = '生成中…';\n        var settings = CH.getSettings();\n        var weakNodes = state.topic.nodes.filter(function (node) {\n          var progress = getProgress(node.id);\n          return !progress.mastered || progress.stuck;\n        }).map(function (node) { return node.step_name; });\n        var variant;\n        if (state.topic.demo || !settings.apiKey || settings.forceDemo) {\n          await delay(400);\n          variant = state.topic.offline_variant || {\n            question: '请用一句话复述“' + state.topic.title + '”中最关键的一步，并说明理由。',\n            options: ['先写结论，再补依据', '先找条件与守恒关系，再列式', '直接套公式，不检查单位'],\n            answer: 'B',\n            analysis: '先回到条件与守恒关系，再列式，是化学计算更稳妥的顺序。',\n            target_skill: '回到条件与守恒'\n          };\n          renderVariant(variant);\n          CH.toast('已载入演示变式；配置 Key 后可生成新的靶向题。', 'info');\n        } else {\n          try {\n            variant = await requestVariant(state.topic, weakNodes);\n            renderVariant(variant);\n          } catch (error) {\n            variant = state.topic.offline_variant;\n            if (variant) {\n              renderVariant(variant);\n              CH.toast('变式生成失败，已使用本题内置变式：' + (error.message || '未知错误'), 'warning');\n            } else {\n              CH.toast('变式生成失败：' + (error.message || '未知错误'), 'error');\n            }\n          }\n        }\n        els.generateVariant.disabled = false;\n        els.generateVariant.textContent = '生成靶向变式';\n      }\n\n      function loadHistory(id) {\n        var entry = readHistory().filter(function (item) { return item.id === id; })[0];\n        if (!entry || !entry.topic) return;\n        state.topic = entry.topic;\n        state.progress = entry.progress || {};\n        state.historyId = entry.id;\n        state.variant = null;\n        els.variantSection.hidden = true;\n        els.welcome.hidden = true;\n        els.result.hidden = false;\n        els.title.textContent = state.topic.title;\n        els.goal.textContent = state.topic.core_goal;\n        els.modeTag.textContent = '题型 · ' + modeLabel(state.topic.mode);\n        els.demoTAG.textContent = state.topic.demo ? '演示示例' : '真实模型拆解';\n        els.demoTAG.className = state.topic.demo ? 'tag tag-amber' : 'tag tag-green';\n        renderTags();\n        renderNodes();\n        updateStats();\n        hideStatus();\n        els.result.scrollIntoView({ behavior: 'smooth', block: 'start' });\n        CH.toast('已载入上次的答疑记录，可继续思考。', 'success');\n      }\n\n      function clearHistory() {\n        CH.confirmAction({\n          title: '清空全部答疑记录？',\n          subtitle: '只影响当前账号的本地记录',\n          message: '记录删除后不能恢复；当前正在看的题目不会被关闭。',\n          confirmText: '确认清空',\n          danger: true\n        }).then(function (ok) {\n          if (!ok) return;\n          var remain = readHistory().filter(function (entry) { return entry.userId !== user.id; });\n          writeHistory(remain);\n          state.historyId = '';\n          renderHistory();\n          CH.toast('答疑记录已清空。', 'success');\n        });\n      }\n\n      function bindUpload() {\n        els.drop.addEventListener('click', function (event) {\n          if (event.target === els.file) return;\n          els.file.click();\n        });\n        els.drop.addEventListener('keydown', function (event) {\n          if (event.key === 'Enter' || event.key === ' ') {\n            event.preventDefault();\n            els.file.click();\n          }\n        });\n        els.file.addEventListener('change', function () {\n          addFiles(els.file.files);\n          els.file.value = '';\n        });\n        ['dragenter', 'dragover'].forEach(function (name) {\n          els.drop.addEventListener(name, function (event) {\n            event.preventDefault();\n            els.drop.classList.add('is-dragging');\n          });\n        });\n        ['dragleave', 'drop'].forEach(function (name) {\n          els.drop.addEventListener(name, function (event) {\n            event.preventDefault();\n            els.drop.classList.remove('is-dragging');\n          });\n        });\n        els.drop.addEventListener('drop', function (event) {\n          addFiles(event.dataTransfer && event.dataTransfer.files);\n        });\n        els.thumbs.addEventListener('click', function (event) {\n          var button = event.target.closest('[data-remove]');\n          if (!button) return;\n          state.images.splice(Number(button.getAttribute('data-remove')), 1);\n          renderThumbs();\n        });\n      }\n\n      function bindExamples() {\n        document.querySelectorAll('[data-example]').forEach(function (button) {\n          button.addEventListener('click', function () {\n            var key = button.getAttribute('data-example');\n            var demo = DEMO_TOPICS[key];\n            if (!demo) return;\n            els.text.value = demo.raw_text;\n            setMode(demo.mode);\n            els.inline.textContent = '已载入示例题，点击“开始拆解”查看完整流程。';\n            CH.toast('示例题已载入。', 'success');\n            els.text.focus();\n          });\n        });\n      }\n\n      function bindHistory() {\n        [els.historyBody, els.recent].forEach(function (box) {\n          box.addEventListener('click', function (event) {\n            var button = event.target.closest('[data-history]');\n            if (button) loadHistory(button.getAttribute('data-history'));\n          });\n        });\n        els.clearHistory.addEventListener('click', clearHistory);\n      }\n\n      function init() {\n        var isTeacher = user.role === 'teacher';\n        document.getElementById('homeworkCta').href = isTeacher ? 'teacher-homework.html' : 'student-homework.html';\n        document.getElementById('modelSettingsCta').href = 'settings.html';\n        renderModeTabs();\n        renderModel();\n        renderThumbs();\n        renderHistory();\n        updateStats();\n        bindUpload();\n        bindExamples();\n        bindNodeEvents();\n        bindHistory();\n        els.analyze.addEventListener('click', startAnalysis);\n        els.reset.addEventListener('click', function () {\n          resetWorkspace(false);\n          CH.toast('输入已清空。', 'success');\n        });\n        els.resetResult.addEventListener('click', function () {\n          resetWorkspace(false);\n          els.text.focus();\n          CH.toast('已回到提问区，可以换一道题。', 'success');\n        });\n        els.generateVariant.addEventListener('click', generateVariant);\n        els.modeTabs.addEventListener('click', function (event) {\n          var button = event.target.closest('[data-mode]');\n          if (button) setMode(button.getAttribute('data-mode'));\n        });\n        window.addEventListener('storage', function (event) {\n          if (event.key === 'chemhub_settings_v1') renderModel();\n        });\n      }\n\n      init();\n    })();\n  "},"settings.html":{"page":"settings.html","title":"设置 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003cdiv class=\"page-head\">\n      \u003cdiv>\n        \u003cnav class=\"breadcrumbs\" aria-label=\"面包屑\">\u003ca id=\"backDashboard\" href=\"teacher-dashboard.html\">工作台\u003c/a>\u003cspan>/\u003c/span>\u003cspan>设置\u003c/span>\u003c/nav>\n        \u003ch1>设置\u003c/h1>\n        \u003cp>配置任意 OpenAI 兼容的多模态模型接口（DeepSeek、智谱、Gemini、硅基流动等），或直接使用内置演示数据。未填写 API Key、调用失败或开启“强制演示模式”时，平台会自动使用预置数据，所有页面仍可完整演示。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"page-head-actions\">\n        \u003ca class=\"btn btn-ghost btn-sm\" href=\"index.html\" id=\"logoutLink\">退出登录\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"settings-grid\">\n      \u003csection class=\"card settings-card\">\n        \u003cdiv class=\"card-header\">\n          \u003cdiv>\u003ch2>模型接口配置\u003c/h2>\u003cp>Key 只保存在当前浏览器的 localStorage，不会上传到本平台以外的服务器。\u003c/p>\u003c/div>\n          \u003cspan class=\"tag tag-gray\" id=\"saveState\">未修改\u003c/span>\n        \u003c/div>\n        \u003cform id=\"settingsForm\" autocomplete=\"off\">\n          \u003cdiv class=\"card-body stack\">\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"apiKey\">API Key \u003cspan class=\"required\">*\u003c/span>\u003c/label>\n              \u003cdiv class=\"input-with-action\">\n                \u003cinput class=\"input\" id=\"apiKey\" name=\"apiKey\" type=\"password\" placeholder=\"sk-…（留空则使用演示数据）\" autocomplete=\"off\" spellcheck=\"false\">\n                \u003cbutton class=\"btn btn-ghost\" type=\"button\" id=\"toggleKey\">显示\u003c/button>\n              \u003c/div>\n              \u003cspan class=\"field-hint\">在对应模型平台创建 Key 后粘贴到这里。请勿把 Key 写进代码、截图或公开仓库，也不要共用他人的 Key。\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"form-grid\">\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"model\">模型名\u003c/label>\n                \u003cinput class=\"input\" id=\"model\" name=\"model\" type=\"text\" value=\"deepseek-flash\" placeholder=\"deepseek-flash\" spellcheck=\"false\">\n                \u003cspan class=\"field-hint\">默认 deepseek-flash，对应 DeepSeek 4.1 Flash 多模态接口；改用其他平台时，请按该平台控制台的模型名填写。\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"apiBase\">接口地址\u003c/label>\n                \u003cinput class=\"input\" id=\"apiBase\" name=\"apiBase\" type=\"url\" placeholder=\"https://api.deepseek.com/chat/completions\" spellcheck=\"false\">\n                \u003cspan class=\"field-hint\">一般保持默认即可；填入以 /v1 结尾的地址时，脚本会自动补全 /chat/completions。\u003c/span>\n              \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"field\">\n              \u003clabel>快速填入模型预设（可选）\u003c/label>\n              \u003cdiv class=\"preset-grid\" id=\"presetGrid\">\n                \u003cbutton class=\"preset-btn\" type=\"button\" data-model=\"deepseek-flash\" data-base=\"https://api.deepseek.com/chat/completions\" data-name=\"DeepSeek 4.1 Flash\">\n                  \u003cstrong>DeepSeek 4.1 Flash\u003c/strong>\u003csmall>deepseek-flash · 多模态\u003c/small>\n                \u003c/button>\n                \u003cbutton class=\"preset-btn\" type=\"button\" data-model=\"glm-4v-flash\" data-base=\"https://open.bigmodel.cn/api/paas/v4\" data-name=\"智谱 GLM-4V-Flash\">\n                  \u003cstrong>智谱 GLM-4V-Flash\u003c/strong>\u003csmall>glm-4v-flash · 有免费额度\u003c/small>\n                \u003c/button>\n                \u003cbutton class=\"preset-btn\" type=\"button\" data-model=\"gemini-2.5-flash\" data-base=\"https://generativelanguage.googleapis.com/v1beta/openai\" data-name=\"Gemini 2.5 Flash\">\n                  \u003cstrong>Gemini 2.5 Flash\u003c/strong>\u003csmall>gemini-2.5-flash · 有免费额度\u003c/small>\n                \u003c/button>\n                \u003cbutton class=\"preset-btn\" type=\"button\" data-model=\"Qwen/Qwen2.5-VL-72B-Instruct\" data-base=\"https://api.siliconflow.cn/v1\" data-name=\"硅基流动 Qwen2.5-VL\">\n                  \u003cstrong>硅基流动 Qwen2.5-VL\u003c/strong>\u003csmall>视觉模型 · 注册送额度\u003c/small>\n                \u003c/button>\n              \u003c/div>\n              \u003cspan class=\"field-hint\">按钮只把模型名和接口地址填入表单，不会自动保存。源码包里没有可直接使用的免费 Key；免费额度、模型名和可用性以各平台控制台为准，需自己注册。\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"field\">\n              \u003clabel class=\"switch\" for=\"forceDemo\">\n                \u003cinput type=\"checkbox\" id=\"forceDemo\" name=\"forceDemo\">\n                \u003cspan class=\"switch-track\" aria-hidden=\"true\">\u003c/span>\n                \u003cspan class=\"switch-label\">强制演示模式：即使已填 Key，也直接使用预置批改数据\u003c/span>\n              \u003c/label>\n              \u003cspan class=\"field-hint\">适合课堂展示或网络不稳定时使用；关闭后才会真正发起多模态请求。\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"alert alert-info\" style=\"margin:0;\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>多模态说明：\u003c/strong>批改时会把作业图片压缩后转为 base64，随提示词一起发送给模型。PDF 目前只记录文件名，演示版请优先上传 JPG / PNG 图片；若接口不支持 PDF，页面会提示“请上传图片”。\u003c/div>\u003c/div>\n\n            \u003cdiv class=\"form-actions\">\n              \u003cbutton class=\"btn btn-primary\" type=\"submit\" id=\"saveButton\">保存设置\u003c/button>\n              \u003cbutton class=\"btn btn-secondary\" type=\"button\" id=\"testButton\">测试连接\u003c/button>\n              \u003cspan class=\"small muted\" id=\"testInline\">\u003c/span>\n            \u003c/div>\n            \u003cspan class=\"field-hint\">测试成功会自动保存当前 Key、模型与接口地址；测试失败不会覆盖已保存的设置。\u003c/span>\n          \u003c/div>\n        \u003c/form>\n      \u003c/section>\n\n      \u003caside class=\"stack\">\n        \u003csection class=\"card settings-card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>当前状态\u003c/h2>\u003cp>页面加载时读取的接口配置。\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card-body stack\">\n            \u003cdiv class=\"api-status\" id=\"apiStatus\">\u003cspan class=\"status-dot amber\">\u003c/span>\u003cdiv>\u003cstrong id=\"apiStatusTitle\">未配置 Key\u003c/strong>\u003cbr>\u003cspan id=\"apiStatusText\">将自动使用演示数据\u003c/span>\u003c/div>\u003c/div>\n            \u003cdiv class=\"analysis-snippet\">\u003cstrong>运行方式\u003c/strong>\u003cp>纯 HTML + CSS + 原生 JavaScript，无需安装依赖。双击 index.html 即可运行；若浏览器限制本地文件读取，请用任意静态文件服务器打开。\u003c/p>\u003c/div>\n            \u003cdiv class=\"analysis-snippet\">\u003cstrong>AIGC 标注\u003c/strong>\u003cp>本平台的批改评语、共性分析与建议由大模型辅助生成；界面、演示数据与规则由人工设计。正式使用时请教师逐条复核。\u003c/p>\u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card settings-card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>当前账号\u003c/h2>\u003cp>数据仅保存在本机。\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cdiv class=\"analysis-snippet\">\u003cstrong id=\"accountName\">—\u003c/strong>\u003cp id=\"accountMeta\">—\u003c/p>\u003c/div>\n            \u003cdiv class=\"privacy-note\" style=\"margin-top:10px;\">\u003cstrong>隐私提醒：\u003c/strong>请勿录入真实学生姓名、学号、手写作业原图等敏感信息。比赛或公开演示前，请对素材做脱敏处理并取得授权。\u003c/div>\n          \u003c/div>\n        \u003c/section>\n      \u003c/aside>\n    \u003c/div>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>本地数据概览\u003c/h2>\u003cp>账号、档案、作业、优秀答案与报告均存储在浏览器 localStorage。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-blue\">本机数据\u003c/span>\u003c/div>\n        \u003cdiv class=\"card-body\">\n          \u003cdiv class=\"data-stats\" id=\"dataStats\">\u003c/div>\n          \u003cp class=\"small muted\" style=\"margin:12px 0 0;\">清除浏览器站点数据、更换浏览器或使用无痕模式，都会导致这些数据不可见。重要演示前建议先恢复一次演示数据并完整走一遍流程。\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"grid grid-2\">\n        \u003csection class=\"card danger-zone\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>清空演示数据\u003c/h2>\u003cp>删除账号、学生档案、作业、优秀答案和报告。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-red\">不可撤销\u003c/span>\u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cp class=\"small muted\" style=\"margin:0 0 12px;\">清空后会退出登录并回到首页，API Key 与模型设置会保留。适合在正式录入自己的班级数据前重置环境。\u003c/p>\n            \u003cbutton class=\"btn btn-danger\" type=\"button\" id=\"clearButton\">清空演示数据\u003c/button>\n          \u003c/div>\n        \u003c/section>\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>恢复预置演示数据\u003c/h2>\u003cp>重新生成演示账号、作业、档案、报告与优秀答案。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-green\">推荐\u003c/span>\u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cp class=\"small muted\" style=\"margin:0 0 12px;\">会覆盖当前账号和全部作业数据，恢复为 teacher / student / student2 / student3 四个演示账号（密码均为 123456）。恢复后请重新登录。\u003c/p>\n            \u003cbutton class=\"btn btn-secondary\" type=\"button\" id=\"restoreButton\">恢复演示数据\u003c/button>\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-warning\">\u003cspan class=\"alert-icon\">!\u003c/span>\u003cdiv>\u003cstrong>比赛提交提醒：\u003c/strong>本平台为华中师范大学首届（2026）大学生 AIGC 教学应用竞赛场景下的教学演示原型，不是赛事官方平台。作品说明中请注明访问方式、运行环境、演示账号，并附 AIGC 工具、关键提示词与人工修改说明；讲解视频需≥720P、不超过 8 分钟。\u003c/div>\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ title: '设置 · 知行化学' });\n      if (!user) return;\n      var isTeacher = user.role === 'teacher';\n      var form = document.getElementById('settingsForm');\n      var apiKey = document.getElementById('apiKey');\n      var model = document.getElementById('model');\n      var apiBase = document.getElementById('apiBase');\n      var forceDemo = document.getElementById('forceDemo');\n      var toggleKey = document.getElementById('toggleKey');\n      var saveButton = document.getElementById('saveButton');\n      var testButton = document.getElementById('testButton');\n      var testInline = document.getElementById('testInline');\n      var saveState = document.getElementById('saveState');\n      var apiStatus = document.getElementById('apiStatus');\n      var apiStatusTitle = document.getElementById('apiStatusTitle');\n      var apiStatusText = document.getElementById('apiStatusText');\n      var backDashboard = document.getElementById('backDashboard');\n\n      backDashboard.href = isTeacher ? 'teacher-dashboard.html' : 'student-dashboard.html';\n      backDashboard.textContent = isTeacher ? '教师工作台' : '学生工作台';\n      document.getElementById('accountName').textContent = user.name + ' · ' + (isTeacher ? '教师' : '学生');\n      document.getElementById('accountMeta').textContent = (user.className || CH.DEMO_CLASS) + ' · ' + (isTeacher ? '可管理本班作业与档案' : '仅可查看本人数据');\n      document.getElementById('logoutLink').addEventListener('click', function (event) {\n        event.preventDefault();\n        CH.logout();\n      });\n\n      function applySettingsToForm() {\n        var settings = CH.getSettings();\n        apiKey.value = settings.apiKey;\n        model.value = settings.model;\n        apiBase.value = settings.apiBase;\n        forceDemo.checked = Boolean(settings.forceDemo);\n        renderStatus(settings);\n      }\n\n      function renderStatus(settings) {\n        var current = settings || CH.getSettings();\n        if (current.apiKey && !current.forceDemo) {\n          apiStatus.querySelector('.status-dot').className = 'status-dot';\n          apiStatusTitle.textContent = '已配置 API Key';\n          apiStatusText.textContent = '模型：' + current.model + ' · 批改时调用真实接口';\n        } else if (current.forceDemo) {\n          apiStatus.querySelector('.status-dot').className = 'status-dot amber';\n          apiStatusTitle.textContent = '强制演示模式';\n          apiStatusText.textContent = '不发起真实请求，直接使用预置批改数据';\n        } else {\n          apiStatus.querySelector('.status-dot').className = 'status-dot amber';\n          apiStatusTitle.textContent = '未配置 API Key';\n          apiStatusText.textContent = '将自动使用演示数据，所有功能可点通';\n        }\n      }\n\n      function renderStats() {\n        var users = CH.getUsers();\n        var students = CH.getStudents();\n        var submissions = CH.getSubmissions();\n        var graded = submissions.filter(function (item) { return item.status === 'graded'; });\n        var pending = submissions.filter(function (item) { return item.status === 'pending'; });\n        var excellent = CH.getActiveExcellent();\n        var reports = CH.getReports();\n        var items = [\n          { label: '账号', value: users.length, hint: '教师 + 学生' },\n          { label: '学生档案', value: students.length, hint: '自动创建' },\n          { label: '作业总数', value: submissions.length, hint: '含待批改' },\n          { label: '已批改', value: graded.length, hint: '含演示批改' },\n          { label: '待批改', value: pending.length, hint: '学生已提交' },\n          { label: '优秀答案', value: excellent.length, hint: '当前展示中' },\n          { label: '共性报告', value: reports.length, hint: '班级报告' },\n          { label: 'API Key', value: CH.getSettings().apiKey ? '已填' : '未填', hint: CH.getSettings().forceDemo ? '强制演示' : '按设置调用' }\n        ];\n        document.getElementById('dataStats').innerHTML = items.map(function (item) {\n          return '\u003cdiv class=\"stat-card\">\u003cstrong>' + CH.escapeHTML(String(item.value)) + '\u003c/strong>\u003cspan>' + CH.escapeHTML(item.label) + '\u003c/span>\u003csmall>' + CH.escapeHTML(item.hint) + '\u003c/small>\u003c/div>';\n        }).join('');\n      }\n\n      applySettingsToForm();\n      renderStats();\n\n      toggleKey.addEventListener('click', function () {\n        var show = apiKey.type === 'password';\n        apiKey.type = show ? 'text' : 'password';\n        toggleKey.textContent = show ? '隐藏' : '显示';\n        toggleKey.setAttribute('aria-label', show ? '隐藏 API Key' : '显示 API Key');\n      });\n\n      apiKey.addEventListener('input', function () { saveState.textContent = '未保存'; saveState.className = 'tag tag-amber'; });\n      model.addEventListener('input', function () { saveState.textContent = '未保存'; saveState.className = 'tag tag-amber'; });\n      apiBase.addEventListener('input', function () { saveState.textContent = '未保存'; saveState.className = 'tag tag-amber'; });\n      forceDemo.addEventListener('change', function () { saveState.textContent = '未保存'; saveState.className = 'tag tag-amber'; });\n\n      // 模型预设：只填表单，不自动保存，避免把“试用某个免费模型”误当成已配置。\n      var presetButtons = document.querySelectorAll('.preset-btn');\n      for (var i = 0; i \u003c presetButtons.length; i += 1) {\n        presetButtons[i].addEventListener('click', function () {\n          model.value = this.getAttribute('data-model') || '';\n          apiBase.value = this.getAttribute('data-base') || '';\n          saveState.textContent = '未保存';\n          saveState.className = 'tag tag-amber';\n          testInline.textContent = '已填入「' + (this.getAttribute('data-name') || '模型预设') + '」，请填写对应平台的 Key，再点“保存设置”或“测试连接”。';\n          CH.toast('已填入模型预设，填写 Key 后记得保存。', 'info');\n        });\n      }\n\n      form.addEventListener('submit', function (event) {\n        event.preventDefault();\n        var next = CH.saveSettings({\n          apiKey: apiKey.value,\n          model: model.value,\n          apiBase: apiBase.value,\n          forceDemo: forceDemo.checked\n        });\n        model.value = next.model;\n        apiBase.value = next.apiBase;\n        saveState.textContent = '已保存';\n        saveState.className = 'tag tag-green';\n        renderStatus(next);\n        renderStats();\n        CH.toast('设置已保存到当前浏览器。', 'success');\n      });\n\n      testButton.addEventListener('click', function () {\n        if (!apiKey.value.trim()) {\n          CH.toast('请先填写 API Key，再测试连接。', 'warning');\n          testInline.textContent = '未填写 Key。';\n          return;\n        }\n        testButton.disabled = true;\n        testButton.textContent = '测试中…';\n        testInline.textContent = '正在请求模型接口…';\n        CH.testApiConnection({\n          apiKey: apiKey.value.trim(),\n          model: model.value.trim() || 'deepseek-flash',\n          apiBase: apiBase.value.trim() || CH.DEFAULT_SETTINGS.apiBase\n        }).then(function (result) {\n          testButton.disabled = false;\n          testButton.textContent = '测试连接';\n          if (result.ok) {\n            // 连接成功就把当前输入框的值真正写入 localStorage。\n            // 之前只测试不保存，用户以为“已经配置”，作业页却仍按未配置处理。\n            var saved = CH.sav -rank span:first-child { width: 21px; height: 21px; display: grid; place-items: center; border-radius: 7px; color: var(--blue-800); background: var(--blue-100); font-weight: 800; }\n.issue-title { min-height: 38px; margin: 0 0 6px; font-size: 12px; font-weight: 700; line-height: 1.55; }\n.issue-count { display: flex; align-items: baseline; gap: 4px; color: var(--blue-800); font-size: 18px; font-weight: 800; }\n.issue-count small { color: var(--muted); font-size: 10px; font-weight: 500; }\n.issue-bar { height: 5px; margin-top: 8px; overflow: hidden; border-radius: 999px; background: #edf3f8; }\n.issue-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #d18d45, #a7473d); }\n.example-box { padding: 12px 14px; border-left: 3px solid #d4a04a; border-radius: 0 10px 10px 0; background: #fffbf3; }\n.example-box + .example-box { margin-top: 8px; }\n.example-box .student-label { color: var(--gold-700); font-size: 10px; font-weight: 800; }\n.example-box p { margin: 4px 0 0; color: var(--ink-soft); font-size: 12px; line-height: 1.7; }\n.suggestion-list { display: flex; flex-direction: column; gap: 10px; counter-reset: suggestion; }\n.suggestion-item { position: relative; padding: 13px 15px 13px 46px; border: 1px solid var(--line); border-radius: 11px; background: #fbfdff; color: var(--ink-soft); font-size: 12px; line-height: 1.75; }\n.suggestion-item::before { counter-increment: suggestion; content: counter(suggestion); position: absolute; left: 13px; top: 12px; width: 23px; height: 23px; display: grid; place-items: center; border-radius: 7px; background: var(--teal-100); color: var(--teal-700); font-size: 10px; font-weight: 800; }\n.suggestion-item strong { color: var(--ink); }\n\n/* ---------- 优秀答案 ---------- */\n.wall-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }\n.wall-toolbar .filter-select { min-width: 190px; }\n.wall-grid { display: grid; gr  6px; margin-bottom: 9px; color: var(--blue-700); font-size: 10px; font-weight: 800; letter-spacing: .14em; }\n.placeholder-hero h1 { margin: 0 0 9px; font-size: 30px; }\n.placeholder-hero p { max-width: 700px; margin: 0; color: var(--ink-soft); font-size: 13px; line-height: 1.85; }\n.coming-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }\n.coming-card { display: flex; flex-direction: column; min-height: 160px; padding: 17px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }\n.coming-icon { width: 37px; height: 37px; display: grid; place-items: center; margin-bottom: 11px; border-radius: 11px; color: var(--blue-800); background: var(--blue-100); font-size: 17px; }\n.coming-card h3 { margin: 0 0 5px; font-size: 13px; }\n.coming-card p { flex: 1; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }\n.coming-status { margin-top: 13px; display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; padding: 3px 8px; border-radius: 999px; color: var(--gold-700); background: var(--gold-100); font-size: 10px; font-weight: 700; }\n\n/* ---------- 设置页 ---------- */\n.settings-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: 18px; align-items: start; }\n.settings-card .card-header h2 { font-size: 16px; }\n.api-status { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 9px; background: #f7fafc; color: var(--ink-soft); font-size: 11px; }\n.api-status strong { color: var(--ink); }\n.privacy-note { padding: 13px 14px; border: 1px solid #e7dfc8; border-radius: 11px; background: #fffcf5; color: #7b6636; font-size: 11px; line-height: 1.75; }\n.privacy-note strong { color: #6f541b; }\n.danger-zone { border-color: #edc9c5; }\n.danger-zone .card-header { background: #fffafa; }\n.data-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.data-stat { padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fbfdff; }\n.data-stat strong { display: block; font-size: 20px; color: var(--blue-800); line-height: 1.2; }\n.data-stat small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }\n\n/* ---------- 空状态 ---------- */\n.empty-state { padding: 34px 20px; text-align: center; color: var(--muted); }\n.empty-icon { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 10px; border-radius: 16px; background: #eef5fb; color: var(--blue-500); font-size: 23px; }\n.empty-state h3 { margin: 0 0 4px; font-size: 14px; color: var(--ink); }\n.empty-state p { margin: 0 auto 12px; max-width: 360px; font-size: 11px; line-height: 1.7; }\n\n/* ---------- 弹窗 / toast ---------- */\n.modal-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 120;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 20px;\n  background: rgba(11, 33, 52, .46);\n  backdrop-filter: blur(3px);\n  animation: fade-in .16s ease;\n}\n.modal {\n  width: min(500px, 100%);\n  max-height: calc(100vh - 40px);\n  overflow-y: auto;\n  border-radius: 17px;\n  background: #fff;\n  box-shadow: var(--shadow-lg);\n  animation: modal-up .2s ease;\n}\n.modal.modal-wide { width: min(640px, 100%); }\n.modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }\n.modal-header h2 { margin: 0 0 3px; font-size: 18px; }\n.modal-header p { margin: 0; color: var(--muted); font-size: 11px; }\n.modal-close { width: 30px; height: 30px; display: grid; place-items: center; flex: 0 0 auto; border: 0; border-radius: 8px; background: #f2f6f9; color: var(--ink-soft); font-size: 17px; }\n.modal-close:hover { background: #e7eef4; }\n.modal-body { padding: 18px 20px; }\n.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 20px 18px; }\n@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }\n@keyframes modal-up { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }\n\n.toast {\n  position: fixed;\n  left: 50%;\n  bottom: 28px;\n  z-index: 200;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  max-width: min(440px, calc(100vw - 32px));\n  padding: 11px 16px;\n  border-radius: 11px;\n  color: #fff;\n  background: #244b66;\n  box-shadow: 0 14px 34px rgba(11, 33, 52, .28);\n  font-size: 12px;\n  transform: translateX(-50%);\n  animation: toast-in .22s ease;\n}\n.toast-success { background: #176a54; }\n.toast-error { background: #9f443a; }\n.toast-warning { background: #8a631c; }\n.toast-info { background: #245d88; }\n.toast-icon { font-size: 14px; }\n@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }\n\n/* ---------- 页脚 ---------- */\n.site-footer { margin-top: 40px; border-top: 1px solid var(--line); background: #fff; }\n.footer-inner { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 24px 0; }\n.footer-brand { display: flex; align-items: center; gap: 9px; color: var(--ink); }\n.footer-brand .brand-mark { width: 32px; height: 32px; border-radius: 9px; font-size: 16px; box-shadow: none; }\n.footer-brand strong { display: block; font-size: 12px; }\n.footer-brand small { display: block; color: var(--muted); font-size: 10px; }\n.footer-links { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 10px; }\n.footer-links a { color: var(--muted); }\n.footer-links a:hover { color: var(--blue-700); }\n.footer-copy { width: 100%; padding-top: 12px; border-top: 1px solid #eef3f7; color: #92a1ad; font-size: 10px; line-height: 1.7; }\n\n/* ---------- 小工具 ---------- */\n.muted { color: var(--muted); }\n.small { font-size: 11px; }\n.tiny { font-size: 10px; }\n.ink-soft { color: var(--ink-soft); }\n.nowrap { white-space: nowrap; }\n.text-right { text-align: right; }\n.mt-0 { margin-top: 0 !important; }\n.mt-1 { margin-top: 8px !important; }\n.mt-2 { margin-top: 16px !important; }\n.mb-0 { margin-bottom: 0 !important; }\n.mb-1 { margin-bottom: 8px !important; }\n.mb-2 { margin-bottom: 16px !important; }\n.hidden { display: none !important; }\n.divider { height: 1px; margin: 14px 0; background: var(--line); }\n.kbd { padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: #f8fafc; font-family: \"Consolas\", monospace; font-size: 10px; }\n.equation { font-family: \"Consolas\", \"Courier New\", monospace; }\n\n/* ---------- 响应式 ---------- */\n@media (max-width: 1080px) {\n  .header-main { gap: 14px; }\n  .module-link { padding: 8px 9px; font-size: 12px; }\n  .brand-text small { display: none; }\n  .role-note { display: none; }\n  .hero-inner { grid-template-columns: 1fr; gap: 22px; }\n  .hero-side { flex-direction: row; flex-wrap: wrap; }\n  .hero-side-title { width: 100%; }\n  .hero-mini { flex: 1 1 180px; border-bottom: 0; }\n  .issue-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n  .coming-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n}\n\n@media (max-width: 900px) {\n  .page-shell { width: min(100% - 28px, 1180px); }\n  .nav-toggle { display: inline-flex; align-items: center; justify-content: center; order: 3; margin-left: auto; }\n  .header-main { flex-wrap: wrap; padding: 9px 0; gap: 10px; }\n  .module-nav {\n    order: 4;\n    display: none;\n    width: 100%;\n    justify-content: flex-start;\n    overflow-x: auto;\n    padding: 3px 0 8px;\n  }\n  .site-header.is-open .module-nav { display: flex; }\n  .header-tools { order: 2; margin-left: auto; }\n  .user-meta { display: none; }\n  .header-link.settings-link { display: none; }\n  .role-bar-inner { gap: 8px; }\n  .role-capsule { display: none; }\n  .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .grid-4, .coming-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .grid-3 { grid-te ption.is-wrong b { background: var(--red-100); color: var(--red-700); }\n.qa-option:disabled { opacity: 1; cursor: default; }\n.qa-variant-result { margin-top: 11px; }\n.qa-variant-result .alert { font-size: 11.5px; line-height: 1.8; }\n@media (max-width: 1000px) {\n  .qa-grid { grid-template-columns: minmax(0, 1fr) 280px; }\n}\n@media (max-width: 900px) {\n  .qa-grid { grid-template-columns: 1fr; }\n  .qa-result-side { flex-direction: row; align-items: center; flex-wrap: wrap; }\n  .qa-thumbs { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n}\n@media (max-width: 560px) {\n  .qa-hero-tags { margin: 12px 0 14px; }\n  .qa-hero .form-actions .btn { flex: 1 1 100%; }\n  .qa-result-head h2 { font-size: 17px; }\n  .qa-thumbs { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .qa-options { grid-template-columns: 1fr; }\n  .qa-node-body { padding: 12px; }\n  .qa-node-head { padding: 10px 12px; }\n  .qa-thought .form-actions .btn { flex: 1 1 100%; }\n  .qa-result-actions .btn { flex: 1 1 100%; }\n  .qa-node-nav .btn { flex: 1 1 45%; }\n  .qa-history .card-header { align-items: flex-start; }\n  .qa-history .card-header .btn { width: 100%; }\n}\n\n\n/* 设置页：模型预设按钮 */\n.preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.preset-btn {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 2px;\n  padding: 10px 11px;\n  border: 1px solid var(--line);\n  border-radius: 9px;\n  background: #fff;\n  text-align: left;\n  transition: .16s ease;\n}\n.preset-btn:hover { border-color: #b9d5e8; background: var(--blue-050); }\n.preset-btn strong { color: var(--ink); font-size: 11.5px; }\n.preset-btn small { color: var(--muted); font-size: 9.5px; }\n@media (max-width: 560px) {\n  .preset-grid { grid-template-columns: 1fr; }\n}\n\n/* ---------- 打印 ---------- */\n@media print {\n  body { background: #fff; }\n  .site-header, .site-footer, .page-head-actions, .btn, .role-bar, .no-print { display: none !important; }\n  .page-shell { width: 100%; }\n  .card { box-shadow: none; break-inside: avoid; }\n  .hero { box-shadow: none; }\n  .print-only { display: block !important; }\n}\n";
  var frame = document.getElementById('appFrame');
  var boot = document.getElementById('boot');
  var showing = '';
  var pendingLoad = false;

  // 解析 #page.html?query 形式的地址；外部链接返回 null。
  function splitHref(raw) {
    var text = String(raw == null ? '' : raw).trim();
    if (!text) return null;
    if (text.charAt(0) === '#') text = text.slice(1);
    if (text.indexOf('//') === 0) return null;
    if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return null;
    var hash = '';
    var hi = text.indexOf('#');
    if (hi >= 0) { hash = text.slice(hi); text = text.slice(0, hi); }
    var query = '';
    var qi = text.indexOf('?');
    if (qi >= 0) { query = text.slice(qi); text = text.slice(0, qi); }
    var clean = text.split('/').pop();
    if (!clean || !/[.]html$/i.test(clean)) return null;
    return { page: clean, query: query, hash: hash };
  }

  function parseHash() {
    var raw = String(location.hash || '');
    if (raw.charAt(0) === '#') raw = raw.slice(1);
    try { raw = decodeURIComponent(raw); } catch (error) {}
    return splitHref(raw) || { page: 'index.html', query: '', hash: '' };
  }

  function pageShim(page, query) {
    return [
      '(function () {',
      '  "use strict";',
      '  window.__CHEMHUB_PAGE__ = ' + JSON.stringify(page) + ';',
      '  window.__CHEMHUB_QUERY__ = ' + JSON.stringify(query || '') + ';',
      '  window.__chemhubNav = function (href) { parent.postMessage({ __chemhub: "navigate", href: String(href || "") }, "*"); };',
      '  window.__chemhubReplace = function (href) { parent.postMessage({ __chemhub: "replace", href: String(href || "") }, "*"); };',
      '  window.__chemhubHashReplace = function (href) { parent.postMessage({ __chemhub: "hash", href: String(href || "") }, "*"); };',
      '  document.addEventListener("click", function (event) {',
      '    var target = event.target;',
      '    var a = target && target.closest ? target.closest("a[href]") : null;',
      '    if (!a) return;',
      '    if (a.hasAttribute("data-logout")) return;',
      '    var href = a.getAttribute("href") || "";',
      '    if (!href || href.charAt(0) === "#") return;',
      '    if (!/[.]html([?#]|$)/i.test(href)) return;',
      '    event.preventDefault();',
      '    window.__chemhubNav(href);',
      '  }, true);',
      '})();'
    ].join('\n');
  }

  function buildDoc(meta, query) {
    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">' +
      '<title>' + meta.title + '</title><style>' + STYLE + '</style>' +
      (meta.style ? '<style>' + meta.style + '</style>' : '') + '</head>' +
      '<body' + (meta.bodyClass ? ' class="' + meta.bodyClass + '"' : '') + '>' +
      meta.body +
      '<script>' + pageShim(meta.page, query) + '<\/script>' +
      '<script>' + COMMON + '<\/script>' +
      '<script>' + meta.script + '<\/script>' +
      '</body></html>';
  }

  function render(parts, push) {
    if (!parts) return;
    var key = parts.page + (parts.query || '');
    if (key === showing && !push) return;
    showing = key;
    var meta = PAGES[parts.page] || PAGES['index.html'];
    if (!meta) return;
    document.title = meta.title;
    pendingLoad = true;
    frame.srcdoc = buildDoc(meta, parts.query || '');
    var hash = '#' + meta.page + (parts.query || '');
    try {
      if (push) history.pushState({ page: meta.page, query: parts.query || '' }, '', hash);
      else history.replaceState({ page: meta.page, query: parts.query || '' }, '', hash);
    } catch (error) {}
    setTimeout(function () { if (pendingLoad) { pendingLoad = false; boot.classList.add('is-hidden'); } }, 2200);
  }

  frame.addEventListener('load', function () {
    if (!pendingLoad) return;
    pendingLoad = false;
    boot.classList.add('is-hidden');
  });

  window.addEventListener('message', function (event) {
    if (event.source !== frame.contentWindow) return;
    var data = event.data || {};
    if (data.__chemhub === 'navigate') {
      var p = splitHref(data.href);
      if (p) render(p, true);
    } else if (data.__chemhub === 'replace') {
      var r = splitHref(data.href);
      if (r) render(r, false);
    } else if (data.__chemhub === 'hash') {
      var h = splitHref(data.href);
      if (h) {
        try { history.replaceState({ page: h.page, query: h.query || '' }, '', '#' + h.page + (h.query || '')); } catch (error) {}
      }
    }
  });

  window.addEventListener('popstate', function () { render(parseHash(), false); });
  window.addEventListener('hashchange', function () {
    var p = parseHash();
    if (p.page + (p.query || '') !== showing) render(p, false);
  });

  render(parseHash(), false);
})();
</script>
