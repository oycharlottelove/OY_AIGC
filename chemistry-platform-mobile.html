 }\n    },\n    controlState(i) {\n      const s = this.state;\n      if (i === 0) return { on: s.acid, sub: s.acid ? \"已打开 · 滴加浓盐酸\" : \"未打开 · 点击滴加\" };\n      if (i === 1) return { on: s.heat, sub: s.heat ? \"已点燃 · 正在加热\" : \"未点燃 · 点击加热\" };\n      return { on: s.absorb, sub: s.absorb ? \"已打开 · NaOH 吸收\" : \"未打开 · 必须开启\" };\n    },\n    auxState(id) {\n      if (id !== \"remove\") return {};\n      return { on: this.state.removed, label: this.state.removed ? \"导管已撤出\" : \"撤出尾气导管\" };\n    },\n    backflowAccident() {\n      CL.setAccident(this);\n      this.state.heat = false; this.state.backflow = true;\n      this.fx.backflow = 1;\n      for (let i = 0; i \u003c 26; i++) this.fx.sparks.push({ x: 300 + rand(-30, 30), y: 350 + rand(-30, 30), vx: rand(-120, 120), vy: rand(-160, 60), life: 0, max: rand(.4, 1), r: rand(1, 2) });\n      CL.showAlert({\n        title: \"NaOH 溶液倒吸，烧瓶炸裂！\",\n        text: \"先熄灭酒精灯、后撤尾气导管，烧瓶内气体冷却压强减小，NaOH 溶液被倒吸进灼热烧瓶，造成炸裂。\",\n        rule: \"结束操作顺序：先撤尾气导管，后熄灭酒精灯。\",\n        eq: \"倒吸：瓶内压强减小，液体被吸入\",\n        note: \"Cl₂ 有毒，尾气必须用 NaOH 溶液吸收；停止加热前先撤导管，防止倒吸。\"\n      });\n    },\n    update(dt, t) {\n      const s = this.state, fx = this.fx;\n      for (let i = fx.sparks.length - 1; i >= 0; i--) {\n        const p = fx.sparks[i]; p.life += dt; p.vy += 400 * dt; p.x += p.vx * dt; p.y += p.vy * dt;\n        if (p.life >= p.max) fx.sparks.splice(i, 1);\n      }\n      for (let i = fx.leaks.length - 1; i >= 0; i--) {\n        const p = fx.leaks[i]; p.life += dt; p.x += (p.vx + Math.sin(p.life * 2 + p.ph) * 7) * dt; p.y += p.vy * dt;\n        if (p.life >= p.max) fx.leaks.splice(i, 1);\n      }\n      for (let i = fx.microCl2.length - 1; i >= 0; i--) {\n        const p = fx.microCl2[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.age += dt;\n        if (p.x > 750 || p.age > 3) fx.microCl2.splice(i, 1);\n      }\n      for (let i = fx.microAbsorb.length - 1; i >= 0; i--) {\n        const p = fx.microAbsorb[i]; p.age += dt;\n        if (p.age > 1.4) fx.microAbsorb.splice(i, 1);\n      }\n      if (s.accident) return;\n      s.temp = clamp(s.temp + (s.heat ? .45 : -.12) * dt, 0, 1);\n      const producing = s.acid && s.heat;\n      if (producing) {\n        s.progress = Math.min(1, s.progress + dt * .095);\n        if (s.progress >= 1 && !s.done) { s.done = true; CL.toast(\"集气瓶已收集满黄绿色 Cl₂，可用湿润淀粉-KI 试纸验满。\", \"success\"); }\n        if (!s.absorb) {\n          fx.leaks.push({ x: 1060 + rand(-10, 10), y: 310, vx: rand(8, 26), vy: rand(-34, -18), r: rand(14, 26), life: 0, max: rand(1.8, 2.8), ph: rand(0, TAU) });\n        }\n        fx.microSpawn -= dt;\n        if (fx.microSpawn \u003c= 0) {\n          fx.microSpawn = rand(.16, .3);\n          fx.microCl2.push({ x: 300 + rand(-15, 15), y: rand(240, 292), vx: rand(38, 70), vy: rand(-26, -8), age: 0 });\n          if (s.absorb) fx.microAbsorb.push({ x: rand(900, 1090), y: rand(200, 290), age: 0 });\n        }\n      }\n      if (s.progress >= 1 && !s.heat && !s.acid && s.absorb && s.removed && !s.success) {\n        s.success = true;\n        CL.toast(\"操作规范：先撤导管、后熄灯，Cl₂ 尾气已被 NaOH 吸收。\", \"success\");\n      }\n    },\n    meters: [\n      { label: \"尾气吸收\", get() { return this.state.absorb ? 1 : 0; }, text() { return this.state.absorb ? \"已开启\" : \"未开启\"; }, color: \"#a3e635\" },\n      { label: \"烧瓶温度\", get() { return this.state.temp; }, text() { return this.state.temp > .6 ? \"高温\" : this.state.temp > .2 ? \"加热中\" : \"常温\"; } }\n    ],\n    status() {\n      const s = this.state;\n      if (s.accident) return { tone: \"danger\", kicker: \"事故警报\", title: \"NaOH 溶液倒吸，烧瓶炸裂\", desc: \"先熄灯后撤导管导致倒吸。请重置实验并按“先撤导管、后熄灯”操作。\", eq: \"先撤导管 → 后熄灯\" };\n      if (s.acid && s.heat && !s.absorb) return { tone: \"danger\", kicker: \"有毒气体逸散\", title: \"Cl₂ 正在直接逸散\", desc: \"Cl₂ 是黄绿色有毒气体，会刺激呼吸道。请立即打开尾气吸收阀，用 NaOH 溶液吸收。\", eq: \"Cl₂ + 2NaOH → NaCl + NaClO + H₂O\" };\n      if (s.acid && s.heat) return { tone: \"warn\", kicker: \"反应进行中\", title: \"正在制取 Cl₂\", desc: \"烧瓶内出现黄绿色气体，集气瓶逐渐收集满；湿润淀粉-KI 试纸会变蓝。\", eq: \"MnO₂ + 4HCl(浓) —Δ→ MnCl₂ + Cl₂↑ + 2H₂O\" };\n      if (s.progress >= 1) {\n        if (s.success) return { tone: \"success\", kicker: \"实验完成\", title: \"操作规范，实验安全结束\", desc: \"Cl₂ 已收集，尾气被 NaOH 吸收，导管已撤出。\", eq: \"Cl₂ + 2NaOH → NaCl + NaClO + H₂O\" };\n        if (s.heat) return { tone: \"warn\", kicker: \"收集完成\", title: \"先撤尾气导管，再熄灭酒精灯\", desc: \"直接熄灯会导致 NaOH 溶液倒吸。\", eq: \"先撤导管 → 后熄灯\" };\n        if (!s.removed) return { tone: \"warn\", kicker: \"防止倒吸\", title: \"请先撤出尾气导管\", desc: \"导管仍插在 NaOH 溶液中，请先撤出导管。\", eq: \"先撤导管 → 后熄灯\" };\n      }\n      if (s.acid && !s.absorb) return { tone: \"warn\", kicker: \"安全准备\", title: \"尾气吸收尚未打开\", desc: \"在加热产生 Cl₂ 前，先打开尾气吸收阀。\", eq: \"Cl₂ + 2NaOH → NaCl + NaClO + H₂O\" };\n      if (!s.acid && !s.heat) return { tone: \"info\", kicker: \"操作提示\", title: \"准备就绪：先开尾气吸收\", desc: \"打开尾气吸收阀，再滴加浓盐酸并点燃酒精灯。\", eq: \"MnO₂ + 4HCl(浓) —Δ→ MnCl₂ + Cl₂↑ + 2H₂O\" };\n      return { tone: \"info\", kicker: \"进行中\", title: \"正在准备制取 Cl₂\", desc: \"检查尾气吸收后，滴加浓盐酸并加热。\", eq: \"MnO₂ + 4HCl(浓) —Δ→ MnCl₂ + Cl₂↑ + 2H₂O\" };\n    },\n    steps() {\n      const s = this.state;\n      const done = [s.everAbsorb, s.acid && s.heat, s.progress >= 1, s.success];\n      const active = done.findIndex(v => !v);\n      return [\"打开尾气吸收阀\", \"滴加浓盐酸并加热\", \"收集黄绿色 Cl₂，验满\", \"先撤导管，后熄灯\"].map((text, i) => ({ text, done: done[i], active: i === active && !s.accident }));\n    },\n    getLeak() {\n      const s = this.state;\n      if (s.accident) return null;\n      if (s.acid && s.heat && !s.absorb) return { kind: \"chlorine\", tag: \"Cl₂\", title: \"黄绿色有毒气体逸散\", sub: \"Cl₂ 刺激呼吸道，必须用 NaOH 吸收\" };\n      return null;\n    },\n    drawScene(ctx, t) {\n      const s = this.state;\n      if (s.temp > .02) {\n        ctx.save(); ctx.globalCompositeOperation = \"lighter\";\n        const g = ctx.createRadialGradient(255, 370, 4, 255, 370, 210);\n        g.addColorStop(0, `rgba(255,120,40,${s.temp * .12})`); g.addColorStop(1, \"rgba(255,70,20,0)\");\n ,\n    createState() {\n      return {\n        progress: 0, temp: 0, acidAdded: false, heat: false, absorb: false, removed: false,\n        accident: false, accidentKind: \"\", backflow: false, done: false, success: false, shake: 0,\n        everAbsorb: false, everHeat: false, fuchsinHeat: 0\n      };\n    },\n    reset() {\n      this.state = this.createState();\n      this.fx = { leaks: [], sparks: [], steam: [], microSO2: [], microFade: [], microSpawn: 0 };\n    },\n    isLocked() { return this.state.accident; },\n    isReacting() { return this.state.acidAdded && this.state.heat; },\n    microStateText() {\n      if (this.state.accident) return \"装置损坏\";\n      if (this.state.acidAdded && this.state.heat) return \"产生 SO₂\";\n      return \"静止\";\n    },\n    action(i) {\n      const s = this.state;\n      if (s.accident) return;\n      if (i === 0) {\n        if (s.acidAdded) { CL.toast(\"浓硫酸已经加入。\", \"info\"); return; }\n        s.acidAdded = true;\n        CL.toast(s.absorb ? \"浓硫酸已加入，可以点燃酒精灯。\" : \"浓硫酸已加入，但尾气吸收未开！加热会产生有毒 SO₂。\", s.absorb ? \"info\" : \"danger\");\n        return;\n      }\n      if (i === 1) {\n        if (s.heat) {\n          s.heat = false;\n          if (s.absorb && !s.removed && s.progress > .02) { this.backflowAccident(); return; }\n          CL.toast(\"酒精灯已熄灭。\", \"info\");\n        } else {\n          s.heat = true; s.everHeat = true;\n          if (!s.acidAdded) CL.toast(\"还没有加入浓硫酸，加热不会产生 SO₂。\", \"warn\");\n          else if (!s.absorb) CL.toast(\"加热开始，SO₂ 会直接逸散！请立即打开尾气吸收。\", \"danger\");\n          else CL.toast(\"酒精灯已点燃，开始加热铜与浓硫酸。\", \"warn\");\n        }\n        return;\n      }\n      if (i === 2) {\n        s.absorb = !s.absorb;\n        if (s.absorb) { s.everAbsorb = true; CL.toast(\"尾气吸收已打开，SO₂ 被 NaOH 溶液吸收。\", \"success\"); }\n        else if (s.heat && s.acidAdded) CL.toast(\"尾气吸收关闭，有毒 SO₂ 正在逸散！\", \"danger\");\n        else CL.toast(\"尾气吸收已关闭。\", \"warn\");\n      }\n    },\n    auxAction(id) {\n      const s = this.state;\n      if (s.accident) return;\n      if (id === \"remove\") {\n        s.removed = !s.removed;\n        CL.toast(s.removed ? \"导气管已撤出，可以熄灯了。\" : \"导气管重新插入吸收液。\", s.removed ? \"success\" : \"info\");\n      } else if (id === \"fuchsin\") {\n        if (s.progress \u003c .1) { CL.toast(\"还没有观察到明显的品红褪色。\", \"info\"); return; }\n        s.fuchsinHeat = 4;\n        CL.toast(\"加热褪色后的品红溶液，红色逐渐恢复——SO₂ 的漂白是可逆的。\", \"success\");\n      } else if (id === \"water\") {\n        if (s.temp > .2 && s.acidAdded) { this.waterAccident(); return; }\n        CL.toast(\"当前残液温度不高，但稀释浓硫酸仍应慢慢将酸加入水中。\", \"warn\");\n      }\n    },\n    controlState(i) {\n      const s = this.state;\n      if (i === 0) return { on: s.acidAdded, sub: s.acidAdded ? \"已加入 · 浓硫酸\" : \"未加入 · 点击加入\" };\n      if (i === 1) return { on: s.heat, sub: s.heat ? \"已点燃 · 正在加热\" : \"未点燃 · 点击加热\" };\n      return { on: s.absorb, sub: s.absorb ? \"已打开 · NaOH 吸收\" : \"未打开 · 必须开启\" };\n    },\n    auxState(id) {\n      const s = this.state;\n      if (id === \"remove\") return { on: s.removed, label: s.removed ? \"导管已撤出\" : \"撤出导气管\" };\n      if (id === \"fuchsin\") return { on: s.fuchsinHeat > 0, hidden: s.progress \u003c .1 };\n      return { hidden: !(s.heat || s.temp > .15), label: \"向残液加水（危险）\" };\n    },\n    backflowAccident() {\n      CL.setAccident(this);\n      const s = this.state;\n      s.heat = false; s.backflow = true;\n      for (let i = 0; i \u003c 24; i++) this.fx.sparks.push({ x: 300 + rand(-30, 30), y: 360 + rand(-25, 25), vx: rand(-120, 120), vy: rand(-140, 50), life: 0, max: rand(.4, 1), r: rand(1, 2) });\n      CL.showAlert({\n        title: \"吸收液倒吸，烧瓶炸裂！\",\n        text: \"先熄灭酒精灯、后撤导气管，烧瓶内气体冷却收缩，品红/NaOH 溶液倒吸进灼热烧瓶，造成炸裂。\",\n        rule: \"结束操作顺序：先撤导气管，后熄灭酒精灯。\",\n        eq: \"倒吸：瓶内压强减小，液体被吸入\",\n        note: \"加热液体且导管插入吸收液的实验，结束时都要先撤导管再熄灯。\"\n      });\n    },\n    waterAccident() {\n      CL.setAccident(this);\n      this.state.accidentKind = \"water\";\n      this.state.heat = false;\n      this }\n        fx.microSpawn -= dt;\n        if (fx.microSpawn \u003c= 0) {\n          fx.microSpawn = rand(.2, .36);\n          fx.microSO2.push({ x: 290 + rand(-10, 10), y: rand(240, 292), vx: rand(35, 65), vy: rand(-28, -10), age: 0 });\n        }\n      }\n      if (s.progress >= 1 && !s.heat && s.removed && s.absorb && !s.success) {\n        s.success = true;\n        CL.toast(\"操作规范：先撤导管、后熄灯，SO₂ 尾气被 NaOH 吸收。\", \"success\");\n      }\n    },\n    meters: [\n      { label: \"尾气吸收\", get() { return this.state.absorb ? 1 : 0; }, text() { return this.state.absorb ? \"已开启\" : \"未开启\"; }, color: \"#c084fc\" },\n      { label: \"反应温度\", get() { return this.state.temp; }, text() { return this.state.temp > .6 ? \"高温\" : this.state.temp > .2 ? \"加热中\" : \"常温\"; } }\n    ],\n    status() {\n      const s = this.state;\n      if (s.accident) return { tone: \"danger\", kicker: \"事故警报\", title: s.accidentKind === \"water\" ? \"向浓硫酸中加水，酸液飞溅\" : \"吸收液倒吸，烧瓶炸裂\", desc: s.accidentKind === \"water\" ? \"稀释浓硫酸必须把酸加入水中，不能反向。\" : \"先熄灯后撤导管导致倒吸。正确顺序是先撤导管、后熄灯。\", eq: s.accidentKind === \"water\" ? \"浓硫酸溶于水放出大量热\" : \"先撤导管 → 后熄灯\" };\n      if (s.acidAdded && s.heat && !s.absorb) return { tone: \"danger\", kicker: \"有毒气体逸散\", title: \"SO₂ 正在直接逸散\", desc: \"SO₂ 是无色、有刺激性气味的有毒气体，必须用 NaOH 溶液吸收。\", eq: \"SO₂ + 2NaOH → Na₂SO₃ + H₂O\" };\n      if (s.heat && s.acidAdded) return { tone: \"warn\", kicker: \"反应进行中\", title: \"铜与浓硫酸正在反应\", desc: \"铜片表面产生气泡，溶液变蓝，品红溶液逐渐褪色。\", eq: \"Cu + 2H₂SO₄(浓) —Δ→ CuSO₄ + SO₂↑ + 2H₂O\" };\n      if (s.progress >= 1) {\n        if (s.success) return { tone: \"success\", kicker: \"实验完成\", title: \"操作规范，实验安全结束\", desc: \"SO₂ 已被吸收，导气管已撤出，实验结束。\", eq: \"SO₂ + 2NaOH → Na₂SO₃ + H₂O\" };\n        if (s.heat) return { tone: \"warn\", kicker: \"反应完成\", title: \"先撤导气管，再熄灯\", desc: \"直接熄灯会导致吸收液倒吸。\", eq: \"先撤导管 → 后熄灯\" };\n        if (!s.removed) return { tone: \"warn\", kicker: \"防止倒吸\", title: \"请先撤出导气管\", desc: \"导管仍插在吸收液中。\", eq: \"先撤导管 → 后熄灯\" };\n      }\n      if (s.acid       : s.progress;\n      drawFuchsinBottle(ctx, 435, 300, 105, 170, fuchsinFade, t);\n      if (s.fuchsinHeat > 0) {\n        CL.alcoholLamp(ctx, 487, 500, t, false, .52);\n        CL.flame(ctx, 487, 468, 34, 10, t, 5.2, \"orange\");\n      }\n      // NaOH 吸收\n      CL.beaker(ctx, 680, 340, 125, 150, \"#67e8f9\", .58, t);\n      // 气流\n      if (s.acidAdded && s.heat) {\n        CL.flowDots(ctx, [[340, 330], [400, 330], [400, 360], [430, 360]], 2, t, 48, \"rgba(250,235,160,.4)\");\n        CL.flowDots(ctx, [[540, 360], [680, 360], [680, 350], [760, 350]], 2, t, 45, \"rgba(250,235,160,.35)\");\n      }\n      // 泄漏\n      for (const p of this.fx.leaks) {\n        const a = Math.sin(Math.PI * clamp(p.life / p.max, 0, 1)) * .3;\n        const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r * (1 + p.life));\n        g.addColorStop(0, `rgba(225,230,240,${a})`); g.addColorStop(1, \"rgba(160,170,190,0)\");\n        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + p.life), 0, TAU); ctx.fill();\n      }\n      // 倒吸\n      if (s.backflow) {\n        ctx.save();\n        ctx.strokeStyle = \"rgba(245,150,200,.55)\"; ctx.lineWidth = 6; ctx.lineCap = \"round\";\n        ctx.beginPath(); ctx.moveTo(800, 360); ctx.lineTo(860, 360); ctx.lineTo(860, 350); ctx.lineTo(340, 350); ctx.lineTo(340, 330); ctx.stroke();\n        ctx.restore();\n      }\n      // 水花\n      for (const p of this.fx.steam) {\n        const a = Math.sin(Math.PI * p.life / p.max) * .32;\n        const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r * 2);\n        g.addColorStop(0, `rgba(230,240,255,${a})`); g.addColorStop(1, \"rgba(170,190,220,0)\");\n        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2, 0, TAU); ctx.fill();\n      }\n      for (const p of this.fx.sparks) {\n        const a = 1 - p.life / p.max; if (a \u003c= 0) continue;\n        ctx.fillStyle = `rgba(255,210,160,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();\n      }\n er\";\n        ctx.fillText(\"装置已损坏 · 请重置实验\", 600, 200);\n      }\n    }\n  });\n})();\n\n;\n\n/* ============================== 实验 6：钠与水反应 ============================== */\n(function () {\n  \"use strict\";\n  const CL = window.CL, rr = CL.rr, clamp = CL.clamp, rand = CL.rand, TAU = CL.TAU, CN = CL.CN;\n\n  function drawSodium(ctx, x, y, r, t) {\n    const g = ctx.createRadialGradient(x - r * .3, y - r * .35, 1, x, y, r * 1.3);\n    g.addColorStop(0, \"#f7f9fb\"); g.addColorStop(.55, \"#cfd8e2\"); g.addColorStop(1, \"#7d8b9c\");\n    ctx.save();\n    ctx.fillStyle = g;\n    ctx.beginPath(); ctx.ellipse(x, y, r, r * .78, Math.sin(t * 2) * .15, 0, TAU); ctx.fill();\n    ctx.strokeStyle = \"rgba(255,255,255,.45)\"; ctx.lineWidth = 1; ctx.stroke();\n    ctx.restore();\n  }\n\n  CL.register({\n    id: \"na-h2o\",\n    title: \"钠与水反应\",\n    subtitle: \"浮熔游响红 · H₂ 验纯 · 钠火处理\",\n    chapter: \"人教版必修一 · 钠及其化合物\",\n    icon: \"sodium\",\n    accent: \"#fb7185\",\n    cardDesc: \"绿豆大钠块投入水中，浮、熔、游、响、红；大块钠或带煤油会剧烈燃烧。\",\n    tags: [\"钠块大小\", \"H₂ 验纯\", \"钠火用沙\"],\n    sceneTag: \"Na + H₂O · 动态装置\",\n    progressLabel: \"反应进度\",\n    stepsHint: \"安全五步\",\n    safety: \"\u003cstrong>安全先行：\u003c/strong>钠块取绿豆大，用滤纸吸干煤油；钠着火不能用水，应用沙土覆盖。\",\n    micro: {\n      leftTitle: \"钠与水（微观示意）\",\n      rightTitle: \"酚酞与 H₂\",\n      leftEq: \"2Na + 2H₂O → 2NaOH + H₂↑\",\n      rightEq: \"酚酞遇碱变红 · H₂ 验纯后点燃\"\n    },\n    legend: [\n      { label: \"Na\", color: \"#e2e8f0\" }, { label: \"H₂O\", color: \"#f87171\" },\n      { label: \"OH⁻\", color: \"#38bdf8\" }, { label: \"H₂\", color: \"#dbeafe\" }\n    ],\n    controls: [\n      { label: \"取用钠块\", sub: \"未取用 · 取绿豆大钠块\", icon: \"sodium\" },\n      { label: \"投入水中\", sub: \"未投入 · 点击反应\", icon: \"water\", danger: true, tint: \"#fb7185\" },\n      { label: \"点燃收集的 H₂\", sub: \"未点燃 · 需先验纯\", icon: \"flame\", danger: true, tint: \"#ffa34d\" }\n    ],\n    aux: [\n      { id: \"blot\", label: \"用滤纸吸干煤油\" },\n      { id: \"size\", label: \"改用大块钠（危险）\", danger: true },\n      { id: \"water\", label: \"用水灭火（错误）\", danger: true }\n    ],\n    createState() {\n      return {\n        progress: 0, purity: 0, temp: 0, size: \"small\", blotted: false, taken: false,\n        inWater: false, lit: false, fire: false, accident: false, accidentKind: \"\",\n        success: false, shake: 0, everTaken: false, everInWater: false, everLit: false\n      };\n    },\n    reset() {\n      this.state = this.createState();\n      this.fx = {\n        bubbles: [], sparks: [], steam: [], microNa: [], microH2: [], converted: 0,\n        microSites: Array.from({ length: 10 }, (_, i) => ({ x: 340 + (i % 5) * 58, y: 252 + Math.floor(i / 5) * 28, state: 0, flash: 0 })),\n        spawnH2: 0\n      };\n    },\n    isLocked() { return this.state.accident; },\n    isReacting() { return (this.state.inWater && !this.state.fire) || this.state.lit; },\n    microStateText() {\n      if (this.state.accident) return \"事故演示\";\n      if (this.state.fire) return \"钠着火\";\n      if (this.state.inWater) return \"反应中\";\n      return \"静止\";\n    },\n    action(i) {\n      const s = this.state;\n      if (s.accident) return;\n      if (i === 0) {\n        if (s.taken) { CL.toast(\"钠块已经取好。\", \"info\"); return; }\n        s.taken = true; s.everTaken = true;\n        CL.toast(s.blotted ? \"已取绿豆大钠块，煤油已吸干。\" : \"已取钠块，但还没有用滤纸吸干煤油！\", s.blotted ? \"success\" : \"warn\");\n        return;\n      }\n      if (i === 1) {\n        if (s.inWater) { CL.toast(\"钠已经投入水中。\", \"info\"); return; }\n        if (!s.taken) { CL.toast(\"请先取用钠块。\", \"warn\"); return; }\n        s.inWater = true; s.everInWater = true;\n        if (s.size === \"large\" || !s.blotted) {\n          this.igniteSodiumFire();\n          return;\n        }\n        CL.toast(\"钠块浮在水面上，熔成小球、四处游动并发出嘶嘶声，溶液逐渐变红。\", \"warn\");\n        return;\n      }\n      if (i === 2) {\n        if (s.fire) { CL.toast(\"钠正在着火，先处理火灾，不能直接点燃 H₂！\", \"danger\"); return; }\n        if (s.purity \u003c 0.999) { this.popAccident(); return; }\n        s.lit = !s.lit;\n        if (s.lit) { s.everLit = true; CL.toast(\"收集的 H₂ 被点燃，发出淡蓝色火焰。\", \"success\"); }\n        else CL.toast(\"H₂ 火焰已熄灭。\", \"info\");\n      }\n    },\n    auxAction(id) {\n      const s = this.state;\n      if (s.accident) return;\n      if (id === \"blot\") {\n        s.blotted = !s.blotted;\n        CL.toast(s.blotted ? \"已用滤纸吸干钠块表面的煤油。\" : \"钠块表面仍沾有煤油，投入水中会加剧燃烧。\", s.blotted ? \"success\" : \"warn\");\n        return;\n      }\n      if (id === \"size\") {\n        s.size = s.size === \"small\" ? \"large\" : \"small\";\n        CL.toast(s.size === \"large\" ? \"已改用大块钠——这是危险操作！\" : \"已改回绿豆大钠块。\", s.size === \"large\" ? \"danger\" : \"info\");\n        return;\n      }\n      if (id === \"water\" && s.fire) {\n        this.waterAccident();\n      }\n    },\n    controlState(i) {\n      const s = this.state;\n      if (i === 0) return { on: s.taken, sub: s.taken ? \"已取用 · \" + (s.size === \"large\" ? \"大块钠\" : \"绿豆大\") : \"未取用 · 点击取钠\" };\n      if (i === 1) return { on: s.inWater, sub: s.inWater ? (s.fire ? \"钠正在着火！\" : \"已投入 · 反应中\") : \"未投入 · 点击反应\" };\n      return { on: s.lit, sub: s.lit ? \"已点燃 · 淡蓝色火焰\" : \"未点燃 · 需先验纯\" };\n    },\n    auxState(id) {\n      const s = this.state;\n      if (id === \"blot\") return { on: s.blotted, label: s.blotted ? \"煤油已吸干\" : \"用滤纸吸干煤油\" };\n      if (id === \"size\") return { on: s.size === \"large\", label: s.size === \"large\" ? \"改用绿豆大钠\" : \"改用大块钠（危险）\" };\n      return { hidden: !s.fire, label: \"用水灭火（错误）\" };\n    },\n    igniteSodiumFire() {\n      const s = this.state;\n      s.fire = true; s.shake = 10;\n      for (let i = 0; i \u003c 40; i++) this.fx.sparks.push({ x: 565 + rand(-30, 30), y: 330 + rand(-10, 15), vx: rand(-180, 180), vy: rand(-240, 40), life: 0, max: rand(.5, 1.4), r: rand(1, 2.8) });\n      CL.toast(\"危险：钠块过大或未吸干煤油，反应过于剧烈，钠着火燃烧！\", \"danger\");\n    },\n    popAccident() {\n      CL.setAccident(this);\n      const s = this.state;\n      s.fire = false; s.lit = false;\n      for (let i = 0; i \u003c 50; i++) this.fx.sparks.push({ x: 565 + rand(-20, 20), y: 310 + rand(-20, 20), vx: rand(-260, 260), vy: rand(-320, 80), life: 0, max: rand(.4, 1.1), r: rand(1, 2.6) });\n      CL.showAlert({\n        title: \"H₂ 不纯，点燃发生爆鸣！\",\n        text: \"没有验纯就点燃了收集的 H₂，H₂ 与空气的混合气体发生爆鸣/爆炸。\",\n        rule: \"点燃 H₂ 前必须先验纯；尖锐爆鸣声说明气体不纯。\",\n        eq: \"2H₂ + O₂ —点燃→ 2H₂O\",\n        note: \"钠与水反应产生的 H₂ 中可能混有空气，收集后应先验纯。\"\n      });\n    },\n    waterAccident() {\n      CL.setAccident(this);\n      const s = this.state;\n      s.fire = false; s.accidentKind = \"water\"; s.shake = 16;\n      for (let i = 0; i \u003c 70; i++) this.fx.steam.push({ x: 565 + rand(-30, 30), y: 320 + rand(-15, 25), vx: rand(-160, 160), vy: rand(-260, -50), life: 0, max: rand(.6, 1.7), r: rand(5, 15) });\n      CL.showAlert({\n        title: \"向燃烧的钠上浇水，火势更猛！\",\n        text: \"钠着火时用水灭火，钠与水剧烈反应生成 H₂ 并放热，H₂ 被点燃，造成更猛烈的燃烧和飞溅。\",\n        rule: \"钠着火不能用水，应立即用沙土覆盖。\",\n        eq: \"2Na + 2H₂O → 2NaOH + H₂↑（放热）\",\n        note: \"钠着火时，水会提供反应物并放出大量热，使氢气燃烧甚至爆炸。\"\n      });\n    },\n    update(dt, t) {\n      const s = this.state, fx = this.fx;\n      for (let i = fx.sparks.length - 1; i >= 0; i--) {\n        const p = fx.sparks[i]; p.life += dt; p.vy += 360 * dt; p.x += p.vx * dt; p.y += p.vy * dt;\n        if (p.life >= p.max) fx.sparks.splice(i, 1);\n      }\n      for (let i = fx.steam.length - 1; i >= 0; i--) {\n        const p = fx.steam[i]; p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;\n        if (p.life >= p.max) fx.steam.splice(i, 1);\n      }\n      for (let i = fx.bubbles.length - 1; i >= 0; i--) {\n        const b = fx.bubbles[i]; b.life += dt; b.y -= b.vy * dt; b.x += Math.sin(b.life * 5 + b.ph) * 7 * dt;\n        if (b.y \u003c 315) fx.bubbles.splice(i, 1);\n      }\n      for (let i = fx.microH2.length - 1; i >= 0; i--) {\n        const p = fx.microH2[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.age += dt;\n        if (p.x > 750 || p.age > 3) fx.microH2.splice(i, 1);\n      }\n      if (s.accident) return;\n      if (s.inWater && !s.fire) {\n        s.progress = Math.min(1, s.progress + dt * .11);\n        s.purity = Math.min(1, s.purity + dt / 2.8);\n        s.temp = Math.min(1, s.temp + dt * .2);\n        if (s.progress >= 1 && s.lit && !s.success) {\n          s.success = true;\n          CL.toast(\"实验完成：钠完全消失，溶液变红，H₂ 燃烧呈淡蓝色火焰。\", \"success\");\n        }\n        fx.spawnH2 -= dt;\n        if (fx.spawnH2 \u003c= 0) {\n          fx.spawnH2 = rand(.12, .24);\n          if (fx.bubbles.length \u003c 22) fx.bubbles.push({ x: 540 + rand(-55, 55), y: 340 + rand(-6, 4), r: rand(2, 5), vy: rand(24, 48), life: 0, ph: rand(0, TAU) });\n        }\n        // 微观\n        const target = Math.round(s.progress * fx.microSites.length);\n        while (fx.converted \u003c target) {\n          const site = fx.microSites[fx.converted]; if (!site) break;\n          site.state = 1; site.flash = 1; fx.converted++;\n          fx.microH2.push({ x: site.x + rand(-6, 6), y: site.y - 4, vx: rand(24, 48), vy: rand(-35, -12), age: 0 });\n        }\n        while (fx.converted > target) {\n          fx.converted--; const site = fx.microSites[fx.converted]; if (!site) { fx.converted = 0; break; }\n          site.state = 0; site.flash = 1;\n        }\n      }\n      for (const site of fx.microSites) if (site.flash > 0) site.flash = Math.max(0, site.flash - dt * 2.2);\n    },\n    meters: [\n      { label: \"H₂ 验纯\", get() { return this.state.purity; }, text() { return this.state.purity >= .999 ? \"已验纯\" : Math.round(this.state.purity * 100) + \"%\"; }, color: \"#fb7185\" },\n      { label: \"溶液温度\", get() { return this.state.temp; }, text() { return this.state.temp > .6 ? \"明显放热\" : this.state.temp > .15 ? \"温热\" : \"常温\"; } }\n    ],\n    status() {\n      const s = this.state;\n      if (s.accident) return { tone: \"danger\", kicker: \"事故警报\", title: s.accidentKind === \"water\" ? \"钠着火用水，火势更猛\" : \"H₂ 不纯，点燃爆鸣\", desc: s.accidentKind === \"water\" ? \"钠着火不能用水，应用沙土覆盖。\" : \"点燃 H₂ 前必须验纯，否则会爆鸣甚至爆炸。\", eq: s.accidentKind === \"water\" ? \"2Na + 2H₂O → 2NaOH + H₂↑\" : \"2H₂ + O₂ —点燃→ 2H₂O\" };\n      if (s.fire) return { tone: \"danger\", kicker: \"钠着火\", title: \"钠正在燃烧，不能用水！\", desc: \"钠块过大或未吸干煤油导致剧烈燃烧。应立即用沙土覆盖，不能用水灭火。\", eq: \"2Na + 2H₂O → 2NaOH + H₂↑（放热）\" };\n      if (s.inWater) {\n        if (s.progress >= 1) {\n          if (s.lit) return { tone: \"success\", kicker: \"实验完成\", title: \"钠与水反应完成，H₂ 已点燃\", desc: \"溶液变红，钠完全消失，H₂ 燃烧呈淡蓝色火焰。\", eq: \"2Na + 2H₂O → 2NaOH + H₂↑\" };\n          return { tone: \"warn\", kicker: \"反应完成\", title: \"可验纯后点燃收集的 H₂\", desc: \"H₂ 已收集，验纯达到 100% 后可点燃。\", eq: \"2Na + 2H₂O → 2NaOH + H₂↑\" };\n        }\n        return { tone: \"warn\", kicker: \"反应进行中\", title: \"钠在水面上剧烈反应\", desc: \"浮、熔、游、响、红；溶液碱性增强，酚酞变红。\", eq: \"2Na + 2H₂O → 2NaOH + H₂↑\" };\n      }\n      if (s.taken && !s.blotted) return { tone: \"warn\", kicker: \"安全准备\", title: \"请先用滤纸吸干钠块表面的煤油\", desc: \"带煤油的钠块投入水中会加剧燃烧，必须先吸干。\", eq: \"2Na + 2H₂O → 2NaOH + H₂↑\" };\n      if (s.taken && s.size === \"large\") return { tone: \"danger\", kicker: \"危险操作\", title: \"大块钠非常危险\", desc: \"请改用绿豆大钠块，否则投入水中可能剧烈燃烧甚至爆炸。\", eq: \"2Na + 2H₂O → 2NaOH + H₂↑\" };\n      if (s.taken) return { tone: \"success\", kicker: \"钠块已取好\", title: \"可以投入水中\", desc: \"确认钠块为绿豆大且煤油已吸干，再投入水中。\", eq: \"2Na + 2H₂O → 2NaOH + H₂↑\" };\n      return { tone: \"info\", kicker: \"操作提示\", title: \"准备就绪：先取绿豆大钠块\", desc: \"用镊子取钠，滤纸吸干煤油，再投入水中；切勿用手接触钠。\", eq: \"2Na + 2H₂O → 2NaOH + H₂↑\" };\n    },\n    steps() {\n      const s = this.state;\n      const done = [s.everTaken && s.blotted && s.size === \"small\", s.everInWater, s.progress >= 1, s.everLit, s.success];\n      const active = done.findIndex(v => !v);\n      return [\"取绿豆大钠块，吸干煤油\", \"投入水中，观察浮熔游响红\", \"收集并验纯 H₂\", \"点燃 H₂，淡蓝色火焰\", \"清理实验台\"].map((text, i) => ({ text, done: done[i], active: i === active && !s.accident }));\n    },\n    getLeak() {\n      const s = this.state;\n      if (s.accident) return null;\n      if (s.fire) return { kind: \"flammable\", tag: \"Na\", title: \"钠着火，火势猛烈\", sub: \"不能用水！应用沙土覆盖\" };\n      return null;\n    },\n    drawScene(ctx, t) {\n      const s = this.state;\n      // 桌面玻璃片/镊子\n      ctx.save();\n      ctx.fillStyle = \"rgba(180,220,245,.1)\"; rr(ctx, 180, 430, 150, 52, 8); ctx.fill();\n      ctx.strokeStyle = \"rgba(190,230,255,.35)\"; ctx.lineWidth = 1.4; ctx.stroke();\n      if (s.taken && !s.inWater) {\n        drawSodium(ctx, 225, 452, s.size === \"large\" ? 13 : 7, t);\n        ctx.strokeStyle = \"#9aabbd\"; ctx.lineWidth = 3; ctx.lineCap = \"round\";\n        ctx.beginPath(); ctx.moveTo(250, 440); ctx.lineTo(290, 415); ctx.stroke();\n        ctx.beginPath(); ctx.moveTo(250, 440); ctx.lineTo(246, 452); ctx.stroke();\n      }\n      ctx.restore();\n      // 烧杯\n      const beakerX = 420, beakerY = 300, bw = 300, bh = 200;\n      ctx.save();\n      const pink = CL.mix([120, 190, 230], [244, 63, 94], s.progress);\n      CL.beaker(ctx, beakerX, beakerY, bw, bh, CL.rgb(pink), .72, t);\n      ctx.save(); rr(ctx, beakerX + 2, beakerY + 2, bw - 4, bh - 4, 11); ctx.clip();\n      // 水面\n      const surface = beakerY + bh * .28;\n      ctx.strokeStyle = \"rgba(225,250,255,.5)\"; ctx.lineWidth = 1.4;\n      ctx.beginPath(); ctx.moveTo(beakerX + 4, surface); ctx.lineTo(beakerX + bw - 4, surface); ctx.stroke();\n      if (s.inWater && !s.accident) {\n        const r = s.size === \"large\" ? 15 : Math.max(2, 8 * (1 - s.progress * .9));\n        const x = 565 + Math.sin(t * 2.2) * 75;\n        drawSodium(ctx, x, surface - 3, r, t);\n        // 气泡\n        for (const b of this.fx.bubbles) {\n          ctx.strokeStyle = \"rgba(235,252,255,.6)\"; ctx.fillStyle = \"rgba(255,255,255,.08)\";\n          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();\n        }\n      }\n      ctx.restore();\n      // 火焰\n      if (s.fire) {\n        for (let i = 0; i \u003c 7; i++) {\n          const fx = 500 + i * 22 + Ma t; p.vy += 380 * dt; p.x += p.vx * dt; p.y += p.vy * dt;\n        if (p.life >= p.max) fx.sparks.splice(i, 1);\n      }\n      for (let i = fx.microNO.length - 1; i >= 0; i--) {\n        const p = fx.microNO[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.age += dt;\n        if (p.x > 750 || p.age > 3) fx.microNO.splice(i, 1);\n      }\n      for (let i = fx.microNO2.length - 1; i >= 0; i--) {\n        const p = fx.microNO2[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.age += dt;\n        if (p.x > 750 || p.age > 3.4) fx.microNO2.splice(i, 1);\n      }\n      for (let i = fx.microAbsorb.length - 1; i >= 0; i--) {\n        const p = fx.microAbsorb[i]; p.age += dt; if (p.age > 1.6) fx.microAbsorb.splice(i, 1);\n      }\n      if (s.accident) return;\n      if (s.concOpen) {\n        s.concProgress = Math.min(1, s.concProgress + dt * .11);\n        fx.spawnGas -= dt;\n        if (fx.spawnGas \u003c= 0) {\n          fx.spawnGas = rand(.18, .3);\n          fx.microNO2.push({ x: 300 + rand(-10, 10), y: rand(230, 290), vx: rand(36, 66), vy: rand(-30, -8), age: 0 });\n        }\n      }\n      if (s.dilOpen) {\n        s.dilProgress = Math.min(1, s.dilProgress + dt * .075);\n        fx.spawnGas -= dt;\n        if (fx.spawnGas \u003c= 0) {\n          fx.spawnGas = rand(.2, .35);\n          fx.microNO.push({ x: 300 + rand(-10, 10), y: rand(230, 290), vx: rand(36, 66), vy: rand(-30, -8), age: 0 });\n          if (s.absorb) fx.microAbsorb.push({ x: rand(900, 1090), y: rand(210, 295), age: 0 });\n        }\n      }\n      s.progress = Math.max(s.concProgress, s.dilProgress);\n      s.temp = clamp(s.temp + ((s.concOpen || s.dilOpen) ? .06 : -.05) * dt, 0, .5);\n      const leak = (s.concOpen || s.dilOpen) && (!s.absorb || s.opened);\n      if (leak) {\n        const source = s.opened ? 600 : 1000;\n        fx.leaks.push({ x: source + rand(-14, 14), y: source === 600 ? 260 : 330, vx: rand(8, 24), vy: rand(-32, -16), r: rand(12, 24), life: 0, max: rand(1.8, 2.8), ph: rand(0, TAU) });\n      }\n      if (s.concProgress >= .8 && s.dilProgress >= .8 && s.absorb && !s.opened && !s.success) {\n        s.success = true;\n        CL.toast(\"实验完成：浓硝酸中产生红棕色 NO₂，稀硝酸中产生无色 NO；尾气已被吸收。\", \"success\");\n      }\n    },\n    meters: [\n      { label: \"尾气吸收\", get() { return this.state.absorb ? 1 : 0; }, text() { return this.state.absorb ? \"已开启\" : \"未开启\"; }, color: \"#f59e0b\" },\n      { label: \"NO₂ 浓度\", get() { return this.state.concProgress; }, text() { return this.state.concProgress > .6 ? \"高\" : this.state.concProgress > .1 ? \"升高\" : \"低\"; } }\n    ],\n    status() {\n      const s = this.state;\n      if (s.accident) return { tone: \"danger\", kicker: \"事故警报\", title: \"酸液飞溅，造成腐蚀灼伤\", desc: \"浓硝酸、稀硝酸具有强腐蚀性，取用时必须戴护目镜和手套，缓慢加入。\", eq: \"浓硝酸、稀硝酸均具有强腐蚀性\" };\n      if ((s.concOpen || s.dilOpen) && (!s.absorb || s.opened)) return { tone: \"danger\", kicker: \"有毒气体逸散\", title: s.opened ? \"试管已打开，氮氧化物逸出\" : \"NO / NO₂ 正在直接逸散\", desc: \"NO₂ 是红棕色有毒气体，NO 无色但遇空气会变为 NO₂；必须用 NaOH 吸收尾气并塞好试管。\", eq: \"2NO + O₂ → 2NO₂\" };\n      if (s.success) return { tone: \"success\", kicker: \"实验完成\", title: \"两种硝酸与铜的反应对比完成\", desc: \"尾气已被 NaOH 吸收，试管保持塞紧。\", eq: \"3Cu + 8HNO₃(稀) → 3Cu(NO₃)₂ + 2NO↑ + 4H₂O\" };\n      if (s.concOpen || s.dilOpen) return { tone: \"warn\", kicker: \"对比实验\", title: \"铜与硝酸正在反应\", desc: \"浓硝酸中产生红棕色 NO₂，稀硝酸中产生无色 NO，溶液均变蓝。\", eq: \"Cu + 4HNO₃(浓) → Cu(NO₃)₂ + 2NO₂↑ + 2H₂O\" };\n      if (!s.absorb) return { tone: \"info\", kicker: \"安全准备\", title: \"请先打开尾气吸收阀\", desc: \"NO、NO₂ 都有毒，必须先开启尾气吸收，再加入硝酸。\", eq: \"2NO₂ + 2NaOH → NaNO₂ + NaNO₃ + H₂O\" };\n      return { tone: \"success\", kicker: \"准备就绪\", title: \"尾气吸收已开启，可以加入硝酸\", desc: \"分别打开浓硝酸阀和稀硝酸阀，对比两种气体的颜色。\", eq: \"Cu + 4HNO₃(浓) → Cu(NO₃)₂ + 2NO₂↑ + 2H₂O\" };\n    },\n    steps() {\n      const s = this.state;\n      const done = [s.everAbsorb, s.concProgress > .2, s.dilProgress > .2, s.success];\n      const active = done.findIndex(v => !v);\n      return [\"打开尾气吸收阀\", \"打开浓硝酸阀，观察红棕色 NO₂\", \"打开稀硝酸阀，观察无色 NO\", \"对比现象，保持尾气吸收\"].map((text, i) => ({ text, done: done[i], active: i === active && !s.accident }));\n    },\n    getLeak() {\n      const s = this.state;\n      if (s.accident) return null;\n      if ((s.concOpen || s.dilOpen) && (!s.absorb || s.opened)) return { kind: \"nox\", tag: s.opened ? \"NOx\" : \"NO₂\", title: \"氮氧化物有毒气体逸散\", sub: \"NO₂ 红棕色、NO 无色，均须 NaOH 吸收\" };\n      return null;\n    },\n    drawScene(ctx, t) {\n      const s = this.state;\n      // 试管架\n      ctx.save();\n      ctx.fillStyle = \"#3a4a5d\"; rr(ctx, 300, 448, 350, 12, 4); ctx.fill();\n      ctx.fillStyle = \"#51657b\"; ctx.fillRect(310, 458, 10, 38); ctx.fillRect(630, 458, 10, 38);\n      ctx.fillStyle = \"#3a4a5d\"; rr(ctx, 300, 492, 350, 8, 3); ctx.fill();\n      ctx.restore();\n      drawDropper(ctx, 390, 160, \"浓硝酸\", \"#e0c26a\", s.concOpen);\n      drawDropper(ctx, 565, 160, \"稀硝酸\", \"#bfe3ff\", s.dilOpen);\n      drawTestTube(ctx, 345, 235, 90, 220, \"#5aa7e8\", .55, true, s.concProgress, t);\n      drawTestTube(ctx, 520, 235, 90, 220, \"#6bb8e8\", .6, false, s.dilProgress, t);\n      // 试管塞\n      if (!s.opened) {\n        ctx.fillStyle = \"#3b4b60\"; rr(ctx, 373, 229, 34, 10, 3); ctx.fill();\n        rr(ctx, 548, 229, 34, 10, 3); ctx.fill();\n      } else {\n        ctx.save();\n        ctx.translate(410, 238); ctx.rotate(-.7);\n        ctx.fillStyle = \"#3b4b60\"; rr(ctx, -16, -5, 32, 10, 3); ctx.fill();\n        ctx.restore();\n        ctx.save(); ctx.globalCompositeOperation = \"lighter\";\n        const g = ctx.createRadialGradient(390, 240, 4, 390, 240, 90);\n        g.addColorStop(0, \"rgba(180,80,40,.2)\"); g.addColorStop(1, \"rgba(120,50,25,0)\");\n        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(390, 240, 90, 0, TAU); ctx.fill(); ctx.restore();\n      }\n      // 稀硝酸管口 NO→NO2\n      if (s.dilProgress > .08) {\n        ctx.save(); ctx.globalCompositeOperation = \"lighter\";\n        const g = ctx.createRadialGradient(565, 235, 2, 565, 235, 40);\n        g.addColorStop(0, `rgba(185,85,40,${.12 + s.dilProgress * .18})`); g.addColorStop(1, \"rgba(120,50,25,0)\");\n        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(565, 235, 40, 0, TAU); ctx.fill(); ctx.restore();\n      }\n      // 导管与吸收\n      CL.pipe(ctx, [[410, 240], [410, 212], [700, 212], [700, 360], [820, 360]], \"#31455f\", \"#08111f\", 8, 5);\n      CL.pipe(ctx, [[585, 240], [585, 212], [700, 212]], \"#31455f\", \"#08111f\", 8, 5);\n      CL.beaker(ctx, 800, 340, 150, 150, \"#67e8f9\", .55, t);\n      if (s.absorb && (s.concOpen || s.dilOpen)) {\n        for (let i = 0; i \u003c 8; i++) {\n          const bx = 820 + (i * 17) % 100, by = 460 - ((t * 38 + i * 13) % 65);\n          ctx.strokeStyle = \"rgba(235,250,255,.4)\"; ctx.lineWidth = 1;\n          ctx.beginPath(); ctx.arc(bx, by, 2 + i % 2, 0, TAU); ctx.stroke();\n        }\n      }\n      if (s.concOpen) CL.flowDots(ctx, [[410, 240], [410, 212], [700, 212], [700, 360], [820, 360]], 3, t, 42, \"rgba(190,90,50,.5)\");\n      if (s.dilOpen) CL.flowDots(ctx, [[585, 240], [585, 212], [700, 212]], 2, t, 38, \"rgba(170,190,210,.4)\");\n      // 泄漏\n      for (const p of this.fx.leaks) {\n        const a = Math.sin(Math.PI * clamp(p.life / p.max, 0, 1)) * .32;\n        const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r * (1 + p.life));\n        g.addColorStop(0, `rgba(190,90,45,${a})`); g.addColorStop(1, \"rgba(120,45,25,0)\");\n        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + p.life), 0, TAU); ctx.fill();\n      }\n      for (const p of this.fx.sparks) {\n        const a = 1 - p.life / p.max; if (a \u003c= 0) continue;\n        ctx.fillStyle = `rgba(255,220,160,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();\n      }\n      CL.label(ctx, \"浓硝酸\", 390, 190, 390, 235, \"#e7d39a\", \"center\");\n      CL.label(ctx, \"稀硝酸\", 565, 190, 565, 235, \"#b9ddff\", \"center\");\n      CL.label(ctx, \"铜片\", 490, 452, 450, 438, \"#e0a16d\", \"center\");\n      CL.label(ctx, \"NaOH 尾气吸收\", 875, 536, 875, 470, \"#8ed8ff\", \"center\");\n      if (s.accident) {\n        ctx.fillStyle = \"rgba(40,4,10,.38)\"; ctx.fillRect(0, 0, 1200, 560);\n        ctx.font = `700 22px ${CN}`; ctx.fillStyle = \"rgba(255,170,180,.9)\"; ctx.textAlign = \"center\";\n        ctx.fillText(\"酸液飞溅 · 腐蚀灼伤\", 600, 100);\n      }\n    },\n    drawMicro(ctx, t) {\n      const s = this.state, fx = this.fx;\n      ctx.save();\n      rr(ctx, 30, 88, 722, 236, 20); ctx.clip();\n      for (let i = 0; i \u003c 8; i++) {\n        const x = 320 + (i % 4) * 58, y = 258 + Math.floor(i / 4) * 28;\n        CL.atom(ctx, x, y, 6, \"#d99a62\", \"#8a4b22\");\n      }\n      for (const p of fx.microNO2) CL.mol(ctx, \"NO2\", p.x, p.y, .95);\n      for (const p of fx.microNO) CL.mol(ctx, \"NO\", p.x, p.y, .95);\n      ctx.save(); ctx.font = `10.5px ${CN}`; ctx.fillStyle = \"rgba(250,190,140,.5)\";\n      ctx.fillText(\"NO₂ / NO 生成\", 40, 112); ctx.fillText(\"导出\", 690, 112); ctx.restore();\n      ctx.restore();\n      // 右：NO → NO2\n      ctx.save();\n      rr(ctx, 786, 46, 394, 300, 14); ctx.clip();\n      // 左试管无色 NO\n      ctx.strokeStyle = \"rgba(190,220,245,.4)\"; ctx.lineWidth = 2;\n      rr(ctx, 820, 140, 55, 150, 22); ctx.stroke();\n      CL.mol(ctx, \"NO\", 847, 200, 1);\n      CL.mol(ctx, \"NO\", 847, 240, 1);\n      // 右试管红棕 NO2\n      rr(ctx, 980, 140, 55, 150, 22); ctx.stroke();\n      ctx.fillStyle = `rgba(180,70,35,${.15 + s.concProgress * .35})`; rr(ctx, 981, 141, 53, 148, 21); ctx.fill();\n      CL.mol(ctx, \"NO2\", 1007, 200, 1);\n      CL.mol(ctx, \"NO2\", 1007, 240, 1);\n      // 箭头\n      ctx.strokeStyle = \"rgba(255,200,150,.5)\"; ctx.lineWidth = 2;\n      ctx.beginPath(); ctx.moveTo(890, 215); ctx.lineTo(960, 215); ctx.stroke();\n      ctx.beginPath(); ctx.moveTo(952, 209); ctx.lineTo(960, 215); ctx.lineTo(952, 221); ctx.stroke();\n      ctx.font = `10px ${CN}`; ctx.fillStyle = \"rgba(190,210,235,.7)\"; ctx.textAlign = \"center\";\n      ctx.fillText(\"O₂\", 925, 198);\n      ctx.fillStyle = \"rgba(180,210,240,.7)\"; ctx.fillText(\"无色 NO\", 847, 315);\n      ctx.fillStyle = \"rgba(255,180,140,.8)\"; ctx.fillText(\"红棕色 NO₂\", 1007, 315);\n      ctx.restore();\n      if (s.accident) {\n        ctx.fillStyle = \"rgba(30,2,8,.48)\"; ctx.fillRect(0, 0, 1200, 380);\n        ctx.font = `600 18px ${CN}`; ctx.fillStyle = \"rgba(255,190,198,.9)\"; ctx.textAlign = \"center\";\n        ctx.fillText(\"事故演示 · 请重置实验\", 600, 200);\n      }\n    }\n  });\n})();\n\n;\n\nwindow.addEventListener(\"DOMContentLoaded\", function () {\n  if (window.CL && window.CL.init) window.CL.init();\n});\n"},"after-school-service.html":{"page":"after-school-service.html","title":"课后答疑助手 · 知行化学","bodyClass":"","body":"\n  \u003ca class=\"skip-link\" href=\"#main\">跳到主要内容\u003c/a>\n  \u003cdiv id=\"site-header\">\u003c/div>\n\n  \u003cmain class=\"page-shell\" id=\"main\">\n    \u003csection class=\"placeholder-hero qa-hero\" data-number=\"04\">\n      \u003cspan class=\"eyebrow\">课后服务 · 已上线\u003c/span>\n      \u003ch1>课后答疑助手\u003c/h1>\n      \u003cp>不直接给答案，先陪你想一步。把题干、关键数据或题目照片交给助手，它会先拆成 3—6 个可思考的步骤：先给方向，再给原理，最后才展开规范解析。弄懂一步，再进入下一步；最后用一道靶向变式检验是否真的掌握。\u003c/p>\n      \u003cdiv class=\"qa-hero-tags\">\n        \u003cspan>步进式脚手架\u003c/span>\u003cspan>多模态识题\u003c/span>\u003cspan>演示可用\u003c/span>\u003cspan>独立思考率\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"form-actions\">\n        \u003ca class=\"btn btn-primary\" href=\"#qa-compose\">开始拆解一道题\u003c/a>\n        \u003ca class=\"btn btn-secondary\" href=\"settings.html\" id=\"modelSettingsCta\">配置模型\u003c/a>\n        \u003ca class=\"btn btn-ghost\" href=\"teacher-homework.html\" id=\"homeworkCta\">作业与评价\u003c/a>\n      \u003c/div>\n      \u003cp class=\"qa-hero-note\">未配置 API Key 也能完整体验：系统会自动使用内置示例题，所有按钮都可点通。步进式脚手架思路参考同学作品「循迹·化析」，界面、代码与数据结构已按本平台重写。\u003c/p>\n    \u003c/section>\n\n    \u003cdiv class=\"qa-grid section\">\n      \u003cdiv class=\"stack\">\n        \u003csection class=\"card qa-compose\" id=\"qa-compose\">\n          \u003cdiv class=\"card-header\">\n            \u003cdiv>\u003ch2>把题目交给助手\u003c/h2>\u003cp>支持文字、图片或两者一起；助手先拆步骤，再逐层给提示。\u003c/p>\u003c/div>\n            \u003cspan class=\"tag tag-amber\" id=\"qaModelBadge\">演示模式\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"card-body stack-sm\">\n            \u003cdiv class=\"field\">\n              \u003clabel>题型\u003c/label>\n              \u003cdiv class=\"mode-tabs\" id=\"modeTabs\" aria-label=\"选择题型\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"qaText\">题目文本\u003c/label>\n              \u003ctextarea class=\"input qa-textarea\" id=\"qaText\" maxlength=\"6000\" placeholder=\"把题干、已知条件和你卡住的地方贴在这里。例如：在 2 L 密闭容器中充入 2 mol SO₂ 和 1 mol O₂……\">\u003c/textarea>\n              \u003cspan class=\"field-hint\">不需要抄完整试卷；题干、关键数据和你已经想到的一步就够。手写识别不确定处，助手会标【识别存疑：xxx】。\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel>题目图片\u003c/label>\n              \u003cdiv class=\"qa-drop\" id=\"qaDrop\" role=\"button\" tabindex=\"0\" aria-label=\"上传题目图片\">\n                \u003cdiv class=\"qa-drop-icon\">＋\u003c/div>\n                \u003cstrong>拖入图片，或点击选择\u003c/strong>\n                \u003cspan>JPG / PNG / WebP / GIF，最多 4 张；PDF 请先截图或导出为图片\u003c/span>\n                \u003cinput type=\"file\" id=\"qaFile\" accept=\"image/jpeg,image/png,image/webp,image/gif,application/pdf\" multiple hidden>\n              \u003c/div>\n              \u003cdiv class=\"qa-thumbs\" id=\"qaThumbs\" hidden>\u003c/div>\n              \u003cspan class=\"field-hint\">图片会压缩后随题目一起发送；未配置 Key 时不会真正识图，页面会明确提示。\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"qa-example-row\">\n              \u003cspan>没有题目？载入示例：\u003c/span>\n              \u003cbutton type=\"button\" class=\"qa-example\" data-example=\"lithium\">锂电池回收\u003c/button>\n              \u003cbutton type=\"button\" class=\"qa-example\" data-example=\"organic\">有机合成\u003c/button>\n              \u003cbutton type=\"button\" class=\"qa-example\" data-example=\"equilibrium\">SO₂ 平衡\u003c/button>\n              \u003cbutton type=\"button\" class=\"qa-example\" data-example=\"carbonate\">混合物计算\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"form-actions\">\n              \u003cbutton class=\"btn btn-primary\" type=\"button\" id=\"qaAnalyze\">开始拆解\u003c/button>\n              \u003cbutton class=\"btn btn-ghost\" type=\"button\" id=\"qaReset\">清空\u003c/button>\n              \u003cspan class=\"small muted\" id=\"qaInline\">\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"alert alert-info qa-privacy\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>先想一步，再看解析：\u003c/strong>助手不会把最终答案放在第一屏。每一关先给方向，再给原理，最后才展开规范解析。请先写下你的思路，再点“提交思路，请 AI 点评”。\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003cdiv id=\"qaStatus\" hidden>\u003c/div>\n\n        \u003csection class=\"card qa-welcome\" id=\"qaWelcome\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>怎么用\u003c/h2>\u003cp>把一次“看答案”变成一次真正的思考练习。\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cdiv class=\"qa-steps\">\n              \u003cdiv class=\"qa-step\">\u003cb>01\u003c/b>\u003cdiv>\u003cstrong>先描述卡点\u003c/strong>\u003cp>贴题干或上传图片，选一个题型；如果不知道题型，就选“自动识别”。\u003c/p>\u003c/div>\u003c/div>\n              \u003cdiv class=\"qa-step\">\u003cb>02\u003c/b>\u003cdiv>\u003cstrong>逐层要提示\u003c/strong>\u003cp>先自己写一句思路，再点“看方向提示”；还不够，再点“看关键原理”。\u003c/p>\u003c/div>\u003c/div>\n              \u003cdiv class=\"qa-step\">\u003cb>03\u003c/b>\u003cdiv>\u003cstrong>讲明白再变式\u003c/strong>\u003cp>点“我讲明白了”记录掌握；全部走完后生成一道靶向变式，检验能否迁移。\u003c/p>\u003c/div>\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"alert alert-info\" style=\"margin:0;\">\u003cspan class=\"alert-icon\">i\u003c/span>\u003cdiv>\u003cstrong>演示说明：\u003c/strong>没有填写 API Key 时，助手会使用 4 道内置示例题演示完整流程，不会假装识别了你上传的图片。配置 Key 后，才会把文字与图片发送给你选择的模型。\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card qa-result\" id=\"qaResult\" hidden>\n          \u003cdiv class=\"card-header qa-result-head\">\n            \u003cdiv>\n              \u003cdiv class=\"qa-meta-line\">\u003cspan class=\"tag\" id=\"qaModeTag\">题型\u003c/span>\u003cspan class=\"tag tag-amber\" id=\"qaDemoTag\">演示示例\u003c/span>\u003c/div>\n              \u003ch2 id=\"qaTitle\">题目拆解\u003c/h2>\n              \u003cp id=\"qaGoal\">\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"qa-result-side\">\n              \u003cspan class=\"qa-progress-label\" id=\"qaProgressLabel\">0 / 0 步\u003c/span>\n              \u003ca class=\"btn btn-ghost btn-sm\" href=\"#qa-compose\">换一道题\u003c/a>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cdiv class=\"qa-tags\" id=\"qaTags\">\u003c/div>\n            \u003cdiv class=\"qa-progress\">\n              \u003cdiv class=\"qa-progress-top\">\u003cspan>独立思考率\u003c/span>\u003cstrong id=\"qaRate\">0%\u003c/strong>\u003c/div>\n              \u003cdiv class=\"qa-meter\" aria-hidden=\"true\">\u003cspan id=\"qaMeter\">\u003c/span>\u003c/div>\n              \u003cdiv class=\"qa-progress-foot\">\n                \u003cspan>已掌握 \u003cb id=\"qaMastered\">0\u003c/b>\u003c/span>\n                \u003cspan>提示 \u003cb id=\"qaHintCount\">0\u003c/b>\u003c/span>\n                \u003cspan>思路 \u003cb id=\"qaThoughtCount\">0\u003c/b>\u003c/span>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"qa-nodes\" id=\"qaNodes\">\u003c/div>\n            \u003cdiv class=\"qa-result-actions\">\n              \u003cbutton class=\"btn btn-primary\" type=\"button\" id=\"qaGenerateVariant\">生成靶向变式\u003c/button>\n              \u003cbutton class=\"btn btn-ghost\" type=\"button\" id=\"qaResetResult\">重新开始\u003c/button>\n              \u003cspan class=\"small muted\">建议先把每一步讲明白，再做变式。\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\" id=\"qaVariantSection\" hidden>\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>靶向变式\u003c/h2>\u003cp>换一个情境，检验刚才的方法能不能迁移。\u003c/p>\u003c/div>\u003cspan class=\"tag tag-green\" id=\"qaVariantSkill\">变式训练\u003c/span>\u003c/div>\n          \u003cdiv class=\"card-body\" id=\"qaVariantBody\">\u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card qa-history\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>我的答疑记录\u003c/h2>\u003cp>只保存在当前浏览器，最多保留 12 条；可随时载入继续想。\u003c/p>\u003c/div>\u003cbutton class=\"btn btn-ghost btn-sm\" type=\"button\" id=\"qaClearHistory\">清空记录\u003c/button>\u003c/div>\n          \u003cdiv class=\"card-body\" id=\"qaHistoryBody\">\u003cdiv class=\"qa-empty-small\">还没有答疑记录。完成一次拆解后，这里会自动保存。\u003c/div>\u003c/div>\n        \u003c/section>\n      \u003c/div>\n\n      \u003caside class=\"stack\">\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>模型状态\u003c/h2>\u003cp>演示模式与真实模型会自动切换。\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cdiv class=\"qa-model-status\">\u003cspan class=\"status-dot amber\" id=\"qaModelDot\">\u003c/span>\u003cdiv>\u003cstrong id=\"qaModelName\">演示模式\u003c/strong>\u003csmall id=\"qaModelBase\">未配置 API Key\u003c/small>\u003c/div>\u003c/div>\n            \u003cp class=\"qa-model-hint\" id=\"qaModelHint\">未配置 Key 时使用内置示例题，所有功能可点通。\u003c/p>\n            \u003ca class=\"btn btn-secondary btn-sm btn-block\" href=\"settings.html\">打开设置 · 配置模型\u003c/a>\n            \u003cdiv class=\"privacy-note\" style=\"margin-top:12px;\">\u003cstrong>免费模型提醒：\u003c/strong>同学源码包里没有可直接使用的免费 Key。可在设置页一键填入 DeepSeek、Gemini、智谱或硅基流动的接口，免费额度需你自己注册获取，不要共用他人的 Key。\u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>使用步骤\u003c/h2>\u003cp>三步，不急着看答案。\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003col class=\"qa-steps qa-steps-compact\">\n              \u003cli>\u003cb>1\u003c/b>\u003cdiv>\u003cstrong>写一句自己的思路\u003c/strong>\u003cspan>哪怕不完整，也先写下来。\u003c/span>\u003c/div>\u003c/li>\n              \u003cli>\u003cb>2\u003c/b>\u003cdiv>\u003cstrong>按需取提示\u003c/strong>\u003cspan>方向 → 原理 → 规范解析。\u003c/span>\u003c/div>\u003c/li>\n              \u003cli>\u003cb>3\u003c/b>\u003cdiv>\u003cstrong>讲明白 + 做变式\u003c/strong>\u003cspan>能迁移，才算真的会。\u003c/span>\u003c/div>\u003c/li>\n            \u003c/ol>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>本次学习\u003c/h2>\u003cp>只统计当前这道题。\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card-body\">\n            \u003cdiv class=\"qa-side-stats\">\n              \u003cdiv>\u003cstrong id=\"qaSideMastered\">0 / 0\u003c/strong>\u003cspan>已掌握步骤\u003c/span>\u003c/div>\n              \u003cdiv>\u003cstrong id=\"qaSideRate\">0%\u003c/strong>\u003cspan>独立思考率\u003c/span>\u003c/div>\n              \u003cdiv>\u003cstrong id=\"qaSideThoughts\">0\u003c/strong>\u003cspan>写下思路\u003c/span>\u003c/div>\n              \u003cdiv>\u003cstrong id=\"qaSideHints\">0\u003c/strong>\u003cspan>使用提示\u003c/span>\u003c/div>\n            \u003c/div>\n            \u003cp class=\"qa-side-note\" id=\"qaSideNote\">完成一次拆解后，这里会显示你的思考轨迹。\u003c/p>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-header\">\u003cdiv>\u003ch2>最近答疑\u003c/h2>\u003cp>点一条可继续上次的进度。\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card-body\" id=\"qaRecent\">\u003cdiv class=\"qa-empty-small\">还没有记录。\u003c/div>\u003c/div>\n        \u003c/section>\n      \u003c/aside>\n    \u003c/div>\n\n    \u003csection class=\"section\">\n      \u003cdiv class=\"alert alert-warning\">\u003cspan class=\"alert-icon\">!\u003c/span>\u003cdiv>\u003cstrong>使用边界：\u003c/strong>助手用于课后思考引导，不替代教师讲评，也不直接代写作业。AI 生成的解析、提示与变式可能存在错误，请以教材、教师讲解和实验事实为准；涉及真实学生姓名、学号、手写作业原图时，请先脱敏并取得授权。\u003c/div>\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"site-footer\">\u003c/div>\n  \n  \n","style":"","script":"\n    (function () {\n      'use strict';\n      var CH = window.ChemHub;\n      var user = CH.setupPage({ active: 'after', title: '课后答疑助手 · 知行化学' });\n      if (!user) return;\n\n      var HISTORY_KEY = 'chemhub_qa_history_v1';\n      var MAX_IMAGES = 4;\n      var MAX_HISTORY = 12;\n\n      var MODE_OPTIONS = [\n        { id: 'auto', label: '自动识别' },\n        { id: 'industrial', label: '工业流程' },\n        { id: 'organic', label: '有机推断' },\n        { id: 'experiment', label: '实验探究' },\n        { id: 'principle', label: '反应原理' },\n        { id: 'calculation', label: '计算题' },\n        { id: 'other', label: '其他综合' }\n      ];\n\n      var state = {\n        mode: 'auto',\n        images: [],\n        topic: null,\n        progress: {},\n        variant: null,\n        busy: false,\n        historyId: ''\n      };\n\n      var els = {\n        modeTabs: document.getElementById('modeTabs'),\n        text: document.getElementById('qaText'),\n        drop: document.getElementById('qaDrop'),\n        file: document.getElementById('qaFile'),\n        thumbs: document.getElementById('qaThumbs'),\n        analyze: document.getElementById('qaAnalyze'),\n        reset: document.getElementById('qaReset'),\n        inline: document.getElementById('qaInline'),\n        status: document.getElementById('qaStatus'),\n        welcome: document.getElementById('qaWelcome'),\n        result: document.getElementById('qaResult'),\n        title: document.getElementById('qaTitle'),\n        goal: document.getElementById('qaGoal'),\n        modeTag: document.getElementById('qaModeTag'),\n        demoTAG: document.getElementById('qaDemoTag'),\n        tags: document.getElementById('qaTags'),\n        nodes: document.getElementById('qaNodes'),\n        progressLabel: document.getElementById('qaProgressLabel'),\n        mastered: document.getElementById('qaMastered'),\n        hintCount: document.getElementById('qaHintCount'),\n        thoughtCount: document.getElementById('qaThoughtCount'),\n        rate: document.getElementById('qaRate'),\n        meter: document.getElementById('qaMeter'),\n        sideMastered: document.getElementById('qaSideMastered'),\n        sideRate: document.getElementById('qaSideRate'),\n        sideThoughts: document.getElementById('qaSideThoughts'),\n        sideHints: document.getElementById('qaSideHints'),\n        sideNote: document.getElementById('qaSideNote'),\n        generateVariant: document.getElementById('qaGenerateVariant'),\n        resetResult: document.getElementById('qaResetResult'),\n        variantSection: document.getElementById('qaVariantSection'),\n        variantBody: document.getElementById('qaVariantBody'),\n        variantSkill: document.getElementById('qaVariantSkill'),\n        historyBody: document.getElementById('qaHistoryBody'),\n        recent: document.getElementById('qaRecent'),\n        clearHistory: document.getElementById('qaClearHistory'),\n        modelBadge: document.getElementById('qaModelBadge'),\n        modelDot: document.getElementById('qaModelDot'),\n        modelName: document.getElementById('qaModelName'),\n        modelBase: document.getElementById('qaModelBase'),\n        modelHint: document.getElementById('qaModelHint')\n      };\n\n      var DEMO_TOPICS = {\n        lithium: {\n          id: 'li_battery',\n          mode: 'industrial',\n          title: '废旧锂电池正极材料（LiCoO₂）回收制备 Co₃O₄',\n          core_goal: '沿“碱浸—还原浸出—调 pH 除铁—沉钴煅烧”的流程，建立物料去向、氧化还原与条件控制的分析链。',\n          raw_text: '某废旧锂电池正极材料主要含 LiCoO₂，还含少量 Al、Fe。某小组设计如下回收流程：① 用 NaOH 溶液碱浸；② 向滤渣中加入 H₂SO₄ 和 H₂O₂ 酸浸；③ 调节 pH 除去 Fe³⁺；④ 加入 Na₂CO₃ 沉钴，过滤、洗涤、煅烧得到 Co₃O₄。回答：每一步的作用、H₂O₂ 的作用、调 pH 的原理，以及煅烧时 Co 的化合价变化。',\n          knowledge_tags: ['工业流程', '氧化还原', 'pH 调控', '绿色化学'],\n          nodes: [\n            {\n              id: 'li_1',\n              step_name: '① 碱浸除铝',\n              material_change: 'Al 与 NaOH 反应生成 NaAlO₂ 和 H₂；LiCoO₂ 不溶于碱，留在滤渣中。',\n              scaffold_question: '为什么第一步先用 NaOH 碱浸，而不是直接酸浸？',\n              hint_level_1: '先看 Al 的两性：它既能与酸反应，也能与强碱反应。',\n              hint_level_2: '若先酸浸，Al 也会进入溶液，后续除铝更麻烦；碱浸能把 Al 选择性溶解。',\n              key_equation: '2Al + 2NaOH + 2H₂O → 2NaAlO₂ + 3H₂↑',\n              trap_alert: '不要写成 Al + NaOH → …… 未配平，也不要漏掉水。'\n            },\n            {\n              id: 'li_2',\n              step_name: '② 还原浸出',\n              material_change: 'LiCoO₂ 中 Co 为 +3；H₂O₂ 作还原剂，把 Co(III) 还原为 Co²⁺，便于酸溶。',\n              scaffold_question: 'H₂O₂ 在这里为什么作还原剂？请从 Co 的化合价变化说明。',\n              hint_level_1: 'LiCoO₂ 中 Li 为 +1、O 为 -2，可以算出 Co 的平均化合价。',\n              hint_level_2: 'Co 从 +3 降到 +2，需要得到电子；H₂O₂ 中的 O 从 -1 升到 0，失去电子。',\n              key_equation: '2LiCoO₂ + 3H₂SO₄ + H₂O₂ → Li₂SO₄ + 2CoSO₄ + O₂↑ + 4H₂O',\n              trap_alert: 'H₂O₂ 只写“氧化剂”会丢分；这里的角色是还原剂，注意 Co 被还原。'\n            },\n            {\n              id: 'li_3',\n              step_name: '③ 调 pH 除铁',\n              material_change: 'Fe³⁺ 水解生成 Fe(OH)₃ 沉淀；pH 不能过高，否则 Co²⁺ 也会沉淀。',\n              scaffold_question: '调 pH 为什么能除铁？pH 过大有什么后果？',\n              hint_level_1: '从 Fe³⁺ 的水解平衡出发，增大 pH 会促进水解。',\n              hint_level_2: '不同金属氢氧化物的 Ksp 不同；pH 过高时 Co(OH)₂ 也可能析出。',\n              key_equation: 'Fe³⁺ + 3H₂O ⇌ Fe(OH)₃ + 3H⁺',\n              trap_alert: '不要只写 Fe³⁺ + 3OH⁻，要说明调 pH 促进水解、把 Fe³⁺ 转为沉淀。'\n            },\n            {\n              id: 'li_4',\n              step_name: '④ 沉钴与煅烧',\n              material_change: 'Co²⁺ 与 CO₃²⁻ 生成 CoCO₃ 沉淀；煅烧时 Co 由 +2 氧化为 Co₃O₄ 中的 +2 和 +3，需要氧气。',\n              scaffold_question: '沉钴后为什么还要煅烧？Co 的化合价怎样变化？',\n              hint_level_1: 'CoCO₃ 难溶，先把它从溶液中分离出来；煅烧可得到氧化物。',\n              hint_level_2: 'Co₃O₄ 可看作 CoO·Co₂O₃，其中同时有 +2 和 +3 的 Co。',\n              key_equation: 'Co²⁺ + CO₃²⁻ → CoCO₃↓；6CoCO₃ + O₂ → 2Co₃O₄ + 6CO₂',\n              trap_alert: '煅烧不是在空气中简单分解；Co 被氧化，Co₃O₄ 中 Co 有 +2 和 +3。'\n            }\n          ],\n          offline_variant: {\n            question: '关于该回收流程，下列说法正确的是（ ）',\n            options: [\n              '碱浸的目的是让 LiCoO₂ 溶解，便于后续酸浸',\n              '酸浸时加入 H₂O₂ 可将 Co(III) 还原为 Co(II)，提高浸出率',\n              '调 pH 除铁时，pH 越高除铁效果一定越好',\n              '煅烧 CoCO₃ 得到 Co₃O₄ 的过程中，钴元素化合价不变'\n            ],\n            answer: 'B',\n            analysis: 'A 错，碱浸溶解 Al，LiCoO₂ 留在滤渣；B 对；C 错，pH 过高会使 Co²⁺ 沉淀；D 错，Co 由 +2 变为 +2 和 +3。',\n            target_skill: '氧化还原与条件控制'\n          }\n        },\n        organic: {\n          id: 'organic_ester',\n          mode: 'organic',\n          title: '对羟基苯甲酸乙酯类合成路线分析',\n          core_goal: '用苯环定位效应与官能团保护顺序，判断有机合成路线是否合理。',\n          raw_text: '以甲苯为原料合成对羟基苯甲酸乙酯：① 在苯环上引入取代基；② 将甲基氧化为羧基；③ 卤代芳烃水解并酸化；④ 酚羟基与羧基选择性酯化。讨论取代位置、氧化顺序与保护策略。',\n          knowledge_tags: ['有机推断', '定位效应', '官能团保护', '合成路线'],\n          nodes: [\n            {\n              id: 'or_1',\n              step_name: '① 定位与取代',\n              material_change: '—CH₃ 是邻、对位定位基；—COOH 是间位定位基。先引入 —CH₃ 再取代，更容易得到对位产物。',\n              scaffold_question: '若先氧化甲基为羧基，再引入第二个取代基，主要进入什么位置？',\n              hint_level_1: '先判断 —CH₃ 和 —COOH 分别属于哪类定位基。',\n              hint_level_2: '—COOH 是间位定位基，所以第二个取代基主要进入其间位，而不是对位。',\n              key_equation: 'C₆H₅CH₃ + Cl₂ →（FeCl₃）邻/对氯甲苯',\n              trap_alert: '不要把 —COOH 也当成邻对位定位基；定位效应看的是原有取代基。'\n            },\n            {\n              id: 'or_2',\n              step_name: '② 氧化顺序',\n              material_change: '—CH₃ 可被 KMnO₄(H⁺) 氧化为 —COOH；酚羟基容易被氧化，通常先氧化甲基，再引入或保护酚羟基。',\n              scaffold_question: '为什么通常先氧化甲基，而不是先引入酚羟基？',\n              hint_level_1: '酚羟基具有还原性，容易被强氧化剂氧化。',\n              hint_level_2: '若先引入酚羟基，再用 KMnO₄ 氧化甲基，酚羟基可能被破坏。',\n              key_equation: 'C₆H₅CH₃ + 3[O] → C₆H₅COOH + H₂O（示意）',\n              trap_alert: '忽略酚羟基被氧化，会导致合成顺序判断错误。'\n            },\n            {\n              id: 'or_3',\n              step_name: '③ 卤代芳烃水解',\n              material_change: '卤代芳烃在 NaOH 水溶液中水解，酸化后得到酚；若先水解再氧化，需考虑酚羟基的保护。',\n              scaffold_question: '卤代芳烃水解后为什么要酸化？',\n              hint_level_1: '碱性水解得到的是酚钠，不是酚。',\n              hint_level_2: '酚钠加酸后才转化为酚；不酸化，产物状态会写错。',\n              key_equation: 'Ar—Cl + 2NaOH → Ar—ONa + NaCl + H₂O；Ar—ONa + HCl → Ar—OH + NaCl',\n              trap_alert: '只写水解不写酸化，把产物写成酚钠，是常见失分点。'\n            },\n            {\n              id: 'or_4',\n              step_name: '④ 选择性酯化',\n              material_change: '酚羟基与羧基都可酯化，但酚羟基酯化较难；用乙醇和浓硫酸时主要酯化羧基，需控制条件。',\n              scaffold_question: '如何让乙醇主要与羧基酯化，而不与酚羟基反应？',\n              hint_level_1: '羧酸与醇的酯化在酸催化、加热条件下较容易进行。',\n              hint_level_2: '酚羟基的酯化通常需要更活泼的酰化试剂；控制条件可实现选择性。',\n              key_equation: 'C₆H₄(OH)COOH + C₂H₅OH ⇌ C₆H₄(OH)COOC₂H₅ + H₂O',\n              trap_alert: '不写可逆号与浓硫酸条件；也不要把两个羟基都酯化。'\n            }\n          ],\n          offline_variant: {\n            question: '关于该合成路线，下列说法正确的是（ ）',\n            options: [\n              '先引入酚羟基再氧化甲基，可以避免酚羟基被氧化',\n              '—COOH 是邻对位定位基，因此第二个取代基主要进入其对位',\n              '先氧化甲基再引入酚羟基，有利于避免酚羟基在强氧化条件下被破坏',\n              '酚羟基与羧基的酯化能力相同，不需要控制反应条件'\n            ],\n            answer: 'C',\n            analysis: 'A 错，酚羟基容易被氧化；B 错，—COOH 是间位定位基；C 对；D 错，二者酯化难易不同，需要控制条件。',\n            target_skill: '定位效应与合成顺序'\n          }\n        },\n        equilibrium: {\n          id: 'so2_equilibrium',\n          mode: 'principle',\n          title: '密闭容器中 SO₂ 催化氧化平衡分析',\n          core_goal: '用三段式、平衡常数与条件变化，判断转化率和平衡移动。',\n          raw_text: '在 2 L 密闭容器中充入 2 mol SO₂ 和 1 mol O₂，一定温度下发生反应 2SO₂(g) + O₂(g) ⇌ 2SO₃(g)，平衡时 SO₃ 为 1.2 mol。求 SO₂、O₂ 的转化率和该温度下的平衡常数；并判断升温、压缩体积、加催化剂对平衡的影响。',\n          knowledge_tags: ['化学平衡', '三段式', '平衡常数', '条件变化'],\n          nodes: [\n            {\n              id: 'eq_1',\n              step_name: '① 建立三段式',\n              material_change: '起始：SO₂ 2 mol、O₂ 1 mol、SO₃ 0；平衡 SO₃ 1.2 mol，则 SO₂ 0.8 mol、O₂ 0.4 mol。',\n              scaffold_question: '平衡时 SO₃ 为 1.2 mol，如何用“起始—变化—平衡”三段式表示三种物质的量？',\n              hint_level_1: '设 SO₂ 转化了 2x mol，则 O₂ 转化 x mol，SO₃ 生成 2x mol。',\n              hint_level_2: '2x = 1.2，所以 x = 0.6；再代回起始量，得到平衡量。',\n              key_equation: '2SO₂ + O₂ ⇌ 2SO₃',\n              trap_alert: '不要把物质的量直接当浓度；容器体积是 2 L，算 K 前要除以体积。'\n            },\n            {\n              id: 'eq_2',\n              step_name: '② 算转化率与 K',\n              material_change: 'c(SO₂)=0.4、c(O₂)=0.2、c(SO₃)=0.6 mol/L；α(SO₂)=60%，α(O₂)=60%；K=0.6²/(0.4²×0.2)=11.25。',\n              scaffold_question: '转化率和平衡常数分别怎么算？为什么 K 的表达式不带固体或纯液体？',\n              hint_level_1: '转化率 = 变化量 ÷ 起始量；K 用平衡浓度，不用起始浓度。',\n              hint_level_2: 'K = c²(SO₃) / [c²(SO₂)·c(O₂)]，代入 0.6、0.4、0.2。',\n              key_equation: 'K = c²(SO₃) / [c²(SO₂)·c(O₂)]',\n              trap_alert: 'O₂ 的指数是 1，不要写成 2；SO₂ 和 SO₃ 的指数才是 2。'\n            },\n            {\n              id: 'eq_3',\n              step_name: '③ 条件变化',\n              material_change: '升温：正、逆速率都增大，平衡逆向移动，SO₂ 转化率减小，K 减小；压缩体积：正、逆速率都增大，平衡正向移动，转化率增大，K 不变；加催化剂：速率增大，平衡不移动。',\n              scaffold_question: '升温、压缩体积、加催化剂分别怎样影响速率、平衡移动和 K？',\n              hint_level_1: '先看反应热：SO₂ 催化氧化是放热反应，ΔH \u003c 0。',\n              hint_level_2: '催化剂只改变速率，不改变平衡状态；K 只随温度变化。',\n              key_equation: '2SO₂ + O₂ ⇌ 2SO₃  ΔH \u003c 0',\n              trap_alert: '不要把“加压”与“加催化剂”混为一谈；也不要认为 K 随压强变化。'\n            }\n          ],\n          offline_variant: {\n            question: '对于反应 2SO₂(g) + O₂(g) ⇌ 2SO₃(g) ΔH \u003c 0，下列叙述正确的是（ ）',\n            options: [\n              '升高温度，正、逆反应速率均增大，SO₂ 的平衡转化率增大',\n              '压缩容器体积，正、逆反应速率均增大，SO₂ 的平衡转化率增大',\n              '加入催化剂，SO₂ 的平衡转化率增大',\n              '平衡时，c(SO₃) = c(SO₂)'\n            ],\n            answer: 'B',\n            analysis: 'A 错，升温平衡逆向移动，转化率减小；B 对，压缩体积平衡正向移动；C 错，催化剂不移动平衡；D 错，二者浓度不一定相等。',\n            target_skill: '平衡移动与 K 的理解'\n          }\n        },\n        carbonate: {\n          id: 'carbonate_mix',\n          mode: 'experiment',\n          title: '加热法测定 NaHCO₃ 与 Na₂CO₃ 混合物组成',\n          core_goal: '用质量差法、守恒关系和气体体积，完成混合物组成计算与误差分析。',\n          raw_text: '取 5.00 g NaHCO₃ 与 Na₂CO₃ 的混合物，加热至质量不再变化，固体质量变为 3.45 g。向剩余固体中加入足量稀盐酸，收集到 CO₂（标准状况）。求 NaHCO₃ 的质量分数和 CO₂ 体积。',\n          knowledge_tags: ['实验计算', '质量差法', '守恒', '误差分析'],\n          nodes: [\n            {\n              id: 'ca_1',\n              step_name: '① 质量差来源',\n              material_change: '2NaHCO₃ → Na₂CO₃ + H₂O↑ + CO₂↑；每 2 mol NaHCO₃（168 g）加热后固体减少 62 g。',\n              scaffold_question: '加热后固体质量为什么减少？减少的是什么？',\n              hint_level_1: 'NaHCO₃ 受热分解，生成物中有气体和水蒸气。',\n              hint_level_2: 'H₂O 和 CO₂ 都逸出，所以质量差是二者之和，不是只有 CO₂。',\n              key_equation: '2NaHCO₃ → Na₂CO₃ + H₂O↑ + CO₂↑',\n              trap_alert: '只减 CO₂、漏掉水蒸气，是这类题最常见的错误。'\n            },\n            {\n              id: 'ca_2',\n              step_name: '② 求 NaHCO₃ 质量分数',\n              material_change: '质量损失 1.55 g；n(NaHCO₃)=1.55/62×2=0.05 mol；m=4.2 g；质量分数=84%。',\n              scaffold_question: '如何由 1.55 g 质量差求 NaHCO₃ 的质量？',\n              hint_level_1: '先找质量差与 NaHCO₃ 物质的量的比例关系。',\n              hint_level_2: '2 mol NaHCO₃ 对应 62 g 质量差，所以 1.55 g 对应 0.05 mol。',\n              key_equation: 'm(NaHCO₃) = 1.55 ÷ 62 × 2 × 84 g',\n              trap_alert: '不要把 62 g 当成 1 mol NaHCO₃ 的质量差；比例是 2 mol 对 62 g。'\n            },\n            {\n              id: 'ca_3',\n              step_name: '③ 加酸产气与误差',\n              material_change: '剩余固体 3.45 g 全为 Na₂CO₃，n=3.45/106=0.03255 mol；CO₂ 体积=0.03255×22.4=0.729 L。若加热不充分，质量差偏小，NaHCO₃ 质量分数偏低。',\n              scaffold_question: '剩余固体与盐酸反应产生多少 CO₂？加热不充分会使结果偏高还是偏低？',\n              hint_level_1: 'Na₂CO₃ 与盐酸反应，1 mol Na₂CO₃ 生成 1 mol CO₂。',\n              hint_level_2: '标准状况下气体摩尔体积为 22.4 L/mol；质量差偏小，算出的 NaHCO₃ 偏少。',\n              key_equation: 'Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑',\n              trap_alert: '忘记标准状况的 22.4 L/mol，或把剩余固体质量当成 NaHCO₃ 的质量。'\n            }\n          ],\n          offline_variant: {\n            question: '若加热不充分，按上述质量差法测得的 NaHCO₃ 质量分数会（ ）',\n            options: ['偏高', '偏低', '不变', '无法判断'],\n            answer: 'B',\n            analysis: '加热不充分，质量损失偏小，由质量差算出的 NaHCO₃ 偏少，因此质量分数偏低。',\n            target_skill: '质量差法与误差分析'\n          }\n        }\n      };\n\n      function asText(value) {\n        if (value === null || value === undefined) return '';\n        if (typeof value === 'string') return value.trim();\n        if (typeof value === 'number') return String(value);\n        if (Array.isArray(value)) {\n          return value.map(function (item) { return asText(item); }).filter(Boolean).join('；');\n        }\n        if (typeof value === 'object') {\n          return String(value.text || value.comment || value.description || value.value || '').trim();\n        }\n        return '';\n      }\n\n      function textBlock(value) {\n        return CH.escapeHTML(asText(value)).replace(/\\n/g, '\u003cbr>');\n      }\n\n      function clone(value) {\n        return JSON.parse(JSON.stringify(value));\n      }\n\n      function delay(ms) {\n        return new Promise(function (resolve) { setTimeout(resolve, ms); });\n      }\n\n      function modeLabel(mode) {\n        var found = MODE_OPTIONS.filter(function (item) { return item.id === mode; })[0];\n        return found ? found.label : '其他综合';\n      }\n\n      function normalizeMode(value, fallback) {\n        var raw = String(value || '').toLowerCase();\n        if (/industrial|工业|流程/.test(raw)) return 'industrial';\n        if (/organic|有机|推断/.test(raw)) return 'organic';\n        if (/experiment|实验|探究/.test(raw)) return 'experiment';\n        if (/principle|原理|平衡/.test(raw)) return 'principle';\n        if (/calculation|计算|溶液|定量/.test(raw)) return 'calculation';\n        if (/other|综合|其他/.test(raw)) return 'other';\n        return fallback || 'other';\n      }\n\n      fun
